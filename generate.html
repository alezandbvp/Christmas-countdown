<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Radio • Duration Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #10131a;
            color: white;
        }

        body {
            padding: 30px 15px;
        }

        .container {
            width: min(900px, 100%);
            margin: auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 22px;
            padding: 28px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(28px, 6vw, 44px);
        }

        .subtitle {
            margin: 0 0 25px;
            opacity: 0.7;
        }

        .status {
            padding: 15px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.25);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .progress {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #fff;
            transition: width 0.2s ease;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 14px;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: white;
            color: #10131a;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .song-list {
            margin-top: 25px;
            display: grid;
            gap: 8px;
        }

        .song {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 10px 12px;
            border-radius: 9px;
            background: rgba(255, 255, 255, 0.04);
            font-size: 14px;
        }

        .song-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .duration {
            opacity: 0.65;
            white-space: nowrap;
        }

        .error {
            color: #ff8c8c;
        }

        .success {
            color: #8cffb0;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <h1>Christmas Radio</h1>
        <p class="subtitle">Generate the hosted song duration manifest</p>

        <div id="status" class="status">
            Ready to scan the 36 Christmas songs.
        </div>

        <div class="progress">
            <div id="progressBar" class="progress-bar"></div>
        </div>

        <button id="generateButton">
            Generate durations.json
        </button>

        <div id="songList" class="song-list"></div>

    </div>
</div>

<script>
    /*
        The songs are already hosted on the website.

        The generator does NOT try to open ./songs/.
        It directly checks each known MP3 URL.
    */

    const SONG_FOLDER = "./songs/";

    const FILE_PREFIX =
        "Music Now, Trap Music Now, Dance Music Now - ";

    const FILE_SUFFIX =
        " (SPOTISAVER).mp3";


    const SONG_NAMES = [
        "All I Want For Christmas Is You",
        "Baby It's Cold Outside",
        "Blue Christmas",
        "Carol Of The Bells",
        "Christmas (Baby Please Come Home)",
        "Christmas Canon",
        "Deck The Halls",
        "Do You Want To Build A Snowman",
        "Feliz Navidad",
        "Frosty The Snowman",
        "God Rest Ye Merry Gentlemen",
        "Here Comes Santa Claus",
        "Holly Jolly Christmas",
        "I Want A Hippopotamus For Christmas",
        "It's Beginning To Look A Lot Like Christmas",
        "It's The Most Wonderful Time Of The Year",
        "Jingle Bell Rock",
        "Jingle Bells",
        "Last Christmas",
        "Let It Snow! Let It Snow!",
        "Little Drummer Boy",
        "Mistletoe",
        "O Christmas Tree",
        "Rockin Around The Christmas Tree",
        "Rudolph The Red-Nosed Reindeer",
        "Santa Baby",
        "Santa Claus Is Comin' To Town",
        "Silent Night",
        "Sleigh Ride",
        "The Christmas Song",
        "Up On The Housetop",
        "We Wish You A Merry Christmas",
        "White Christmas",
        "Winter Wonderland",
        "Wonderful Christmastime",
        "You're A Mean One, Mr. Grinch"
    ];


    const statusElement =
        document.getElementById("status");

    const progressBar =
        document.getElementById("progressBar");

    const generateButton =
        document.getElementById("generateButton");

    const songList =
        document.getElementById("songList");


    function getFilename(songName) {
        return FILE_PREFIX + songName + FILE_SUFFIX;
    }


    function getSongURL(songName) {
        return SONG_FOLDER +
            encodeURIComponent(getFilename(songName));
    }


    function formatDuration(seconds) {
        if (!Number.isFinite(seconds)) {
            return "--:--";
        }

        const totalSeconds = Math.floor(seconds);

        const minutes = Math.floor(totalSeconds / 60);
        const remainingSeconds = totalSeconds % 60;

        return (
            String(minutes).padStart(2, "0") +
            ":" +
            String(remainingSeconds).padStart(2, "0")
        );
    }


    function createSongElement(songName) {
        const element = document.createElement("div");

        element.className = "song";

        element.innerHTML = `
            <span class="song-name">
                ${escapeHTML(songName)}
            </span>

            <span
                class="duration"
                id="duration-${SONG_NAMES.indexOf(songName)}"
            >
                Waiting...
            </span>
        `;

        songList.appendChild(element);
    }


    function escapeHTML(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }


    function getDuration(songName) {
        return new Promise((resolve, reject) => {

            const audio = document.createElement("audio");

            audio.preload = "metadata";

            let finished = false;

            const timeout = setTimeout(() => {

                if (finished) {
                    return;
                }

                finished = true;

                audio.src = "";

                reject(
                    new Error("Timed out while loading audio")
                );

            }, 20000);


            audio.onloadedmetadata = () => {

                if (finished) {
                    return;
                }

                finished = true;

                clearTimeout(timeout);

                const duration = audio.duration;

                audio.removeAttribute("src");
                audio.load();

                if (
                    Number.isFinite(duration) &&
                    duration > 0
                ) {
                    resolve(duration);
                } else {
                    reject(
                        new Error("Invalid duration")
                    );
                }
            };


            audio.onerror = () => {

                if (finished) {
                    return;
                }

                finished = true;

                clearTimeout(timeout);

                audio.removeAttribute("src");
                audio.load();

                reject(
                    new Error("Could not load MP3")
                );
            };


            audio.src = getSongURL(songName);
        });
    }


    async function generateDurations() {

        generateButton.disabled = true;

        songList.innerHTML = "";

        SONG_NAMES.forEach(createSongElement);

        const songs = [];

        let completed = 0;

        const total = SONG_NAMES.length;

        statusElement.className = "status";

        statusElement.textContent =
            `Checking ${total} hosted songs...`;

        progressBar.style.width = "0%";


        for (let i = 0; i < SONG_NAMES.length; i++) {

            const name = SONG_NAMES[i];

            const durationElement =
                document.getElementById(
                    `duration-${i}`
                );


            statusElement.textContent =
                `Checking ${i + 1} of ${total}: ${name}`;


            try {

                const duration =
                    await getDuration(name);


                songs.push({
                    name: name,
                    file: getFilename(name),
                    duration: Number(
                        duration.toFixed(3)
                    )
                });


                durationElement.textContent =
                    formatDuration(duration);


                durationElement.classList.add(
                    "success"
                );


            } catch (error) {

                console.error(
                    "Failed:",
                    name,
                    error
                );


                durationElement.textContent =
                    "FAILED";

                durationElement.classList.add(
                    "error"
                );


                songs.push({
                    name: name,
                    file: getFilename(name),
                    duration: null,
                    error: true
                });
            }


            completed++;

            progressBar.style.width =
                `${(completed / total) * 100}%`;
        }


        const successfulSongs =
            songs.filter(
                song =>
                    Number.isFinite(song.duration)
            );


        const failedSongs =
            songs.filter(
                song =>
                    !Number.isFinite(song.duration)
            );


        const output = {
            songs: songs
        };


        const json =
            JSON.stringify(
                output,
                null,
                2
            );


        const blob =
            new Blob(
                [json],
                {
                    type: "application/json"
                }
            );


        const url =
            URL.createObjectURL(blob);


        const link =
            document.createElement("a");


        link.href = url;

        link.download = "durations.json";

        document.body.appendChild(link);

        link.click();

        link.remove();

        URL.revokeObjectURL(url);


        if (failedSongs.length === 0) {

            statusElement.className =
                "status success";

            statusElement.textContent =
                `Done! ${successfulSongs.length} songs were processed. durations.json has been downloaded.`;

        } else {

            statusElement.className =
                "status error";

            statusElement.textContent =
                `Finished with ${successfulSongs.length} successful songs and ${failedSongs.length} failed songs. Check the list above.`;
        }


        generateButton.disabled = false;
    }


    generateButton.addEventListener(
        "click",
        generateDurations
    );
</script>

</body>
</html>
