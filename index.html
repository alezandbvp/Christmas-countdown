<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#12030a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Christmas Countdown • Live Radio</title>

    <link rel="icon" href="favicon.ico">

    <style>
        :root {
            --red: #d71939;
            --red-dark: #8b071f;
            --green: #0e6b45;
            --green-dark: #063c29;
            --gold: #ffd76a;
            --white: #fff;
            --glass: rgba(255, 255, 255, 0.11);
            --glass-border: rgba(255, 255, 255, 0.18);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            position: fixed;
            inset: 0;
            color: var(--white);
            background:
                radial-gradient(circle at 20% 15%, rgba(215, 25, 57, 0.28), transparent 35%),
                radial-gradient(circle at 80% 80%, rgba(14, 107, 69, 0.25), transparent 35%),
                #12030a;
        }

        #bg {
            position: fixed;
            inset: -4%;
            width: 108%;
            height: 108%;
            background-image:
                linear-gradient(
                    rgba(15, 0, 5, 0.38),
                    rgba(15, 0, 5, 0.48)
                ),
                url("christmas-background.jpg");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            z-index: -5;
            transform: translateZ(0);
        }

        #container {
            position: relative;
            width: 100%;
            height: 100dvh;
            min-height: 100svh;
            padding:
                max(18px, env(safe-area-inset-top))
                max(18px, env(safe-area-inset-right))
                max(18px, env(safe-area-inset-bottom))
                max(18px, env(safe-area-inset-left));
            display: flex;
            justify-content: center;
            align-items: center;
            isolation: isolate;
        }

        .card {
            position: relative;
            width: min(92vw, 900px);
            padding: 48px 46px 40px;
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            background: var(--glass);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            overflow: visible;
        }

        .live-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 9px 16px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.13);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .live-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #ff2b45;
            box-shadow: 0 0 12px rgba(255, 43, 69, 0.9);
            animation: livePulse 1.4s infinite ease-in-out;
        }

        @keyframes livePulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(0.65);
                opacity: 0.55;
            }
        }

        #title,
        #subtitle {
            margin: 0;
            font-weight: 900;
            line-height: 0.9;
            letter-spacing: -2px;
            text-shadow:
                0 5px 25px rgba(0, 0, 0, 0.45),
                0 0 30px rgba(255, 255, 255, 0.1);
        }

        #title {
            margin-top: 30px;
            font-size: clamp(58px, 10vw, 110px);
            color: #fff;
        }

        #subtitle {
            margin-top: 7px;
            font-size: clamp(42px, 7vw, 78px);
            background: linear-gradient(135deg, #ffffff, var(--gold));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        #countdown {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 58px;
            margin-top: 30px;
            padding: 10px 23px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            font-size: clamp(19px, 3vw, 28px);
            font-weight: 800;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .song-wrapper {
            margin-top: 30px;
        }

        .song-label {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.7;
        }

        #songName {
            margin-top: 8px;
            min-height: 30px;
            font-size: clamp(18px, 3vw, 25px);
            line-height: 1.3;
            font-weight: 800;
            text-shadow: 0 3px 14px rgba(0, 0, 0, 0.35);
        }

        #playButton {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: min(100%, 330px);
            min-height: 54px;
            margin-top: 30px;
            padding: 14px 24px;
            border: 0;
            border-radius: 999px;
            background: linear-gradient(135deg, #e31d3f, #a60829);
            color: #fff;
            font: inherit;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 0.2px;
            cursor: pointer;
            box-shadow:
                0 12px 30px rgba(128, 0, 25, 0.38),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;
            touch-action: manipulation;
        }

        #playButton:active {
            transform: scale(0.97);
        }

        #playButton:hover {
            transform: translateY(-2px);
            box-shadow:
                0 16px 36px rgba(128, 0, 25, 0.48),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        #playButton.paused {
            background: linear-gradient(135deg, #126f4a, #075133);
        }

        #playButton.starting {
            opacity: 0.7;
            pointer-events: none;
        }

        footer {
            margin-top: 30px;
            font-size: 13px;
            opacity: 0.72;
            letter-spacing: 1px;
        }

        .corner-star {
            position: absolute;
            font-size: 28px;
            opacity: 0.75;
            pointer-events: none;
            text-shadow: 0 0 15px rgba(255, 215, 106, 0.7);
        }

        .star-one {
            top: 18px;
            left: 22px;
        }

        .star-two {
            top: 20px;
            right: 24px;
        }

        .star-three {
            bottom: 20px;
            left: 30px;
        }

        .star-four {
            bottom: 20px;
            right: 30px;
        }

        .snow-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 20;
        }

        .snowflake {
            position: absolute;
            top: -30px;
            color: #fff;
            opacity: 0.75;
            pointer-events: none;
            animation-name: snowfall;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            will-change: transform;
        }

        @keyframes snowfall {
            from {
                transform: translate3d(0, -30px, 0) rotate(0deg);
            }

            to {
                transform: translate3d(var(--drift), 110vh, 0) rotate(360deg);
            }
        }

        /* ---------------------------------
           TABLETS / SMALL DESKTOP
        --------------------------------- */

        @media (min-width: 769px) and (max-width: 1100px) {
            .card {
                width: min(90vw, 760px);
                padding: 40px 36px 34px;
            }

            #title {
                font-size: clamp(58px, 9vw, 88px);
            }

            #subtitle {
                font-size: clamp(43px, 7vw, 66px);
            }
        }

        /* ---------------------------------
           IPHONE / PORTRAIT
        --------------------------------- */

        @media (max-width: 768px) and (orientation: portrait) {
            #container {
                padding:
                    max(12px, env(safe-area-inset-top))
                    max(12px, env(safe-area-inset-right))
                    max(12px, env(safe-area-inset-bottom))
                    max(12px, env(safe-area-inset-left));
                align-items: center;
            }

            .card {
                width: min(94vw, 520px);
                padding: 32px 20px 26px;
                border-radius: 25px;
            }

            .live-label {
                padding: 8px 13px;
                font-size: 11px;
                letter-spacing: 1.2px;
            }

            #title {
                margin-top: 23px;
                font-size: clamp(50px, 17vw, 72px);
                letter-spacing: -2.5px;
            }

            #subtitle {
                margin-top: 5px;
                font-size: clamp(36px, 12vw, 54px);
                letter-spacing: -1.5px;
            }

            #countdown {
                width: auto;
                max-width: 100%;
                min-height: 51px;
                margin-top: 23px;
                padding: 9px 16px;
                font-size: clamp(16px, 4.7vw, 21px);
                letter-spacing: 0.5px;
            }

            .song-wrapper {
                margin-top: 23px;
            }

            .song-label {
                font-size: 10px;
                letter-spacing: 1.6px;
            }

            #songName {
                margin-top: 7px;
                min-height: 26px;
                font-size: clamp(16px, 4.7vw, 20px);
                line-height: 1.25;
            }

            #playButton {
                width: min(88vw, 310px);
                min-height: 52px;
                margin-top: 23px;
                padding: 13px 18px;
                font-size: 15px;
            }

            footer {
                margin-top: 22px;
                font-size: 11px;
            }

            .corner-star {
                font-size: 22px;
            }

            .star-one {
                top: 13px;
                left: 15px;
            }

            .star-two {
                top: 14px;
                right: 16px;
            }

            .star-three {
                bottom: 14px;
                left: 18px;
            }

            .star-four {
                bottom: 14px;
                right: 18px;
            }
        }

        /* ---------------------------------
           SHORT IPHONE PORTRAIT
        --------------------------------- */

        @media (max-width: 768px) and (orientation: portrait) and (max-height: 700px) {
            .card {
                padding-top: 26px;
                padding-bottom: 21px;
            }

            #title {
                margin-top: 18px;
                font-size: clamp(45px, 15vw, 62px);
            }

            #subtitle {
                font-size: clamp(33px, 10.5vw, 48px);
            }

            #countdown {
                margin-top: 17px;
                min-height: 46px;
            }

            .song-wrapper {
                margin-top: 18px;
            }

            #playButton {
                margin-top: 18px;
                min-height: 49px;
            }

            footer {
                margin-top: 16px;
            }
        }

        /* ---------------------------------
           VERY SHORT PORTRAIT
        --------------------------------- */

        @media (max-width: 768px) and (orientation: portrait) and (max-height: 590px) {
            .card {
                padding: 21px 18px 17px;
            }

            .live-label {
                padding: 7px 11px;
            }

            #title {
                margin-top: 14px;
                font-size: 44px;
            }

            #subtitle {
                font-size: 32px;
            }

            #countdown {
                margin-top: 14px;
                min-height: 42px;
                font-size: 15px;
            }

            .song-wrapper {
                margin-top: 14px;
            }

            #songName {
                font-size: 15px;
            }

            #playButton {
                margin-top: 14px;
                min-height: 46px;
                font-size: 14px;
            }

            footer {
                display: none;
            }
        }

        /* ---------------------------------
           PHONE LANDSCAPE
        --------------------------------- */

        @media (max-width: 900px) and (orientation: landscape) {
            #container {
                padding:
                    max(8px, env(safe-area-inset-top))
                    max(12px, env(safe-area-inset-right))
                    max(8px, env(safe-area-inset-bottom))
                    max(12px, env(safe-area-inset-left));
            }

            .card {
                width: min(94vw, 850px);
                max-height: calc(100dvh - 16px);
                padding: 20px 30px 17px;
                border-radius: 23px;
            }

            .live-label {
                padding: 6px 12px;
                font-size: 10px;
            }

            #title {
                margin-top: 13px;
                font-size: clamp(36px, 9vw, 60px);
            }

            #subtitle {
                font-size: clamp(27px, 6vw, 44px);
            }

            #countdown {
                min-height: 39px;
                margin-top: 13px;
                padding: 6px 15px;
                font-size: clamp(14px, 2.8vw, 18px);
            }

            .song-wrapper {
                margin-top: 13px;
            }

            .song-label {
                font-size: 9px;
            }

            #songName {
                margin-top: 4px;
                min-height: 20px;
                font-size: clamp(14px, 2.8vw, 18px);
            }

            #playButton {
                width: min(55vw, 300px);
                min-height: 43px;
                margin-top: 13px;
                padding: 9px 17px;
                font-size: 13px;
            }

            footer {
                display: none;
            }

            .corner-star {
                font-size: 19px;
            }
        }

        /* ---------------------------------
           EXTREMELY SHORT LANDSCAPE
        --------------------------------- */

        @media (orientation: landscape) and (max-height: 430px) {
            .card {
                padding: 13px 25px 11px;
            }

            #title {
                margin-top: 8px;
                font-size: 36px;
            }

            #subtitle {
                font-size: 27px;
            }

            #countdown {
                margin-top: 8px;
                min-height: 34px;
                font-size: 13px;
            }

            .song-wrapper {
                margin-top: 8px;
            }

            #playButton {
                margin-top: 8px;
                min-height: 37px;
                font-size: 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <div id="bg"></div>

    <div id="snowFar" class="snow-layer"></div>

    <main id="container">
        <section class="card">

            <div class="corner-star star-one">✦</div>
            <div class="corner-star star-two">✦</div>
            <div class="corner-star star-three">✦</div>
            <div class="corner-star star-four">✦</div>

            <div class="live-label">
                <span class="live-dot"></span>
                Christmas Radio
            </div>

            <h1 id="title">Christmas</h1>
            <h1 id="subtitle">Countdown</h1>

            <div id="countdown">Loading...</div>

            <div class="song-wrapper">
                <div class="song-label">Now Playing</div>
                <div id="songName">Christmas Radio</div>
            </div>

            <button id="playButton" type="button" aria-pressed="false">
                🎄 Start Live Radio
            </button>

            <footer>❄️ Merry Christmas ❄️</footer>
        </section>
    </main>

    <div id="snowMid" class="snow-layer"></div>
    <div id="snowNear" class="snow-layer"></div>

    <!--
        Hidden native audio elements.

        Native <audio> is intentionally used instead of exposing
        an audio player. This gives mobile browsers a better chance
        of continuing playback while the device is locked/backgrounded.
    -->
    <audio
        id="musicAudio"
        preload="auto"
        playsinline
        webkit-playsinline
        controlslist="nodownload noplaybackrate nofullscreen"
        disablepictureinpicture
        tabindex="-1">
    </audio>

    <audio
        id="speechAudio"
        preload="auto"
        playsinline
        webkit-playsinline
        controlslist="nodownload noplaybackrate nofullscreen"
        disablepictureinpicture
        tabindex="-1">
    </audio>

    <script>
        "use strict";

        /* =========================================================
           CONFIG
        ========================================================= */

        const RADIO_START = new Date("Dec 1, 2025 00:00:00").getTime();

        const SONG_NAMES = [
            "All I Want For Christmas Is You",
            "Baby It's Cold Outside",
            "Blue Christmas",
            "Carol Of The Bells",
            "Christmas (Baby Please Come Home)",
            "Christmas Canon",
            "Deck The Halls",
            "Do You Want To Build A Snowman",
            "Feliz Navidad",
            "Frosty The Snowman",
            "God Rest Ye Merry Gentlemen",
            "Here Comes Santa Claus",
            "Holly Jolly Christmas",
            "I Want A Hippopotamus For Christmas",
            "It's Beginning To Look A Lot Like Christmas",
            "It's The Most Wonderful Time Of The Year",
            "Jingle Bell Rock",
            "Jingle Bells",
            "Last Christmas",
            "Let It Snow! Let It Snow!",
            "Little Drummer Boy",
            "Mistletoe",
            "O Christmas Tree",
            "Rockin Around The Christmas Tree",
            "Rudolph The Red-Nosed Reindeer",
            "Santa Baby",
            "Santa Claus Is Comin' To Town",
            "Silent Night",
            "Sleigh Ride",
            "The Christmas Song",
            "Up On The Housetop",
            "We Wish You A Merry Christmas",
            "White Christmas",
            "Winter Wonderland",
            "Wonderful Christmastime",
            "You're A Mean One, Mr. Grinch"
        ];

        const PLAYLIST = SONG_NAMES.map(
            name => `songs/Music Now, Trap Music Now, Dance Music Now - ${name} (SPOTISAVER).mp3`
        );

        const SPEECH_SRC = "songs/speech.mp3";

        /*
         * If you create songs/durations.json containing the exact
         * duration of every song, live synchronization becomes
         * instant and exact on first load.
         *
         * Example:
         *
         * [213.4, 187.8, 194.1, ...]
         *
         * It must contain exactly 36 numbers.
         */

        const DURATION_MANIFEST = "songs/durations.json";

        /* =========================================================
           DOM
        ========================================================= */

        const playButton = document.getElementById("playButton");
        const songName = document.getElementById("songName");
        const countdown = document.getElementById("countdown");

        const musicAudio = document.getElementById("musicAudio");
        const speechAudio = document.getElementById("speechAudio");

        /* =========================================================
           STATE
        ========================================================= */

        let durations = new Array(PLAYLIST.length).fill(null);

        let durationLoadPromise = null;

        let currentSongIndex = 0;
        let currentSongOffset = 0;

        let radioStarted = false;
        let radioPaused = false;
        let starting = false;

        let speechTimer = null;
        let liveResyncTimer = null;

        let currentSongToken = 0;

        /*
         * Used to distinguish an intentional pause/stop from the
         * browser naturally reaching the end of a track.
         */
        let intentionalStop = false;

        /*
         * Prevents background visibility events from causing
         * repeated resyncs.
         */
        let resyncing = false;

        /* =========================================================
           STORAGE
        ========================================================= */

        const DURATION_CACHE_KEY = "christmasRadioDurationsV2";

        function loadCachedDurations() {
            try {
                const raw = localStorage.getItem(DURATION_CACHE_KEY);
                if (!raw) return;

                const parsed = JSON.parse(raw);

                if (
                    Array.isArray(parsed) &&
                    parsed.length === PLAYLIST.length &&
                    parsed.every(
                        value =>
                            typeof value === "number" &&
                            Number.isFinite(value) &&
                            value > 0
                    )
                ) {
                    durations = parsed;
                }
            } catch {
                /* Ignore invalid cache. */
            }
        }

        function saveDurations() {
            try {
                if (
                    durations.length === PLAYLIST.length &&
                    durations.every(
                        value =>
                            typeof value === "number" &&
                            Number.isFinite(value) &&
                            value > 0
                    )
                ) {
                    localStorage.setItem(
                        DURATION_CACHE_KEY,
                        JSON.stringify(durations)
                    );
                }
            } catch {
                /* Storage may be unavailable. */
            }
        }

        loadCachedDurations();

        /* =========================================================
           DURATION DISCOVERY
        ========================================================= */

        function getDuration(index) {
            if (
                typeof durations[index] === "number" &&
                Number.isFinite(durations[index]) &&
                durations[index] > 0
            ) {
                return Promise.resolve(durations[index]);
            }

            return new Promise(resolve => {
                const audio = document.createElement("audio");

                audio.preload = "metadata";
                audio.src = PLAYLIST[index];

                let finished = false;

                const finish = value => {
                    if (finished) return;

                    finished = true;

                    const duration =
                        Number.isFinite(value) && value > 0
                            ? value
                            : 240;

                    durations[index] = duration;
                    resolve(duration);

                    audio.removeAttribute("src");
                    audio.load();
                };

                audio.addEventListener(
                    "loadedmetadata",
                    () => finish(audio.duration),
                    { once: true }
                );

                audio.addEventListener(
                    "error",
                    () => finish(240),
                    { once: true }
                );

                /*
                 * Do not leave a metadata request hanging forever.
                 */
                setTimeout(() => {
                    if (!finished) finish(240);
                }, 12000);
            });
        }

        async function loadDurationManifest() {
            try {
                const response = await fetch(
                    DURATION_MANIFEST,
                    {
                        cache: "force-cache"
                    }
                );

                if (!response.ok) return false;

                const data = await response.json();

                if (
                    !Array.isArray(data) ||
                    data.length !== PLAYLIST.length ||
                    !data.every(
                        value =>
                            typeof value === "number" &&
                            Number.isFinite(value) &&
                            value > 0
                    )
                ) {
                    return false;
                }

                durations = data.slice();
                saveDurations();

                return true;
            } catch {
                return false;
            }
        }

        async function loadAllDurations() {
            if (durationLoadPromise) {
                return durationLoadPromise;
            }

            durationLoadPromise = (async () => {
                /*
                 * Manifest is preferred because it requires only one
                 * tiny request instead of 36 metadata requests.
                 */
                const manifestLoaded = await loadDurationManifest();

                if (manifestLoaded) return;

                /*
                 * If everything is already cached, we're finished.
                 */
                if (
                    durations.every(
                        value =>
                            typeof value === "number" &&
                            Number.isFinite(value) &&
                            value > 0
                    )
                ) {
                    return;
                }

                /*
                 * Metadata requests are lightweight compared with
                 * downloading/decoding all MP3 files.
                 */
                await Promise.all(
                    PLAYLIST.map((_, index) => getDuration(index))
                );

                saveDurations();
            })();

            return durationLoadPromise;
        }

        /* =========================================================
           LIVE POSITION
        ========================================================= */

        async function findCurrentSong() {
            const now = Date.now();

            let elapsed = Math.max(
                0,
                (now - RADIO_START) / 1000
            );

            /*
             * We need the total playlist duration so that the
             * schedule loops correctly forever.
             */
            await loadAllDurations();

            const totalDuration = durations.reduce(
                (total, duration) =>
                    total +
                    (
                        typeof duration === "number" &&
                        Number.isFinite(duration) &&
                        duration > 0
                            ? duration
                            : 240
                    ),
                0
            );

            if (!totalDuration) {
                return {
                    index: 0,
                    offset: 0
                };
            }

            /*
             * This fixes the original issue where RADIO_START was
             * months in the past and the finder would eventually
             * fall back to track 0 instead of looping the playlist.
             */
            elapsed %= totalDuration;

            for (let i = 0; i < PLAYLIST.length; i++) {
                const duration =
                    typeof durations[i] === "number" &&
                    Number.isFinite(durations[i]) &&
                    durations[i] > 0
                        ? durations[i]
                        : 240;

                if (elapsed < duration) {
                    return {
                        index: i,
                        offset: elapsed
                    };
                }

                elapsed -= duration;
            }

            return {
                index: 0,
                offset: 0
            };
        }

        /* =========================================================
           AUDIO HELPERS
        ========================================================= */

        function clearSpeechTimer() {
            if (speechTimer) {
                clearTimeout(speechTimer);
                speechTimer = null;
            }
        }

        function stopAudioElements() {
            intentionalStop = true;

            try {
                musicAudio.pause();
            } catch {}

            try {
                speechAudio.pause();
            } catch {}

            /*
             * We deliberately do not expose or use the native
             * controls. The browser therefore has no page slider
             * for the user to drag.
             */
            intentionalStop = false;
        }

        function updateSongDisplay(index) {
            songName.textContent =
                SONG_NAMES[index] || "Christmas Radio";
        }

        function updateButton() {
            if (!radioStarted) {
                playButton.textContent = "🎄 Start Live Radio";
                playButton.classList.remove("paused");
                playButton.classList.remove("starting");
                playButton.setAttribute("aria-pressed", "false");
                return;
            }

            if (starting) {
                playButton.textContent = "🎄 Starting Radio...";
                playButton.classList.add("starting");
                return;
            }

            if (radioPaused) {
                playButton.textContent = "▶️ Resume Live Radio";
                playButton.classList.add("paused");
                playButton.classList.remove("starting");
                playButton.setAttribute("aria-pressed", "true");
            } else {
                playButton.textContent = "⏸ Pause Radio";
                playButton.classList.remove("paused");
                playButton.classList.remove("starting");
                playButton.setAttribute("aria-pressed", "false");
            }
        }

        /* =========================================================
           SPEECH
        ========================================================= */

        function scheduleSpeech(index, offset) {
            clearSpeechTimer();

            /*
             * The speech file is treated as an announcement that
             * begins approximately five seconds before the end of
             * the current song.
             *
             * Because speech is a separate native audio element,
             * pausing the radio also pauses speech.
             */
            const duration =
                typeof durations[index] === "number" &&
                Number.isFinite(durations[index])
                    ? durations[index]
                    : 240;

            const remaining = Math.max(
                0,
                duration - offset
            );

            const delay = Math.max(
                0,
                (remaining - 5) * 1000
            );

            const token = currentSongToken;

            speechTimer = setTimeout(async () => {
                if (
                    !radioStarted ||
                    radioPaused ||
                    token !== currentSongToken
                ) {
                    return;
                }

                try {
                    speechAudio.currentTime = 0;
                    speechAudio.src = SPEECH_SRC;

                    await speechAudio.play();
                } catch {
                    /*
                     * iOS may reject a background/late-started
                     * secondary audio element. The main radio
                     * should continue normally.
                     */
                }
            }, delay);
        }

        /* =========================================================
           PLAY CURRENT LIVE POSITION
        ========================================================= */

        async function playLive(index, offset) {
            currentSongToken++;

            const token = currentSongToken;

            clearSpeechTimer();

            currentSongIndex = index;
            currentSongOffset = Math.max(0, offset);

            updateSongDisplay(index);

            stopAudioElements();

            /*
             * Load only the current song immediately.
             */
            musicAudio.src = PLAYLIST[index];

            musicAudio.preload = "auto";
            musicAudio.loop = false;

            try {
                /*
                 * Metadata must be loaded before seeking.
                 */
                await new Promise((resolve, reject) => {
                    if (musicAudio.readyState >= 1) {
                        resolve();
                        return;
                    }

                    const onLoaded = () => {
                        cleanup();
                        resolve();
                    };

                    const onError = () => {
                        cleanup();
                        reject(new Error("Audio failed to load"));
                    };

                    const cleanup = () => {
                        musicAudio.removeEventListener(
                            "loadedmetadata",
                            onLoaded
                        );

                        musicAudio.removeEventListener(
                            "error",
                            onError
                        );
                    };

                    musicAudio.addEventListener(
                        "loadedmetadata",
                        onLoaded,
                        { once: true }
                    );

                    musicAudio.addEventListener(
                        "error",
                        onError,
                        { once: true }
                    );
                });

                /*
                 * Never allow an invalid seek.
                 */
                if (
                    Number.isFinite(musicAudio.duration) &&
                    musicAudio.duration > 0
                ) {
                    currentSongOffset = Math.min(
                        currentSongOffset,
                        Math.max(0, musicAudio.duration - 0.1)
                    );

                    musicAudio.currentTime = currentSongOffset;
                }

                await musicAudio.play();

                if (token !== currentSongToken) return;

                radioPaused = false;
                starting = false;
                updateButton();

                scheduleSpeech(
                    currentSongIndex,
                    currentSongOffset
                );

                /*
                 * Warm the next song in the browser cache without
                 * actually playing it.
                 */
                preloadNextSong(index);
            } catch (error) {
                console.error("Radio playback error:", error);

                starting = false;
                updateButton();

                songName.textContent =
                    "Tap the button to start the radio";
            }
        }

        /* =========================================================
           NEXT SONG
        ========================================================= */

        async function advanceToNextSong() {
            if (
                !radioStarted ||
                radioPaused
            ) {
                return;
            }

            const nextIndex =
                (currentSongIndex + 1) %
                PLAYLIST.length;

            await playLive(nextIndex, 0);
        }

        musicAudio.addEventListener("ended", () => {
            if (
                intentionalStop ||
                radioPaused ||
                !radioStarted
            ) {
                return;
            }

            advanceToNextSong();
        });

        /* =========================================================
           PRELOAD
        ========================================================= */

        function preloadNextSong(index) {
            const nextIndex =
                (index + 1) %
                PLAYLIST.length;

            /*
             * Use a separate silent preload element so we don't
             * disturb the active audio element.
             */
            const preload = document.createElement("audio");

            preload.preload = "metadata";
            preload.src = PLAYLIST[nextIndex];

            /*
             * Keep it alive long enough for the browser to begin
             * caching the resource.
             */
            preload.load();

            setTimeout(() => {
                preload.removeAttribute("src");
                preload.load();
            }, 15000);
        }

        /* =========================================================
           PAUSE
        ========================================================= */

        function pauseRadio() {
            if (
                !radioStarted ||
                radioPaused
            ) {
                return;
            }

            radioPaused = true;

            clearSpeechTimer();

            /*
             * Both the music AND the voice are paused.
             */
            try {
                musicAudio.pause();
            } catch {}

            try {
                speechAudio.pause();
            } catch {}

            updateButton();
        }

        /* =========================================================
           RESUME = GO LIVE
        ========================================================= */

        async function resumeLive() {
            if (!radioStarted) return;

            starting = true;
            radioPaused = false;
            updateButton();

            clearSpeechTimer();

            try {
                speechAudio.pause();
            } catch {}

            /*
             * Do not resume musicAudio.currentTime.
             *
             * Instead, calculate the actual radio position right now.
             * This means if the user pauses for 20 minutes, pressing
             * Resume takes them straight back to the live broadcast.
             */
            const livePosition = await findCurrentSong();

            if (!radioStarted) return;

            await playLive(
                livePosition.index,
                livePosition.offset
            );
        }

        /* =========================================================
           START
        ========================================================= */

        async function startRadio() {
            if (starting) return;

            starting = true;
            radioStarted = true;
            radioPaused = false;

            updateButton();

            /*
             * The user gesture is important for iOS autoplay
             * permission. Start the actual audio from this click.
             */
            try {
                const livePosition =
                    await findCurrentSong();

                if (!radioStarted) return;

                await playLive(
                    livePosition.index,
                    livePosition.offset
                );
            } catch (error) {
                console.error(error);

                starting = false;
                updateButton();
            }
        }

        /* =========================================================
           BUTTON
        ========================================================= */

        playButton.addEventListener(
            "click",
            async event => {
                event.preventDefault();

                if (!radioStarted) {
                    await startRadio();
                    return;
                }

                if (radioPaused) {
                    await resumeLive();
                    return;
                }

                pauseRadio();
            }
        );

        /* =========================================================
           MEDIA SESSION
           ========================================================= */

        function setupMediaSession() {
            if (!("mediaSession" in navigator)) return;

            try {
                navigator.mediaSession.metadata =
                    new MediaMetadata({
                        title: "Christmas Radio",
                        artist: "Live Christmas Radio",
                        album: "Christmas Countdown",
                        artwork: [
                            {
                                src: "favicon.ico",
                                sizes: "192x192",
                                type: "image/x-icon"
                            }
                        ]
                    });

                /*
                 * Lock-screen play/pause.
                 */
                navigator.mediaSession.setActionHandler(
                    "play",
                    async () => {
                        if (!radioStarted) {
                            await startRadio();
                        } else if (radioPaused) {
                            await resumeLive();
                        }
                    }
                );

                navigator.mediaSession.setActionHandler(
                    "pause",
                    () => {
                        pauseRadio();
                    }
                );

                /*
                 * Deliberately reject all track skipping.
                 */
                const rejectSkip = () => {
                    /*
                     * Do nothing.
                     *
                     * This prevents our application from responding
                     * to previous/next commands.
                     */
                };

                try {
                    navigator.mediaSession.setActionHandler(
                        "nexttrack",
                        rejectSkip
                    );
                } catch {}

                try {
                    navigator.mediaSession.setActionHandler(
                        "previoustrack",
                        rejectSkip
                    );
                } catch {}

                /*
                 * Ignore lock-screen seek buttons.
                 */
                try {
                    navigator.mediaSession.setActionHandler(
                        "seekbackward",
                        rejectSkip
                    );
                } catch {}

                try {
                    navigator.mediaSession.setActionHandler(
                        "seekforward",
                        rejectSkip
                    );
                } catch {}

                try {
                    navigator.mediaSession.setActionHandler(
                        "seekto",
                        rejectSkip
                    );
                } catch {}
            } catch (error) {
                console.warn(
                    "Media Session setup failed:",
                    error
                );
            }
        }

        setupMediaSession();

        /* =========================================================
           LOCK SCREEN / BACKGROUND RESYNC
        ========================================================= */

        document.addEventListener(
            "visibilitychange",
            async () => {
                if (
                    document.visibilityState !== "visible" ||
                    !radioStarted ||
                    radioPaused ||
                    resyncing
                ) {
                    return;
                }

                /*
                 * Give iOS a moment to restore the page/audio state.
                 */
                setTimeout(async () => {
                    if (
                        document.visibilityState !== "visible" ||
                        !radioStarted ||
                        radioPaused ||
                        resyncing
                    ) {
                        return;
                    }

                    resyncing = true;

                    try {
                        /*
                         * If playback was unexpectedly interrupted,
                         * jump back to the current live position.
                         */
                        if (
                            musicAudio.paused ||
                            musicAudio.readyState < 2
                        ) {
                            const livePosition =
                                await findCurrentSong();

                            await playLive(
                                livePosition.index,
                                livePosition.offset
                            );
                        }
                    } catch {
                        /* Ignore temporary background recovery errors. */
                    } finally {
                        resyncing = false;
                    }
                }, 500);
            }
        );

        /*
         * Periodic health check.
         *
         * This does NOT constantly restart the audio. It only
         * recovers if the browser unexpectedly stopped playback
         * while the radio is supposed to be live.
         */
        liveResyncTimer = setInterval(
            async () => {
                if (
                    !radioStarted ||
                    radioPaused ||
                    resyncing ||
                    document.visibilityState !== "visible"
                ) {
                    return;
                }

                if (
                    musicAudio.paused &&
                    !starting
                ) {
                    resyncing = true;

                    try {
                        const livePosition =
                            await findCurrentSong();

                        await playLive(
                            livePosition.index,
                            livePosition.offset
                        );
                    } catch {
                        /* Ignore recovery errors. */
                    } finally {
                        resyncing = false;
                    }
                }
            },
            15000
        );

        /* =========================================================
           COUNTDOWN
        ========================================================= */

        function updateCountdown() {
            const christmas =
                new Date(
                    new Date().getFullYear(),
                    11,
                    25,
                    0,
                    0,
                    0
                ).getTime();

            const now = Date.now();

            let target = christmas;

            if (now >= target) {
                target =
                    new Date(
                        new Date().getFullYear() + 1,
                        11,
                        25,
                        0,
                        0,
                        0
                    ).getTime();
            }

            const diff = Math.max(
                0,
                target - now
            );

            const totalSeconds =
                Math.floor(diff / 1000);

            const days =
                Math.floor(
                    totalSeconds / 86400
                );

            const hours =
                Math.floor(
                    (totalSeconds % 86400) / 3600
                );

            const minutes =
                Math.floor(
                    (totalSeconds % 3600) / 60
                );

            const seconds =
                totalSeconds % 60;

            countdown.textContent =
                `${days}d ${String(hours).padStart(2, "0")}h ` +
                `${String(minutes).padStart(2, "0")}m ` +
                `${String(seconds).padStart(2, "0")}s`;
        }

        updateCountdown();

        setInterval(
            updateCountdown,
            1000
        );

        /* =========================================================
           SNOW
        ========================================================= */

        function createSnow(
            container,
            count,
            minSize,
            maxSize,
            minDuration,
            maxDuration
        ) {
            container.innerHTML = "";

            const fragment =
                document.createDocumentFragment();

            for (let i = 0; i < count; i++) {
                const snow =
                    document.createElement("div");

                snow.className = "snowflake";
                snow.textContent = "❄";

                const size =
                    minSize +
                    Math.random() *
                    (maxSize - minSize);

                const duration =
                    minDuration +
                    Math.random() *
                    (maxDuration - minDuration);

                const delay =
                    Math.random() *
                    -maxDuration;

                const left =
                    Math.random() * 100;

                const drift =
                    `${-80 + Math.random() * 160}px`;

                snow.style.left =
                    `${left}%`;

                snow.style.fontSize =
                    `${size}px`;

                snow.style.animationDuration =
                    `${duration}s`;

                snow.style.animationDelay =
                    `${delay}s`;

                snow.style.setProperty(
                    "--drift",
                    drift
                );

                fragment.appendChild(snow);
            }

            container.appendChild(fragment);
        }

        function buildSnow() {
            const mobile =
                window.matchMedia(
                    "(max-width: 768px)"
                ).matches;

            createSnow(
                document.getElementById("snowFar"),
                mobile ? 25 : 50,
                7,
                12,
                18,
                32
            );

            createSnow(
                document.getElementById("snowMid"),
                mobile ? 18 : 38,
                9,
                16,
                13,
                24
            );

            createSnow(
                document.getElementById("snowNear"),
                mobile ? 10 : 22,
                12,
                21,
                9,
                17
            );
        }

        buildSnow();

        let resizeTimer;

        window.addEventListener(
            "resize",
            () => {
                clearTimeout(resizeTimer);

                resizeTimer = setTimeout(
                    buildSnow,
                    300
                );
            },
            {
                passive: true
            }
        );

        /* =========================================================
           NO ZOOM / NO SLIDER GESTURES
        ========================================================= */

        document.addEventListener(
            "gesturestart",
            event => {
                event.preventDefault();
            },
            {
                passive: false
            }
        );

        document.addEventListener(
            "gesturechange",
            event => {
                event.preventDefault();
            },
            {
                passive: false
            }
        );

        document.addEventListener(
            "gestureend",
            event => {
                event.preventDefault();
            },
            {
                passive: false
            }
        );

        document.addEventListener(
            "wheel",
            event => {
                if (event.ctrlKey || event.metaKey) {
                    event.preventDefault();
                }
            },
            {
                passive: false
            }
        );

        document.addEventListener(
            "keydown",
            event => {
                if (
                    (event.ctrlKey || event.metaKey) &&
                    ["+", "-", "=", "0"].includes(event.key)
                ) {
                    event.preventDefault();
                }
            }
        );

        /*
         * Prevent double-tap zoom without interfering with the
         * actual radio button.
         */
        let lastTouchEnd = 0;

        document.addEventListener(
            "touchend",
            event => {
                const now = Date.now();

                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }

                lastTouchEnd = now;
            },
            {
                passive: false
            }
        );

        /* =========================================================
           KEEP NATIVE AUDIO CONTROLS COMPLETELY HIDDEN
        ========================================================= */

        musicAudio.controls = false;
        speechAudio.controls = false;

        musicAudio.removeAttribute("controls");
        speechAudio.removeAttribute("controls");

        /*
         * Never let a user directly interact with the hidden audio
         * elements, even if a browser attempts to expose them.
         */
        musicAudio.style.display = "none";
        speechAudio.style.display = "none";

        /* =========================================================
           INITIAL STATE
        ========================================================= */

        updateButton();

        /*
         * Begin discovering durations in the background.
         *
         * If durations.json exists this is extremely lightweight.
         * Otherwise the browser builds its local duration cache.
         */
        loadAllDurations().catch(() => {});
    </script>

</body>

</html>
