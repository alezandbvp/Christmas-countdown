<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Christmas Live Radio</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: #0b1220;
        color: white;
        overflow-x: hidden;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .radio {
        width: min(700px, 92vw);
        padding: 30px;
        text-align: center;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(10px);
    }

    h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 7vw, 4rem);
    }

    .subtitle {
        opacity: 0.75;
        margin-bottom: 30px;
    }

    .now-playing {
        margin-top: 20px;
        padding: 24px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.08);
    }

    .label {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        opacity: 0.6;
    }

    #songName {
        margin-top: 10px;
        font-size: clamp(1.4rem, 5vw, 2.2rem);
        font-weight: bold;
    }

    .up-next {
        margin-top: 20px;
        opacity: 0.8;
    }

    #upNext {
        margin-top: 6px;
        font-weight: bold;
    }

    .countdown {
        margin-top: 25px;
        font-size: 1.1rem;
        opacity: 0.75;
    }

    button {
        margin-top: 25px;
        padding: 14px 28px;
        border: 0;
        border-radius: 999px;
        background: white;
        color: #111;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
    }

    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    #status {
        margin-top: 15px;
        min-height: 20px;
        font-size: 0.9rem;
        opacity: 0.7;
    }

    .snowflake {
        position: fixed;
        top: -20px;
        pointer-events: none;
        user-select: none;
        animation-name: snowfall;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
        opacity: 0.7;
    }

    @keyframes snowfall {
        from {
            transform: translateY(-30px);
        }

        to {
            transform: translateY(110vh);
        }
    }
</style>
</head>

<body>

<div class="radio">

    <h1>🎄 Christmas Radio 🎄</h1>

    <div class="subtitle">
        Live Christmas music, 24/7
    </div>

    <div class="now-playing">

        <div class="label">
            Now Playing
        </div>

        <div id="songName">
            Loading...
        </div>

        <div class="up-next">

            <div class="label">
                Up Next
            </div>

            <div id="upNext">
                Loading...
            </div>

        </div>

        <div class="countdown">
            Next change in
            <span id="countdown">--:--</span>
        </div>

    </div>

    <button id="playButton">
        ▶ Play Live Radio
    </button>

    <div id="status">
        Loading radio...
    </div>

</div>

<audio id="musicAudio" preload="auto"></audio>
<audio id="speechAudio" preload="auto"></audio>

<script>

const RADIO_START =
    new Date("Dec 1, 2025 00:00:00").getTime();

const SONG_FOLDER =
    "./songs/";

const SPEECH_SRC =
    "./songs/speech.mp3";

const DURATION_MANIFEST =
    "./songs/durations.json";

const SONGS_PER_SPEECH =
    4;


/*
 * Everything about the song playlist comes
 * from durations.json.
 *
 * There is intentionally NO song list here.
 */
let songs = [];

let speechDuration = 0;

let totalPlaylistDuration = 0;

let metadataLoaded = false;

let metadataLoadingPromise = null;

let radioPlaying = false;

let currentSegment = null;

let isChangingTrack = false;


/*
 * HTML elements
 */
const musicAudio =
    document.getElementById("musicAudio");

const speechAudio =
    document.getElementById("speechAudio");

const playButton =
    document.getElementById("playButton");

const songNameElement =
    document.getElementById("songName");

const upNextElement =
    document.getElementById("upNext");

const countdownElement =
    document.getElementById("countdown");

const statusElement =
    document.getElementById("status");


/*
 * Format seconds as MM:SS.
 */
function formatTime(seconds) {

    seconds = Math.max(
        0,
        Math.floor(seconds)
    );

    const minutes =
        Math.floor(seconds / 60);

    const remainingSeconds =
        seconds % 60;

    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(remainingSeconds).padStart(2, "0")
    );
}


/*
 * Load the speech duration.
 *
 * Speech is the ONLY audio for which we
 * read the duration directly from the file.
 */
function getAudioDuration(url) {

    return new Promise((resolve, reject) => {

        const audio =
            new Audio();

        audio.preload =
            "metadata";

        audio.onloadedmetadata = () => {

            if (
                Number.isFinite(audio.duration) &&
                audio.duration > 0
            ) {
                resolve(audio.duration);
            } else {
                reject(
                    new Error(
                        "Invalid audio duration"
                    )
                );
            }

            audio.removeAttribute("src");
            audio.load();
        };

        audio.onerror = () => {

            reject(
                new Error(
                    "Could not load audio: " + url
                )
            );
        };

        audio.src = url;
    });
}


/*
 * Load the playlist from durations.json.
 *
 * durations.json supplies:
 *
 *   name
 *   file
 *   duration
 *
 * There is NO fallback for missing song
 * durations.
 */
async function loadDurations() {

    if (metadataLoaded) {
        return;
    }

    if (metadataLoadingPromise) {
        return metadataLoadingPromise;
    }

    metadataLoadingPromise =
        (async () => {

            const response =
                await fetch(
                    DURATION_MANIFEST,
                    {
                        cache: "no-store"
                    }
                );

            if (!response.ok) {

                throw new Error(
                    "Could not load durations.json"
                );
            }

            const data =
                await response.json();

            if (
                !data ||
                !Array.isArray(data.songs) ||
                data.songs.length === 0
            ) {

                throw new Error(
                    "durations.json contains no songs"
                );
            }


            /*
             * durations.json is the complete
             * playlist.
             */
            songs =
                data.songs.map(
                    (entry, index) => {

                        if (
                            !entry ||
                            typeof entry.name !==
                                "string" ||
                            !entry.name.trim()
                        ) {

                            throw new Error(
                                `Song ${index + 1} is missing a name`
                            );
                        }


                        if (
                            typeof entry.file !==
                                "string" ||
                            !entry.file.trim()
                        ) {

                            throw new Error(
                                `Song "${entry.name}" is missing a file`
                            );
                        }


                        const duration =
                            Number(
                                entry.duration
                            );


                        if (
                            !Number.isFinite(
                                duration
                            ) ||
                            duration <= 0
                        ) {

                            throw new Error(
                                `Song "${entry.name}" has an invalid duration`
                            );
                        }


                        return {

                            name:
                                entry.name,

                            file:
                                entry.file,

                            duration:
                                duration
                        };
                    }
                );


            /*
             * Speech remains independent from
             * the song duration manifest.
             */
            speechDuration =
                await getAudioDuration(
                    SPEECH_SRC
                );


            if (
                !Number.isFinite(
                    speechDuration
                ) ||
                speechDuration <= 0
            ) {

                throw new Error(
                    "Speech duration is unavailable"
                );
            }


            /*
             * Build the complete live timeline.
             *
             * Song durations come ONLY from
             * durations.json.
             */
            totalPlaylistDuration = 0;


            for (
                let i = 0;
                i < songs.length;
                i++
            ) {

                totalPlaylistDuration +=
                    songs[i].duration;


                /*
                 * Speech after every 4 songs.
                 */
                if (
                    (i + 1) %
                        SONGS_PER_SPEECH ===
                    0
                ) {

                    totalPlaylistDuration +=
                        speechDuration;
                }
            }


            if (
                !Number.isFinite(
                    totalPlaylistDuration
                ) ||
                totalPlaylistDuration <= 0
            ) {

                throw new Error(
                    "Invalid radio timeline"
                );
            }


            metadataLoaded =
                true;


            console.log(
                `Loaded ${songs.length} songs`
            );

            console.log(
                "Speech duration:",
                formatTime(
                    speechDuration
                )
            );

            console.log(
                "Playlist duration:",
                formatTime(
                    totalPlaylistDuration
                )
            );

        })()
        .catch(error => {

            metadataLoadingPromise =
                null;

            throw error;
        });


    return metadataLoadingPromise;
}


/*
 * Get the URL for a song.
 *
 * The filename comes directly from
 * durations.json.
 */
function getSongURL(index) {

    if (
        !songs[index]
    ) {

        throw new Error(
            `Song index ${index} does not exist`
        );
    }


    return (
        SONG_FOLDER +
        encodeURIComponent(
            songs[index].file
        )
    );
}


/*
 * Find where the radio should currently
 * be playing.
 *
 * The timeline uses ONLY:
 *
 *   durations.json song durations
 *   speech.mp3 duration
 */
function findLiveSegment() {

    if (
        !metadataLoaded ||
        songs.length === 0
    ) {

        throw new Error(
            "Radio timeline is not loaded"
        );
    }


    const elapsed =
        (
            Date.now() -
            RADIO_START
        ) / 1000;


    const position =
        (
            (
                elapsed %
                totalPlaylistDuration
            ) +
            totalPlaylistDuration
        ) %
        totalPlaylistDuration;


    let accumulated = 0;


    for (
        let i = 0;
        i < songs.length;
        i++
    ) {

        const duration =
            songs[i].duration;


        /*
         * Song segment
         */
        if (
            position <
            accumulated + duration
        ) {

            return {

                type:
                    "song",

                index:
                    i,

                offset:
                    position -
                    accumulated
            };
        }


        accumulated +=
            duration;


        /*
         * Speech segment after every
         * SONGS_PER_SPEECH songs.
         */
        if (
            (i + 1) %
                SONGS_PER_SPEECH ===
            0
        ) {

            if (
                position <
                accumulated +
                    speechDuration
            ) {

                return {

                    type:
                        "speech",

                    index:
                        i,

                    offset:
                        position -
                        accumulated
                };
            }


            accumulated +=
                speechDuration;
        }
    }


    throw new Error(
        "Could not resolve live radio segment"
    );
}


/*
 * Get the song associated with a segment.
 */
function getCurrentSong(segment) {

    if (
        segment.type ===
        "speech"
    ) {

        return songs[
            (
                segment.index + 1
            ) %
            songs.length
        ];
    }


    return songs[
        segment.index
    ];
}


/*
 * Get the next song.
 */
function getNextSong(segment) {

    const currentSong =
        getCurrentSong(
            segment
        );


    const currentIndex =
        songs.indexOf(
            currentSong
        );


    return songs[
        (
            currentIndex + 1
        ) %
        songs.length
    ];
}


/*
 * Update the UI.
 */
function updateRadioUI(segment) {

    const currentSong =
        getCurrentSong(
            segment
        );

    const nextSong =
        getNextSong(
            segment
        );


    songNameElement.textContent =
        currentSong.name;


    upNextElement.textContent =
        nextSong.name;
}


/*
 * Load an audio element and seek to
 * the requested offset.
 *
 * The song timeline duration itself is
 * NEVER taken from the audio element.
 */
function loadAudio(
    audio,
    url,
    offset
) {

    return new Promise(
        (resolve, reject) => {

            let finished = false;


            function cleanup() {

                audio.removeEventListener(
                    "loadedmetadata",
                    onMetadata
                );

                audio.removeEventListener(
                    "error",
                    onError
                );
            }


            function onMetadata() {

                if (finished) {
                    return;
                }

                finished = true;

                cleanup();


                /*
                 * The offset comes from the
                 * durations.json timeline.
                 *
                 * We only wait for metadata so
                 * the browser can seek.
                 */
                try {

                    if (
                        Number.isFinite(
                            offset
                        ) &&
                        offset >= 0
                    ) {

                        audio.currentTime =
                            offset;
                    }

                    resolve();

                } catch (error) {

                    reject(error);
                }
            }


            function onError() {

                if (finished) {
                    return;
                }

                finished = true;

                cleanup();

                reject(
                    new Error(
                        "Could not load audio: " +
                        url
                    )
                );
            }


            audio.addEventListener(
                "loadedmetadata",
                onMetadata
            );

            audio.addEventListener(
                "error",
                onError
            );


            audio.src =
                url;

            audio.load();
        }
    );
}


/*
 * Load the correct live segment.
 */
async function playLive() {

    if (isChangingTrack) {
        return;
    }

    isChangingTrack =
        true;


    try {

        statusElement.textContent =
            "Loading live radio...";


        await loadDurations();


        const segment =
            findLiveSegment();


        currentSegment =
            segment;


        updateRadioUI(
            segment
        );


        /*
         * Stop both audio elements before
         * switching.
         */
        musicAudio.pause();
        speechAudio.pause();


        if (
            segment.type ===
            "speech"
        ) {

            await loadAudio(
                speechAudio,
                SPEECH_SRC,
                segment.offset
            );

            await speechAudio.play();

        } else {

            await loadSong(
                segment.index,
                segment.offset
            );

            await musicAudio.play();
        }


        radioPlaying =
            true;


        playButton.textContent =
            "⏸ Pause Radio";


        statusElement.textContent =
            "Live";


        updateCountdown();

    } catch (error) {

        console.error(
            error
        );


        radioPlaying =
            false;


        playButton.textContent =
            "▶ Play Live Radio";


        statusElement.textContent =
            "Radio unavailable — check durations.json and your song files.";

    } finally {

        isChangingTrack =
            false;
    }
}


/*
 * Load a song using the filename
 * supplied by durations.json.
 */
async function loadSong(
    index,
    offset
) {

    await loadAudio(
        musicAudio,
        getSongURL(index),
        offset
    );
}


/*
 * Load speech.
 */
async function loadSpeech(
    offset
) {

    await loadAudio(
        speechAudio,
        SPEECH_SRC,
        offset
    );
}


/*
 * Switch to whatever segment the live
 * timeline says should currently be playing.
 */
async function syncLive() {

    if (
        !radioPlaying ||
        isChangingTrack
    ) {
        return;
    }


    try {

        const segment =
            findLiveSegment();


        /*
         * If the live segment hasn't changed,
         * don't reload the audio.
         */
        if (
            currentSegment &&
            currentSegment.type ===
                segment.type &&
            currentSegment.index ===
                segment.index
        ) {

            updateRadioUI(
                segment
            );

            return;
        }


        currentSegment =
            segment;


        updateRadioUI(
            segment
        );


        isChangingTrack =
            true;


        musicAudio.pause();
        speechAudio.pause();


        if (
            segment.type ===
            "speech"
        ) {

            await loadSpeech(
                segment.offset
            );

            await speechAudio.play();

        } else {

            await loadSong(
                segment.index,
                segment.offset
            );

            await musicAudio.play();
        }


    } catch (error) {

        console.error(
            "Sync error:",
            error
        );

    } finally {

        isChangingTrack =
            false;
    }
}


/*
 * Countdown until the next segment.
 *
 * This uses the same duration-only
 * timeline as the radio.
 */
function getTimeUntilNextSegment() {

    if (
        !metadataLoaded
    ) {
        return null;
    }


    const segment =
        findLiveSegment();


    const elapsed =
        (
            Date.now() -
            RADIO_START
        ) / 1000;


    const position =
        (
            (
                elapsed %
                totalPlaylistDuration
            ) +
            totalPlaylistDuration
        ) %
        totalPlaylistDuration;


    let accumulated = 0;


    for (
        let i = 0;
        i < songs.length;
        i++
    ) {

        const duration =
            songs[i].duration;


        if (
            position <
            accumulated + duration
        ) {

            return (
                accumulated +
                duration -
                position
            );
        }


        accumulated +=
            duration;


        if (
            (i + 1) %
                SONGS_PER_SPEECH ===
            0
        ) {

            if (
                position <
                accumulated +
                    speechDuration
            ) {

                return (
                    accumulated +
                    speechDuration -
                    position
                );
            }


            accumulated +=
                speechDuration;
        }
    }


    return null;
}


/*
 * Update countdown display.
 */
function updateCountdown() {

    if (
        !metadataLoaded
    ) {

        countdownElement.textContent =
            "--:--";

        return;
    }


    try {

        const remaining =
            getTimeUntilNextSegment();


        if (
            remaining === null
        ) {

            countdownElement.textContent =
                "--:--";

            return;
        }


        countdownElement.textContent =
            formatTime(
                remaining
            );

    } catch (error) {

        countdownElement.textContent =
            "--:--";
    }
}


/*
 * When music ends, resync to the live
 * timeline rather than advancing based on
 * the audio file's duration.
 */
musicAudio.addEventListener(
    "ended",
    () => {

        if (
            radioPlaying
        ) {
            syncLive();
        }
    }
);


/*
 * When speech ends, resync to the live
 * timeline.
 */
speechAudio.addEventListener(
    "ended",
    () => {

        if (
            radioPlaying
        ) {
            syncLive();
        }
    }
);


/*
 * Handle playback errors.
 */
musicAudio.addEventListener(
    "error",
    () => {

        if (
            radioPlaying &&
            !isChangingTrack
        ) {

            setTimeout(
                syncLive,
                1000
            );
        }
    }
);


speechAudio.addEventListener(
    "error",
    () => {

        if (
            radioPlaying &&
            !isChangingTrack
        ) {

            setTimeout(
                syncLive,
                1000
            );
        }
    }
);


/*
 * Play / pause button.
 */
playButton.addEventListener(
    "click",
    async () => {

        if (
            radioPlaying
        ) {

            musicAudio.pause();
            speechAudio.pause();

            radioPlaying =
                false;

            playButton.textContent =
                "▶ Play Live Radio";

            statusElement.textContent =
                "Paused";

            return;
        }


        await playLive();
    }
);


/*
 * Keep the UI countdown updated.
 */
setInterval(
    () => {

        updateCountdown();

    },
    250
);


/*
 * Periodically verify that we're still
 * on the correct live segment.
 */
setInterval(
    () => {

        if (
            radioPlaying
        ) {
            syncLive();
        }

    },
    5000
);


/*
 * When the page becomes visible again,
 * immediately resync to the live position.
 */
document.addEventListener(
    "visibilitychange",
    () => {

        if (
            !document.hidden &&
            radioPlaying
        ) {

            syncLive();
        }
    }
);


/*
 * Basic snow effect.
 */
function createSnowflake() {

    const snowflake =
        document.createElement(
            "div"
        );


    snowflake.className =
        "snowflake";


    snowflake.textContent =
        "❄";


    snowflake.style.left =
        Math.random() * 100 +
        "vw";


    snowflake.style.fontSize =
        (
            10 +
            Math.random() * 20
        ) +
        "px";


    snowflake.style.animationDuration =
        (
            5 +
            Math.random() * 8
        ) +
        "s";


    snowflake.style.animationDelay =
        (
            Math.random() * 5
        ) +
        "s";


    document.body.appendChild(
        snowflake
    );


    setTimeout(
        () => {
            snowflake.remove();
        },
        15000
    );
}


setInterval(
    createSnowflake,
    400
);


/*
 * Prevent accidental context menu / text
 * selection on the radio interface.
 */
document.addEventListener(
    "contextmenu",
    event => {
        event.preventDefault();
    }
);


/*
 * Initial UI state.
 */
loadDurations()
    .then(() => {

        const segment =
            findLiveSegment();

        currentSegment =
            segment;

        updateRadioUI(
            segment
        );

        updateCountdown();

        statusElement.textContent =
            "Ready";

    })
    .catch(error => {

        console.error(
            error
        );

        statusElement.textContent =
            "Unable to load radio data — check durations.json.";
    });

</script>

</body>
</html>
