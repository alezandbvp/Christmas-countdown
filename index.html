<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="theme-color" content="#12030a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="icon" href="favicon.ico">

    <title>Christmas Countdown • Live Radio</title>

    <style>
        :root {
            --red: #d71920;
            --red-dark: #8d0710;
            --green: #0b6b3a;
            --green-dark: #063d25;
            --gold: #ffd76a;
            --white: #ffffff;

            --glass: rgba(15, 5, 10, 0.48);
            --glass-border: rgba(255, 255, 255, 0.18);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            overscroll-behavior: none;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: var(--white);
            background:
                radial-gradient(circle at 15% 20%, rgba(215, 25, 32, 0.28), transparent 35%),
                radial-gradient(circle at 85% 75%, rgba(11, 107, 58, 0.3), transparent 35%),
                #12030a;
        }

        /* BACKGROUND */

        #bg {
            position: fixed;
            inset: -4%;
            width: 108%;
            height: 108%;

            background-image:
                linear-gradient(
                    rgba(15, 0, 5, 0.35),
                    rgba(15, 0, 5, 0.55)
                ),
                url("christmas-background.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            filter: saturate(1.15);
            z-index: -5;
        }

        /* SNOW */

        .snow-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 2;
        }

        .snowflake {
            position: absolute;
            top: -30px;
            color: rgba(255, 255, 255, 0.9);
            font-size: var(--size);
            opacity: var(--opacity);
            animation:
                snowFall var(--duration) linear infinite,
                snowDrift var(--drift) ease-in-out infinite alternate;
            animation-delay: var(--delay);
        }

        @keyframes snowFall {
            from {
                transform: translate3d(0, -40px, 0);
            }

            to {
                transform: translate3d(0, 110vh, 0);
            }
        }

        @keyframes snowDrift {
            from {
                margin-left: -25px;
            }

            to {
                margin-left: 25px;
            }
        }

        /* MAIN */

        #container {
            width: 100%;
            height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                max(20px, env(safe-area-inset-top))
                max(20px, env(safe-area-inset-right))
                max(20px, env(safe-area-inset-bottom))
                max(20px, env(safe-area-inset-left));

            position: relative;
            z-index: 5;
        }

        .card {
            width: min(92vw, 900px);

            padding: clamp(30px, 5vw, 60px);

            text-align: center;

            background: var(--glass);

            border: 1px solid var(--glass-border);
            border-radius: 30px;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);

            position: relative;
        }

        /* LIVE LABEL */

        .live-label {
            display: inline-flex;
            align-items: center;
            gap: 9px;

            padding: 9px 17px;

            border-radius: 999px;

            background: rgba(215, 25, 32, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.15);

            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;

            margin-bottom: 20px;
        }

        .live-dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #ff3038;

            box-shadow: 0 0 12px #ff3038;

            animation: livePulse 1.4s infinite;
        }

        @keyframes livePulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.45;
                transform: scale(0.75);
            }
        }

        /* TITLE */

        #title {
            font-size: clamp(3rem, 9vw, 7rem);
            line-height: 0.95;

            font-weight: 900;
            letter-spacing: -0.06em;

            background: linear-gradient(
                135deg,
                #ffffff 5%,
                #ffe59b 40%,
                #ffffff 70%,
                #ffccd0 100%
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            text-shadow:
                0 10px 40px rgba(0, 0, 0, 0.35);

            margin-bottom: 4px;
        }

        #subtitle {
            font-size: clamp(2rem, 5vw, 4rem);
            line-height: 1;

            font-weight: 800;

            color: #ffffff;

            text-shadow:
                0 5px 25px rgba(0, 0, 0, 0.4);

            margin-bottom: 28px;
        }

        /* COUNTDOWN */

        #countdown {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: min(90%, 500px);

            padding: 15px 25px;

            border-radius: 999px;

            background:
                linear-gradient(
                    135deg,
                    rgba(215, 25, 32, 0.3),
                    rgba(11, 107, 58, 0.28)
                );

            border: 1px solid rgba(255, 255, 255, 0.18);

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 10px 30px rgba(0, 0, 0, 0.18);

            font-size: clamp(1.1rem, 3vw, 1.7rem);
            font-weight: 800;

            letter-spacing: 0.03em;

            margin-bottom: 30px;
        }

        /* SONG */

        .song-wrapper {
            margin-bottom: 28px;
        }

        .now-playing {
            font-size: 0.72rem;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: 0.18em;

            opacity: 0.72;

            margin-bottom: 9px;
        }

        #songName {
            min-height: 1.5em;

            font-size: clamp(1rem, 3vw, 1.45rem);
            font-weight: 700;

            color: #ffffff;

            text-shadow:
                0 2px 12px rgba(0, 0, 0, 0.45);
        }

        /* PLAY BUTTON */

        #playButton {
            border: 0;
            outline: none;

            padding: 15px 28px;

            border-radius: 999px;

            background:
                linear-gradient(
                    135deg,
                    #e31b23,
                    #a80d15
                );

            color: white;

            font-size: 1rem;
            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 12px 30px rgba(150, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                opacity 0.18s ease;
        }

        #playButton:active {
            transform: scale(0.96);
        }

        #playButton:hover {
            transform: translateY(-2px);

            box-shadow:
                0 15px 35px rgba(150, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }

        #playButton.paused {
            background:
                linear-gradient(
                    135deg,
                    #0d7a43,
                    #07552f
                );
        }

        /* FOOTER */

        footer {
            margin-top: 28px;

            font-size: 0.78rem;
            font-weight: 700;

            opacity: 0.65;

            letter-spacing: 0.08em;
        }

        /* CORNER STARS */

        .star {
            position: absolute;

            font-size: 1.3rem;

            opacity: 0.65;

            animation: starFloat 3s ease-in-out infinite alternate;
        }

        .star.one {
            top: 22px;
            left: 25px;
        }

        .star.two {
            top: 45px;
            right: 30px;
            animation-delay: 0.8s;
        }

        .star.three {
            bottom: 35px;
            left: 35px;
            animation-delay: 1.5s;
        }

        .star.four {
            bottom: 25px;
            right: 35px;
            animation-delay: 2.1s;
        }

        @keyframes starFloat {
            from {
                transform: translateY(0) rotate(0deg);
                opacity: 0.45;
            }

            to {
                transform: translateY(-8px) rotate(8deg);
                opacity: 0.9;
            }
        }

        /* HIDDEN AUDIO */

        audio {
            display: none !important;
        }

        /* PORTRAIT MOBILE */

        @media (max-width: 768px) {
            #container {
                padding:
                    max(15px, env(safe-area-inset-top))
                    max(15px, env(safe-area-inset-right))
                    max(15px, env(safe-area-inset-bottom))
                    max(15px, env(safe-area-inset-left));
            }

            .card {
                width: 94vw;
                padding: 30px 20px;
                border-radius: 25px;
            }

            #countdown {
                min-width: 0;
                width: 100%;
                padding: 13px 15px;
                margin-bottom: 24px;
            }

            #songName {
                padding: 0 8px;
            }

            #playButton {
                width: min(100%, 330px);
            }

            footer {
                margin-top: 22px;
            }
        }

        /* LANDSCAPE PHONE */

        @media (max-width: 900px) and (orientation: landscape) {
            #container {
                align-items: center;
            }

            .card {
                padding: 20px 35px;
                max-height: 92dvh;
            }

            .live-label {
                margin-bottom: 8px;
            }

            #title {
                font-size: clamp(2.5rem, 8vw, 5rem);
            }

            #subtitle {
                font-size: clamp(1.6rem, 4vw, 2.7rem);
                margin-bottom: 15px;
            }

            #countdown {
                margin-bottom: 15px;
                padding: 9px 20px;
            }

            .song-wrapper {
                margin-bottom: 15px;
            }

            footer {
                margin-top: 12px;
            }
        }

        /* SHORT SCREENS */

        @media (max-height: 650px) {
            .card {
                padding-top: 20px;
                padding-bottom: 20px;
            }

            .live-label {
                margin-bottom: 8px;
            }

            #subtitle {
                margin-bottom: 15px;
            }

            #countdown {
                margin-bottom: 15px;
            }

            .song-wrapper {
                margin-bottom: 15px;
            }

            footer {
                display: none;
            }
        }

        /* VERY SMALL PHONES */

        @media (max-width: 380px) {
            .card {
                padding: 25px 15px;
            }

            #countdown {
                font-size: 0.95rem;
            }

            #songName {
                font-size: 0.95rem;
            }

            #playButton {
                font-size: 0.9rem;
                padding: 13px 20px;
            }
        }

        /* REDUCED MOTION */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>

<body>

    <div id="bg"></div>

    <div id="snowFar" class="snow-layer"></div>
    <div id="snowMid" class="snow-layer"></div>
    <div id="snowNear" class="snow-layer"></div>

    <main id="container">

        <section class="card">

            <div class="star one">✦</div>
            <div class="star two">✧</div>
            <div class="star three">✦</div>
            <div class="star four">✧</div>

            <div class="live-label">
                <span class="live-dot"></span>
                Christmas Radio
            </div>

            <h1 id="title">Christmas</h1>
            <h1 id="subtitle">Countdown</h1>

            <div id="countdown">
                Loading...
            </div>

            <div class="song-wrapper">

                <div class="now-playing">
                    Now Playing
                </div>

                <div id="songName">
                    Loading radio...
                </div>

            </div>

            <button id="playButton">
                🎄 Start Live Radio
            </button>

            <footer>
                ❄️ Merry Christmas ❄️
            </footer>

        </section>

    </main>

    <audio
        id="musicAudio"
        preload="auto"
        playsinline
        disableRemotePlayback
        controlslist="nodownload noplaybackrate noremoteplayback">
    </audio>

    <audio
        id="speechAudio"
        preload="auto"
        playsinline
        disableRemotePlayback
        controlslist="nodownload noplaybackrate noremoteplayback">
    </audio>


    <script>
        /* =========================================================
           CONFIG
        ========================================================= */

        const RADIO_START =
            new Date("Dec 1, 2025 00:00:00").getTime();

        const SONG_FOLDER = "./songs/";

        const SPEECH_SRC =
            "./songs/speech.mp3";

        const DURATION_MANIFEST =
            "./songs/durations.json";

        const PLAYLIST_PREFIX =
            "Music Now, Trap Music Now, Dance Music Now - ";

        const PLAYLIST_SUFFIX =
            " (SPOTISAVER).mp3";


        /* =========================================================
           SONG LIST
        ========================================================= */

        const SONG_NAMES = [
            "All I Want For Christmas Is You",
            "Baby It's Cold Outside",
            "Blue Christmas",
            "Carol Of The Bells",
            "Christmas (Baby Please Come Home)",
            "Christmas Canon",
            "Deck The Halls",
            "Do You Want To Build A Snowman",
            "Feliz Navidad",
            "Frosty The Snowman",
            "God Rest Ye Merry Gentlemen",
            "Here Comes Santa Claus",
            "Holly Jolly Christmas",
            "I Want A Hippopotamus For Christmas",
            "It's Beginning To Look A Lot Like Christmas",
            "It's The Most Wonderful Time Of The Year",
            "Jingle Bell Rock",
            "Jingle Bells",
            "Last Christmas",
            "Let It Snow! Let It Snow!",
            "Little Drummer Boy",
            "Mistletoe",
            "O Christmas Tree",
            "Rockin Around The Christmas Tree",
            "Rudolph The Red-Nosed Reindeer",
            "Santa Baby",
            "Santa Claus Is Comin' To Town",
            "Silent Night",
            "Sleigh Ride",
            "The Christmas Song",
            "Up On The Housetop",
            "We Wish You A Merry Christmas",
            "White Christmas",
            "Winter Wonderland",
            "Wonderful Christmastime",
            "You're A Mean One, Mr. Grinch"
        ];


        /* =========================================================
           ELEMENTS
        ========================================================= */

        const musicAudio =
            document.getElementById("musicAudio");

        const speechAudio =
            document.getElementById("speechAudio");

        const playButton =
            document.getElementById("playButton");

        const songNameElement =
            document.getElementById("songName");

        const countdownElement =
            document.getElementById("countdown");


        /*
            Explicitly disable remote playback.

            This is particularly important for the Managed
            Media Source path on iPhone Safari.
        */

        try {
            musicAudio.disableRemotePlayback = true;
            speechAudio.disableRemotePlayback = true;
        } catch {}


        /* =========================================================
           STATE
        ========================================================= */

        let durations = [];

        let totalPlaylistDuration = 0;

        let radioPlaying = false;

        let currentSongIndex = 0;

        let currentSongOffset = 0;

        let metadataLoaded = false;

        let metadataLoadingPromise = null;

        let lastSyncTime = 0;

        let speechStarted = false;


        /*
            Prevent overlapping playLive() calls.

            This is important because the visibility handler,
            periodic sync, ended event, and Media Session can
            all potentially request a resync at nearly the
            same time.
        */

        let radioLoadToken = 0;

        let radioPlayPromise = null;


        /* =========================================================
           MANAGED MEDIA SOURCE STATE
        ========================================================= */

        let mediaSource = null;

        let sourceBuffer = null;

        let mediaSourceObjectURL = null;

        let usingManagedMediaSource = false;

        let usingMediaSource = false;


        /* =========================================================
           MEDIA SOURCE SUPPORT
        ========================================================= */

        function getMediaSourceClass() {

            /*
                iPhone Safari uses ManagedMediaSource for
                Media Source Extensions.

                Regular MediaSource remains as a fallback.
            */

            if (
                typeof window.ManagedMediaSource ===
                "function"
            ) {

                return window.ManagedMediaSource;
            }


            if (
                typeof window.MediaSource ===
                "function"
            ) {

                return window.MediaSource;
            }


            return null;
        }


        function getSupportedMSECodec() {

            const MediaSourceClass =
                getMediaSourceClass();


            if (!MediaSourceClass) {
                return null;
            }


            const codecs = [
                "audio/mpeg",
                'audio/mp4; codecs="mp4a.40.2"',
                'audio/mp4; codecs="mp4a.40.5"'
            ];


            for (
                const codec of codecs
            ) {

                try {

                    if (
                        typeof MediaSourceClass.isTypeSupported ===
                        "function" &&
                        MediaSourceClass.isTypeSupported(
                            codec
                        )
                    ) {

                        return codec;
                    }

                } catch (error) {

                    console.warn(
                        "MSE codec check failed:",
                        codec,
                        error
                    );
                }
            }


            return null;
        }


        function canUseManagedMediaSource() {

            const MediaSourceClass =
                getMediaSourceClass();


            if (!MediaSourceClass) {
                return false;
            }


            const codec =
                getSupportedMSECodec();


            if (!codec) {
                return false;
            }


            /*
                Only call this the Managed Media Source path
                when the browser actually exposes it.
            */

            if (
                typeof window.ManagedMediaSource ===
                "function"
            ) {

                return true;
            }


            return false;
        }


        /* =========================================================
           CLEAN UP MEDIA SOURCE
        ========================================================= */

        function destroyMediaSource() {

            sourceBuffer = null;

            mediaSource = null;

            usingManagedMediaSource = false;

            usingMediaSource = false;


            if (mediaSourceObjectURL) {

                try {

                    URL.revokeObjectURL(
                        mediaSourceObjectURL
                    );

                } catch {}

                mediaSourceObjectURL = null;
            }
        }


        /* =========================================================
           CREATE MEDIA SOURCE
        ========================================================= */

        function createMediaSource() {

            const MediaSourceClass =
                getMediaSourceClass();


            if (!MediaSourceClass) {

                throw new Error(
                    "Media Source Extensions are unavailable."
                );
            }


            const codec =
                getSupportedMSECodec();


            if (!codec) {

                throw new Error(
                    "No supported MSE audio codec was found."
                );
            }


            destroyMediaSource();


            mediaSource =
                new MediaSourceClass();


            usingManagedMediaSource =
                typeof window.ManagedMediaSource ===
                "function" &&
                mediaSource instanceof
                window.ManagedMediaSource;


            usingMediaSource = true;


            /*
                Managed Media Source can expose streaming
                lifecycle events.

                We do not depend on them for basic playback,
                but registering them allows Safari to resume
                streaming when it asks the source to do so.
            */

            if (
                usingManagedMediaSource
            ) {

                try {

                    mediaSource.addEventListener(
                        "startstreaming",
                        () => {

                            console.log(
                                "Managed Media Source started streaming."
                            );

                        }
                    );

                } catch {}

                try {

                    mediaSource.addEventListener(
                        "endstreaming",
                        () => {

                            console.log(
                                "Managed Media Source ended streaming."
                            );

                        }
                    );

                } catch {}
            }


            /*
                Prefer srcObject when the browser supports
                assigning the MediaSource directly.
            */

            let connected =
                false;


            if (
                "srcObject" in musicAudio
            ) {

                try {

                    musicAudio.srcObject =
                        mediaSource;

                    connected = true;

                } catch (error) {

                    console.warn(
                        "Could not attach MediaSource through srcObject:",
                        error
                    );
                }
            }


            /*
                Fallback to an object URL.
            */

            if (!connected) {

                mediaSourceObjectURL =
                    URL.createObjectURL(
                        mediaSource
                    );

                musicAudio.src =
                    mediaSourceObjectURL;
            }


            return new Promise(
                (resolve, reject) => {

                    let finished = false;


                    const cleanup =
                        () => {

                            mediaSource.removeEventListener(
                                "sourceopen",
                                onOpen
                            );

                            mediaSource.removeEventListener(
                                "error",
                                onError
                            );
                        };


                    const onOpen =
                        () => {

                            if (finished) {
                                return;
                            }

                            finished = true;

                            cleanup();

                            try {

                                sourceBuffer =
                                    mediaSource.addSourceBuffer(
                                        codec
                                    );

                                resolve();

                            } catch (error) {

                                reject(error);
                            }
                        };


                    const onError =
                        event => {

                            if (finished) {
                                return;
                            }

                            finished = true;

                            cleanup();

                            reject(
                                new Error(
                                    "MediaSource error"
                                )
                            );
                        };


                    mediaSource.addEventListener(
                        "sourceopen",
                        onOpen
                    );

                    mediaSource.addEventListener(
                        "error",
                        onError
                    );


                    /*
                        sourceopen may already have happened.
                    */

                    if (
                        mediaSource.readyState ===
                        "open"
                    ) {

                        onOpen();
                    }
                }
            );
        }


        /* =========================================================
           APPEND BUFFER
        ========================================================= */

        function appendBuffer(
            buffer
        ) {

            return new Promise(
                (resolve, reject) => {

                    if (!sourceBuffer) {

                        reject(
                            new Error(
                                "SourceBuffer is unavailable."
                            )
                        );

                        return;
                    }


                    const onUpdateEnd =
                        () => {

                            sourceBuffer.removeEventListener(
                                "updateend",
                                onUpdateEnd
                            );

                            sourceBuffer.removeEventListener(
                                "error",
                                onError
                            );

                            resolve();
                        };


                    const onError =
                        error => {

                            sourceBuffer.removeEventListener(
                                "updateend",
                                onUpdateEnd
                            );

                            sourceBuffer.removeEventListener(
                                "error",
                                onError
                            );

                            reject(
                                error
                            );
                        };


                    sourceBuffer.addEventListener(
                        "updateend",
                        onUpdateEnd
                    );

                    sourceBuffer.addEventListener(
                        "error",
                        onError
                    );


                    try {

                        sourceBuffer.appendBuffer(
                            buffer
                        );

                    } catch (error) {

                        sourceBuffer.removeEventListener(
                            "updateend",
                            onUpdateEnd
                        );

                        sourceBuffer.removeEventListener(
                            "error",
                            onError
                        );

                        reject(error);
                    }
                }
            );
        }


        /* =========================================================
           LOAD CURRENT SONG THROUGH MSE
        ========================================================= */

        async function loadSongThroughMSE(
            songName,
            offset
        ) {

            /*
                Make sure the browser can actually use MSE.
            */

            if (
                !getMediaSourceClass() ||
                !getSupportedMSECodec()
            ) {

                throw new Error(
                    "MSE is not supported for this audio format."
                );
            }


            const token =
                radioLoadToken;


            const response =
                await fetch(
                    getSongURL(songName),
                    {
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    `Could not fetch song: ${response.status}`
                );
            }


            const audioData =
                await response.arrayBuffer();


            if (
                token !== radioLoadToken
            ) {

                throw new Error(
                    "Radio load was superseded."
                );
            }


            await createMediaSource();


            if (
                !mediaSource ||
                !sourceBuffer
            ) {

                throw new Error(
                    "MediaSource failed to initialize."
                );
            }


            /*
                Set the duration to Infinity.

                This is the important part for treating the
                media as an indefinite/live source.
            */

            try {

                mediaSource.duration =
                    Infinity;

            } catch (error) {

                console.warn(
                    "Could not set MediaSource duration to Infinity:",
                    error
                );
            }


            await appendBuffer(
                audioData
            );


            if (
                token !== radioLoadToken
            ) {

                throw new Error(
                    "Radio load was superseded."
                );
            }


            /*
                Set the live duration again after the data
                has been appended.
            */

            try {

                if (
                    mediaSource.readyState ===
                    "open"
                ) {

                    mediaSource.duration =
                        Infinity;
                }

            } catch (error) {

                console.warn(
                    "Could not maintain infinite MediaSource duration:",
                    error
                );
            }


            /*
                Wait until the audio element knows that the
                MediaSource is attached.
            */

            if (
                musicAudio.readyState < 1
            ) {

                await new Promise(
                    resolve => {

                        const onLoadedMetadata =
                            () => {

                                musicAudio.removeEventListener(
                                    "loadedmetadata",
                                    onLoadedMetadata
                                );

                                resolve();
                            };


                        musicAudio.addEventListener(
                            "loadedmetadata",
                            onLoadedMetadata
                        );


                        setTimeout(
                            () => {

                                musicAudio.removeEventListener(
                                    "loadedmetadata",
                                    onLoadedMetadata
                                );

                                resolve();

                            },
                            3000
                        );
                    }
                );
            }


            /*
                The source starts at 0 because every MSE
                MediaSource represents one current song.

                Seeking inside the buffered song is therefore
                safe.
            */

            try {

                musicAudio.currentTime =
                    Math.max(
                        0,
                        offset
                    );

            } catch (error) {

                console.warn(
                    "MSE seek failed:",
                    error
                );
            }


            return true;
        }


        /* =========================================================
           DIRECT MP3 FALLBACK
        ========================================================= */

        async function loadSongDirectly(
            songName,
            offset
        ) {

            /*
                Destroy any previous MediaSource first.
            */

            try {

                if (
                    musicAudio.srcObject
                ) {

                    musicAudio.srcObject =
                        null;
                }

            } catch {}


            destroyMediaSource();


            const url =
                getSongURL(
                    songName
                );


            const absoluteURL =
                new URL(
                    url,
                    location.href
                ).href;


            if (
                musicAudio.src !==
                absoluteURL
            ) {

                musicAudio.src =
                    url;

                musicAudio.load();
            }


            if (
                musicAudio.readyState < 1
            ) {

                await new Promise(
                    (resolve, reject) => {

                        let finished = false;


                        const cleanup =
                            () => {

                                musicAudio.removeEventListener(
                                    "loadedmetadata",
                                    onMetadata
                                );

                                musicAudio.removeEventListener(
                                    "error",
                                    onError
                                );
                            };


                        const onMetadata =
                            () => {

                                if (finished) {
                                    return;
                                }

                                finished = true;

                                cleanup();

                                resolve();
                            };


                        const onError =
                            () => {

                                if (finished) {
                                    return;
                                }

                                finished = true;

                                cleanup();

                                reject(
                                    new Error(
                                        "Could not load MP3 metadata."
                                    )
                                );
                            };


                        musicAudio.addEventListener(
                            "loadedmetadata",
                            onMetadata
                        );

                        musicAudio.addEventListener(
                            "error",
                            onError
                        );
                    }
                );
            }


            try {

                musicAudio.currentTime =
                    Math.max(
                        0,
                        offset
                    );

            } catch (error) {

                console.warn(
                    "Direct MP3 seek failed:",
                    error
                );
            }


            return true;
        }


        /* =========================================================
           LOAD SONG
        ========================================================= */

        async function loadCurrentSong(
            songName,
            offset
        ) {

            /*
                Prefer Managed Media Source.

                If that path isn't available or fails,
                automatically fall back to the normal MP3
                element.
            */

            const managedSupported =
                canUseManagedMediaSource();


            if (managedSupported) {

                try {

                    console.log(
                        "Attempting Managed Media Source playback..."
                    );


                    await loadSongThroughMSE(
                        songName,
                        offset
                    );


                    console.log(
                        "Managed Media Source playback active."
                    );


                    return "mse";

                } catch (error) {

                    console.warn(
                        "Managed Media Source failed. Falling back to direct MP3:",
                        error
                    );


                    try {

                        if (
                            musicAudio.srcObject
                        ) {

                            musicAudio.srcObject =
                                null;
                        }

                    } catch {}


                    destroyMediaSource();
                }
            }


            await loadSongDirectly(
                songName,
                offset
            );


            console.log(
                "Direct MP3 playback active."
            );


            return "direct";
        }


        /* =========================================================
           MEDIA SESSION
        ========================================================= */

        function updateLiveMediaSession() {

            if (
                !("mediaSession" in navigator)
            ) {
                return;
            }


            const currentSong =
                SONG_NAMES[
                    currentSongIndex
                ] ||
                "Christmas Countdown Radio";


            try {

                navigator.mediaSession.metadata =
                    new MediaMetadata({
                        title:
                            currentSong,

                        artist:
                            "Christmas Countdown Radio",

                        album:
                            "Christmas Countdown",

                        artwork: [
                            {
                                src:
                                    new URL(
                                        "./favicon.ico",
                                        location.href
                                    ).href,

                                sizes:
                                    "512x512",

                                type:
                                    "image/x-icon"
                            }
                        ]
                    });

            } catch (error) {

                console.warn(
                    "Could not set Media Session metadata:",
                    error
                );
            }


            /*
                For the MSE live path, use an indefinite
                duration.

                Some Safari versions may still display a
                timeline depending on the underlying media
                implementation. The MediaSource Infinity
                duration is the browser-supported mechanism
                for indicating indefinite media.
            */

            try {

                if (
                    Number.isFinite(
                        musicAudio.duration
                    )
                ) {

                    /*
                        Do not lie about the MP3 duration in
                        the fallback path.
                    */

                    navigator.mediaSession.setPositionState({
                        duration:
                            musicAudio.duration,

                        playbackRate:
                            musicAudio.playbackRate || 1,

                        position:
                            Math.min(
                                Math.max(
                                    0,
                                    musicAudio.currentTime || 0
                                ),
                                Math.max(
                                    0.001,
                                    musicAudio.duration
                                )
                            )
                    });

                } else {

                    navigator.mediaSession.setPositionState({
                        duration:
                            Infinity,

                        playbackRate:
                            musicAudio.playbackRate || 1,

                        position:
                            0
                    });
                }

            } catch (error) {

                console.warn(
                    "Could not update Media Session position:",
                    error
                );
            }
        }


        function setupMediaSession() {

            if (
                !("mediaSession" in navigator)
            ) {
                return;
            }


            updateLiveMediaSession();


            /*
                PLAY
            */

            try {

                navigator.mediaSession.setActionHandler(
                    "play",
                    async () => {

                        await resumeLive();
                    }
                );

            } catch {}


            /*
                PAUSE
            */

            try {

                navigator.mediaSession.setActionHandler(
                    "pause",
                    () => {

                        pauseRadio();
                    }
                );

            } catch {}


            /*
                Do not allow lock-screen track skipping.
            */

            const blockedActions = [
                "nexttrack",
                "previoustrack",
                "seekbackward",
                "seekforward",
                "seekto"
            ];


            for (
                const action of blockedActions
            ) {

                try {

                    navigator.mediaSession.setActionHandler(
                        action,
                        () => {}
                    );

                } catch {}
            }
        }


        setupMediaSession();


        /* =========================================================
           HELPERS
        ========================================================= */

        function getSongFilename(
            songName
        ) {

            return (
                PLAYLIST_PREFIX +
                songName +
                PLAYLIST_SUFFIX
            );
        }


        function getSongURL(
            songName
        ) {

            return (
                SONG_FOLDER +
                encodeURIComponent(
                    getSongFilename(
                        songName
                    )
                )
            );
        }


        function formatTime(
            seconds
        ) {

            if (
                !Number.isFinite(seconds)
            ) {

                return "0:00";
            }


            seconds =
                Math.max(
                    0,
                    Math.floor(seconds)
                );


            const minutes =
                Math.floor(
                    seconds / 60
                );


            const secs =
                String(
                    seconds % 60
                ).padStart(
                    2,
                    "0"
                );


            return `${minutes}:${secs}`;
        }


        /* =========================================================
           COUNTDOWN
        ========================================================= */

        function updateCountdown() {

            const now =
                new Date();


            let christmas =
                new Date(
                    now.getFullYear(),
                    11,
                    25,
                    0,
                    0,
                    0,
                    0
                );


            if (
                now.getTime() >=
                christmas.getTime()
            ) {

                christmas =
                    new Date(
                        now.getFullYear() + 1,
                        11,
                        25,
                        0,
                        0,
                        0,
                        0
                    );
            }


            const difference =
                christmas.getTime() -
                now.getTime();


            const totalSeconds =
                Math.floor(
                    difference / 1000
                );


            const days =
                Math.floor(
                    totalSeconds / 86400
                );


            const hours =
                Math.floor(
                    (
                        totalSeconds %
                        86400
                    ) / 3600
                );


            const minutes =
                Math.floor(
                    (
                        totalSeconds %
                        3600
                    ) / 60
                );


            const seconds =
                totalSeconds %
                60;


            countdownElement.textContent =
                `${days}d ${hours}h ${minutes}m ${seconds}s`;
        }


        updateCountdown();


        setInterval(
            updateCountdown,
            1000
        );
