<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="theme-color" content="#12030a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="icon" href="favicon.ico">

    <title>Christmas Countdown • Live Radio</title>

    <style>
    :root {
        --red: #d71920;
        --red-dark: #8d0710;
        --green: #0b6b3a;
        --green-dark: #063d25;
        --gold: #ffd76a;
        --white: #ffffff;

        --glass-bg: rgba(255, 255, 255, 0.075);
        --glass-bg-strong: rgba(255, 255, 255, 0.105);
        --glass-border: rgba(255, 255, 255, 0.25);
        --glass-highlight: rgba(255, 255, 255, 0.42);
        --glass-shadow: rgba(0, 0, 0, 0.42);
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;

        -webkit-tap-highlight-color: transparent;

        user-select: none;
        -webkit-user-select: none;
    }

    html,
    body {
        width: 100%;
        height: 100%;

        overflow: hidden;

        touch-action: none;

        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;

        overscroll-behavior: none;
    }

    body {
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "SF Pro Display",
            "SF Pro Text",
            "Segoe UI",
            Arial,
            sans-serif;

        color: var(--white);

        background:
            radial-gradient(
                circle at 15% 15%,
                rgba(255, 255, 255, 0.08),
                transparent 25%
            ),
            radial-gradient(
                circle at 85% 80%,
                rgba(11, 107, 58, 0.30),
                transparent 35%
            ),
            radial-gradient(
                circle at 15% 80%,
                rgba(215, 25, 32, 0.28),
                transparent 35%
            ),
            #12030a;
    }

    /*
     * BACKGROUND
     */

    #bg {
        position: fixed;

        inset: -4%;

        width: 108%;
        height: 108%;

        background-image:
            linear-gradient(
                rgba(15, 0, 5, 0.20),
                rgba(15, 0, 5, 0.48)
            ),
            url("christmas-background.jpg");

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;

        filter:
            saturate(1.2)
            contrast(1.02);

        z-index: -5;

        transform: translateZ(0);
    }

    /*
     * SNOW
     */

    .snow-layer {
        position: fixed;

        inset: 0;

        pointer-events: none;

        overflow: hidden;
    }

    /*
     * All normal snow stays behind
     * the glass card.
     */

    #snowFar,
    #snowMid,
    #snowNear {
        z-index: 2;
    }

    /*
     * Only selected white-circle
     * snow is placed here.
     */

    #snowAbove {
        z-index: 10;
    }

    /*
     * SNOWFLAKE
     */

    .snowflake {
        position: absolute;

        top: -30px;

        color: rgba(255, 255, 255, 0.9);

        font-size: var(--size);

        opacity: var(--opacity);

        /*
         * One combined animation prevents
         * the old left/right twitching.
         */

        animation:
            smoothSnowFall
            var(--duration)
            linear
            infinite;

        animation-delay: var(--delay);

        will-change: transform;
    }

    /*
     * White circle snow
     */

    .circle-snow {
        color: #ffffff;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        font-weight: 400;

        line-height: 1;

        text-shadow:
            0 0 5px
            rgba(255, 255, 255, 0.35);

        will-change:
            transform,
            opacity;
    }

    .circle-snow.far {
        filter:
            blur(0.25px);
    }

    .circle-snow.mid {
        filter:
            blur(0.1px);

        text-shadow:
            0 0 7px
            rgba(255, 255, 255, 0.45);
    }

    .circle-snow.near {
        text-shadow:
            0 0 9px
            rgba(255, 255, 255, 0.65),
            0 0 18px
            rgba(255, 255, 255, 0.25);
    }

    /*
     * Smooth falling + gentle sideways
     * movement.
     *
     * The horizontal movement is part
     * of the same transform animation,
     * so it never fights another animation.
     */

    @keyframes smoothSnowFall {

        0% {
            transform:
                translate3d(
                    var(--drift-start),
                    -50px,
                    0
                );
        }

        12% {
            transform:
                translate3d(
                    var(--drift-one),
                    12vh,
                    0
                );
        }

        25% {
            transform:
                translate3d(
                    var(--drift-two),
                    25vh,
                    0
                );
        }

        37% {
            transform:
                translate3d(
                    var(--drift-three),
                    37vh,
                    0
                );
        }

        50% {
            transform:
                translate3d(
                    var(--drift-four),
                    50vh,
                    0
                );
        }

        62% {
            transform:
                translate3d(
                    var(--drift-five),
                    62vh,
                    0
                );
        }

        75% {
            transform:
                translate3d(
                    var(--drift-six),
                    75vh,
                    0
                );
        }

        87% {
            transform:
                translate3d(
                    var(--drift-seven),
                    87vh,
                    0
                );
        }

        100% {
            transform:
                translate3d(
                    var(--drift-end),
                    110vh,
                    0
                );
        }
    }

    /*
     * MAIN CONTAINER
     */

    #container {
        width: 100%;
        height: 100dvh;

        display: flex;

        align-items: center;
        justify-content: center;

        padding:
            max(20px, env(safe-area-inset-top))
            max(20px, env(safe-area-inset-right))
            max(20px, env(safe-area-inset-bottom))
            max(20px, env(safe-area-inset-left));

        position: relative;

        z-index: 5;
    }

    /*
     * LIQUID GLASS CARD
     */

    .card {
        width: min(92vw, 900px);

        padding:
            clamp(30px, 5vw, 60px);

        text-align: center;

        position: relative;

        background:
    linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.11),
        rgba(255, 255, 255, 0.035) 45%,
        rgba(255, 255, 255, 0.06)
    );

        border:
            1px solid
            rgba(255, 255, 255, 0.24);

        border-radius: 32px;

        backdrop-filter:
            blur(28px)
            saturate(180%);

        -webkit-backdrop-filter:
            blur(28px)
            saturate(180%);

        box-shadow:
            0 35px 100px
                rgba(0, 0, 0, 0.48),

            0 10px 30px
                rgba(0, 0, 0, 0.22),

            inset 0 1px 0
                rgba(255, 255, 255, 0.42),

            inset 1px 0 0
                rgba(255, 255, 255, 0.12),

            inset 0 -1px 0
                rgba(255, 255, 255, 0.07);
    }

    /*
     * GLASS REFLECTION
     */

    .card::before {
        content: "";

        position: absolute;

        inset: 1px;

        border-radius: 31px;

        pointer-events: none;

        background:
            linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.18),
                transparent 27%,
                transparent 65%,
                rgba(255, 255, 255, 0.055)
            );

        opacity: 0.9;
    }

    /*
     * GLASS LOWER GLOW
     */

    .card::after {
        content: "";

        position: absolute;

        left: 10%;
        right: 10%;

        bottom: -18px;

        height: 35px;

        border-radius: 50%;

        background:
            rgba(255, 255, 255, 0.08);

        filter:
            blur(22px);

        pointer-events: none;

        z-index: -1;
    }

    .card > * {
        position: relative;

        z-index: 2;
    }

    /*
     * LIVE LABEL
     */

    .live-label {
        display: inline-flex;

        align-items: center;

        gap: 9px;

        padding:
            9px 17px;

        border-radius: 999px;

        background:
            linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.15),
                rgba(255, 255, 255, 0.055)
            );

        border:
            1px solid
            rgba(255, 255, 255, 0.22);

        box-shadow:
            inset 0 1px 0
                rgba(255, 255, 255, 0.28),

            0 5px 20px
                rgba(0, 0, 0, 0.12);

        backdrop-filter:
            blur(18px)
            saturate(160%);

        -webkit-backdrop-filter:
            blur(18px)
            saturate(160%);

        font-size:
            0.78rem;

        font-weight:
            800;

        letter-spacing:
            0.12em;

        text-transform:
            uppercase;

        margin-bottom:
            20px;
    }

    .live-dot {
        width: 9px;
        height: 9px;

        border-radius: 50%;

        background:
            #ff3038;

        box-shadow:
            0 0 8px #ff3038,
            0 0 16px
            rgba(255, 48, 56, 0.65);

        animation:
            livePulse
            1.4s
            infinite;
    }

    @keyframes livePulse {

        0%,
        100% {
            opacity: 1;

            transform:
                scale(1);
        }

        50% {
            opacity: 0.45;

            transform:
                scale(0.75);
        }
    }

    /*
     * CHRISTMAS TITLE
     *
     * Rich Christmas red + green.
     */

    #title {
        font-size:
            clamp(3rem, 9vw, 7rem);

        line-height:
            0.95;

        font-weight:
            900;

        letter-spacing:
            -0.06em;

        background:
            linear-gradient(
                105deg,
                #ff2933 0%,
                #d71920 22%,
                #ffffff 43%,
                #ffffff 49%,
                #0fa15a 64%,
                #0b6b3a 82%,
                #16a864 100%
            );

        background-size:
            200% 100%;

        -webkit-background-clip:
            text;

        background-clip:
            text;

        color:
            transparent;

        text-shadow:
            0 10px 40px
            rgba(0, 0, 0, 0.35);

        margin-bottom:
            4px;
    }

    /*
     * COUNTDOWN TITLE
     */

    #subtitle {
        font-size:
            clamp(2rem, 5vw, 4rem);

        line-height:
            1;

        font-weight:
            800;

        color:
            #ffffff;

        text-shadow:
            0 5px 25px
            rgba(0, 0, 0, 0.4);

        margin-bottom:
            28px;
    }

    /*
     * COUNTDOWN GLASS
     */

    #countdown {
        display:
            inline-flex;

        align-items:
            center;

        justify-content:
            center;

        min-width:
            min(90%, 500px);

        padding:
            15px 25px;

        border-radius:
            999px;

        background:
            linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.13),
                rgba(255, 255, 255, 0.045)
            );

        border:
            1px solid
            rgba(255, 255, 255, 0.24);

        backdrop-filter:
            blur(22px)
            saturate(180%);

        -webkit-backdrop-filter:
            blur(22px)
            saturate(180%);

        box-shadow:
            inset 0 1px 0
                rgba(255, 255, 255, 0.35),

            inset 0 -1px 0
                rgba(255, 255, 255, 0.07),

            0 12px 35px
                rgba(0, 0, 0, 0.20);

        font-size:
            clamp(1.1rem, 3vw, 1.7rem);

        font-weight:
            800;

        letter-spacing:
            0.03em;

        margin-bottom:
            30px;
    }

    /*
     * NOW PLAYING
     */

    .song-wrapper {
        margin-bottom:
            28px;
    }

    .now-playing {
        font-size:
            0.72rem;

        font-weight:
            800;

        text-transform:
            uppercase;

        letter-spacing:
            0.18em;

        opacity:
            0.72;

        margin-bottom:
            9px;
    }

    #songName {
        min-height:
            1.5em;

        font-size:
            clamp(1rem, 3vw, 1.45rem);

        font-weight:
            700;

        color:
            #ffffff;

        text-shadow:
            0 2px 12px
            rgba(0, 0, 0, 0.45);
    }

    .up-next-wrapper {
        margin-top:
            14px;

        margin-bottom:
            4px;
    }

    .up-next-label {
        font-size:
            0.62rem;

        font-weight:
            800;

        text-transform:
            uppercase;

        letter-spacing:
            0.16em;

        opacity:
            0.52;

        margin-bottom:
            5px;
    }

    #upNext {
        min-height:
            1.3em;

        font-size:
            clamp(0.85rem, 2.5vw, 1rem);

        font-weight:
            700;

        color:
            rgba(255, 255, 255, 0.78);

        text-shadow:
            0 2px 10px
            rgba(0, 0, 0, 0.35);
    }

    /*
     * PLAY BUTTON
     */

    #playButton {
        position:
            relative;

        overflow:
            hidden;

        border:
            1px solid
            rgba(255, 255, 255, 0.25);

        outline:
            none;

        padding:
            15px 28px;

        border-radius:
            999px;

        background:
            linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.20),
                rgba(215, 25, 32, 0.42),
                rgba(141, 7, 16, 0.55)
            );

        color:
            white;

        font-size:
            1rem;

        font-weight:
            800;

        cursor:
            pointer;

        touch-action:
            manipulation;

        backdrop-filter:
            blur(20px)
            saturate(170%);

        -webkit-backdrop-filter:
            blur(20px)
            saturate(170%);

        box-shadow:
            inset 0 1px 0
                rgba(255, 255, 255, 0.4),

            inset 0 -1px 0
                rgba(0, 0, 0, 0.15),

            0 12px 35px
                rgba(120, 0, 0, 0.28);

        transition:
            transform 0.18s ease,
            box-shadow 0.18s ease;
    }

    #playButton::before {
        content:
            "";

        position:
            absolute;

        top:
            0;

        left:
            -40%;

        width:
            35%;

        height:
            100%;

        background:
            linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.30),
                transparent
            );

        transform:
            skewX(-20deg);

        transition:
            left 0.65s ease;
    }

    #playButton:hover::before {
        left:
            110%;
    }

    #playButton:active {
        transform:
            scale(0.96);

        box-shadow:
            inset 0 1px 0
                rgba(255, 255, 255, 0.3),

            0 5px 18px
                rgba(0, 0, 0, 0.25);
    }

    #playButton:hover {
        transform:
            translateY(-2px);

        box-shadow:
            inset 0 1px 0
                rgba(255, 255, 255, 0.45),

            0 16px 40px
                rgba(120, 0, 0, 0.34);
    }

    #playButton.paused {
        background:
            linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.18),
                rgba(13, 122, 67, 0.45),
                rgba(7, 85, 47, 0.55)
            );

        box-shadow:
            inset 0 1px 0
                rgba(255, 255, 255, 0.4),

            0 12px 35px
                rgba(0, 80, 40, 0.25);
    }

    /*
     * FOOTER
     */

    footer {
        margin-top:
            28px;

        font-size:
            0.78rem;

        font-weight:
            700;

        opacity:
            0.65;

        letter-spacing:
            0.08em;
    }

    audio {
        display:
            none !important;
    }

    /*
     * MOBILE
     */

    @media (max-width: 768px) {

        #container {
            padding:
                max(15px, env(safe-area-inset-top))
                max(15px, env(safe-area-inset-right))
                max(15px, env(safe-area-inset-bottom))
                max(15px, env(safe-area-inset-left));
        }

        .card {
            width:
                94vw;

            padding:
                30px 20px;

            border-radius:
                28px;

            backdrop-filter:
                blur(25px)
                saturate(180%);

            -webkit-backdrop-filter:
                blur(25px)
                saturate(180%);
        }

        .card::before {
            border-radius:
                27px;
        }

        #countdown {
            min-width:
                0;

            width:
                100%;

            padding:
                13px 15px;

            margin-bottom:
                24px;
        }

        #songName {
            padding:
                0 8px;
        }

        #playButton {
            width:
                min(100%, 330px);
        }

        footer {
            margin-top:
                22px;
        }
    }

    /*
     * LANDSCAPE
     */

    @media (max-width: 900px) and (orientation: landscape) {

        #container {
            align-items:
                center;
        }

        .card {
            padding:
                20px 35px;

            max-height:
                92dvh;

            overflow-y:
                auto;

            border-radius:
                26px;
        }

        .live-label {
            margin-bottom:
                8px;
        }

        #title {
            font-size:
                clamp(2.5rem, 8vw, 5rem);
        }

        #subtitle {
            font-size:
                clamp(1.6rem, 4vw, 2.7rem);

            margin-bottom:
                15px;
        }

        #countdown {
            margin-bottom:
                15px;

            padding:
                9px 20px;
        }

        .song-wrapper {
            margin-bottom:
                15px;
        }

        footer {
            margin-top:
                12px;
        }
    }

    /*
     * SMALL HEIGHT
     */

    @media (max-height: 650px) {

        .card {
            padding-top:
                20px;

            padding-bottom:
                20px;
        }

        .live-label {
            margin-bottom:
                8px;
        }

        #subtitle {
            margin-bottom:
                15px;
        }

        #countdown {
            margin-bottom:
                15px;
        }

        .song-wrapper {
            margin-bottom:
                15px;
        }

        footer {
            display:
                none;
        }
    }

    /*
     * SMALL PHONES
     */

    @media (max-width: 380px) {

        .card {
            padding:
                25px 15px;

            border-radius:
                25px;
        }

        #countdown {
            font-size:
                0.95rem;
        }

        #songName {
            font-size:
                0.95rem;
        }

        #upNext {
            font-size:
                0.8rem;
        }

        #playButton {
            font-size:
                0.9rem;

            padding:
                13px 20px;
        }
    }

    /*
     * REDUCED MOTION
     */

    @media (prefers-reduced-motion: reduce) {

        *,
        *::before,
        *::after {
            animation-duration:
                0.001ms !important;

            animation-iteration-count:
                1 !important;

            transition-duration:
                0.001ms !important;
        }
    }
</style>
</head>

<body>

    <div id="bg"></div>

    <div id="snowFar" class="snow-layer"></div>
    <div id="snowMid" class="snow-layer"></div>
    <div id="snowNear" class="snow-layer"></div>

    <!-- Only selected circle snow goes above the glass -->
    <div id="snowAbove" class="snow-layer"></div>

    <main id="container">

        <section class="card">

            <div class="live-label">
                <span class="live-dot"></span>
                Christmas Radio
            </div>

            <h1 id="title">
                Christmas
            </h1>

            <h1 id="subtitle">
                Countdown
            </h1>

            <div id="countdown">
                Loading...
            </div>

            <div class="song-wrapper">

                <div class="now-playing">
                    Now Playing
                </div>

                <div id="songName">
                    Loading radio...
                </div>

                <div class="up-next-wrapper">

                    <div class="up-next-label">
                        Up Next
                    </div>

                    <div id="upNext">
                        Loading...
                    </div>

                </div>

            </div>

            <button id="playButton">
                🎄 Start Live Radio
            </button>

            <footer>
                ❄️ Merry Christmas ❄️
            </footer>

        </section>

    </main>

    <audio
        id="musicAudio"
        preload="auto"
        playsinline
        controlslist="nodownload noplaybackrate noremoteplayback">
    </audio>

    <audio
        id="speechAudio"
        preload="auto"
        playsinline
        controlslist="nodownload noplaybackrate noremoteplayback">
    </audio>

    <script>

        /*
         * FULL MOBILE GESTURE PREVENTION
         */

        let lastTouchEnd = 0;

        document.addEventListener(
            "touchend",
            event => {

                const now = Date.now();

                if (
                    now - lastTouchEnd <= 300
                ) {
                    event.preventDefault();
                }

                lastTouchEnd = now;

            },
            {
                passive: false
            }
        );

        document.addEventListener(
            "gesturestart",
            event => {
                event.preventDefault();
            },
            {
                passive: false
            }
        );

        document.addEventListener(
            "gesturechange",
            event => {
                event.preventDefault();
            },
            {
                passive: false
            }
        );

        document.addEventListener(
            "gestureend",
            event => {
                event.preventDefault();
            },
            {
                passive: false
            }
        );


        /*
         * ELEMENTS
         */

        const musicAudio =
            document.getElementById(
                "musicAudio"
            );

        const speechAudio =
            document.getElementById(
                "speechAudio"
            );

        const playButton =
            document.getElementById(
                "playButton"
            );

        const songNameElement =
            document.getElementById(
                "songName"
            );

        const upNextElement =
            document.getElementById(
                "upNext"
            );

        const countdownElement =
            document.getElementById(
                "countdown"
            );


        /*
         * RADIO CONFIGURATION
         */

        const RADIO_START =
            new Date(
                "Dec 1, 2025 00:00:00"
            ).getTime();

        const SONG_FOLDER =
            "./songs/";

        const SPEECH_SRC =
            "./songs/speech.mp3";

        const DURATION_MANIFEST =
            "./songs/durations.json";

        const SONGS_PER_SPEECH =
            4;


        /*
         * STATE
         */

        let songs = [];

        let speechDuration = 0;

        let totalPlaylistDuration = 0;

        let metadataLoaded = false;

        let metadataLoadingPromise = null;

        let radioPlaying = false;

        let currentSongIndex = 0;

        let currentSegmentType = "song";

        let isChangingTrack = false;


        /*
         * FORMAT TIME
         */

        function formatTime(seconds) {

            if (
                !Number.isFinite(seconds)
            ) {
                return "0:00";
            }

            seconds =
                Math.max(
                    0,
                    Math.floor(seconds)
                );

            const minutes =
                Math.floor(
                    seconds / 60
                );

            const secs =
                String(
                    seconds % 60
                ).padStart(
                    2,
                    "0"
                );

            return `${minutes}:${secs}`;
        }


        /*
         * CHRISTMAS COUNTDOWN
         */

        function updateCountdown() {

            const now =
                new Date();

            let christmas =
                new Date(
                    now.getFullYear(),
                    11,
                    25,
                    0,
                    0,
                    0,
                    0
                );

            if (
                now >= christmas
            ) {

                christmas =
                    new Date(
                        now.getFullYear() + 1,
                        11,
                        25,
                        0,
                        0,
                        0,
                        0
                    );
            }

            const seconds =
                Math.floor(
                    (
                        christmas - now
                    ) / 1000
                );

            const days =
                Math.floor(
                    seconds / 86400
                );

            const hours =
                Math.floor(
                    (
                        seconds % 86400
                    ) / 3600
                );

            const minutes =
                Math.floor(
                    (
                        seconds % 3600
                    ) / 60
                );

            const secs =
                seconds % 60;

            countdownElement.textContent =
                `${days}d ${hours}h ${minutes}m ${secs}s`;
        }

        updateCountdown();

        setInterval(
            updateCountdown,
            1000
        );


        /*
         * SNOW
         *
         * ❄ and • are separated.
         *
         * ❄ snow remains at the original
         * quantities.
         *
         * • snow gets considerably more
         * particles.
         */

        function setSnowDrift(
            snowflake,
            driftAmount
        ) {

            /*
             * Give every snowflake its own
             * smooth horizontal path.
             */

            const center =
                (Math.random() - 0.5) *
                driftAmount;

            const swing =
                8 +
                Math.random() *
                (driftAmount * 0.55);

            const direction =
                Math.random() > 0.5
                    ? 1
                    : -1;

            snowflake.style.setProperty(
                "--drift-start",
                `${center - swing * direction}px`
            );

            snowflake.style.setProperty(
                "--drift-one",
                `${center + swing * 0.25 * direction}px`
            );

            snowflake.style.setProperty(
                "--drift-two",
                `${center + swing * direction}px`
            );

            snowflake.style.setProperty(
                "--drift-three",
                `${center + swing * 0.35 * direction}px`
            );

            snowflake.style.setProperty(
                "--drift-four",
                `${center - swing * 0.45 * direction}px`
            );

            snowflake.style.setProperty(
                "--drift-five",
                `${center - swing * direction}px`
            );

            snowflake.style.setProperty(
                "--drift-six",
                `${center - swing * 0.30 * direction}px`
            );

            snowflake.style.setProperty(
                "--drift-seven",
                `${center + swing * 0.55 * direction}px`
            );

            snowflake.style.setProperty(
                "--drift-end",
                `${center + swing * 0.15 * direction}px`
            );
        }


        function createSnowflakes(
            container,

        ) {

            for (

                i < amount;
                i++
            ) {

        /*
         * WHITE CIRCLE SNOW
         *
         * Only selected • particles are
         * moved into snowAbove.
         *
         * This means ❄ can NEVER appear
         * over the glass.
         */

        function createCircleSnow(
            container,
            amount,
            depth
        ) {

            for (
                let i = 0;
                i < amount;
                i++
            ) {

                const snowflake =
                    document.createElement(
                        "div"
                    );

                snowflake.className =
                    `snowflake circle-snow ${depth}`;

                snowflake.textContent =
                    "•";


                let minSize;
                let maxSize;

                let minOpacity;
                let maxOpacity;

                let minDuration;
                let maxDuration;

                let driftAmount;


                if (
                    depth === "far"
                ) {

                    minSize = 3;
                    maxSize = 7;

                    minOpacity = 0.18;
                    maxOpacity = 0.42;

                    minDuration = 10;
                    maxDuration = 20;

                    driftAmount = 35;

                } else if (
                    depth === "mid"
                ) {

                    minSize = 5;
                    maxSize = 11;

                    minOpacity = 0.35;
                    maxOpacity = 0.68;

                    minDuration = 8;
                    maxDuration = 16;

                    driftAmount = 50;

                } else {

                    minSize = 8;
                    maxSize = 17;

                    minOpacity = 0.55;
                    maxOpacity = 0.95;

                    minDuration = 6;
                    maxDuration = 13;

                    driftAmount = 65;
                }


                const size =
                    minSize +
                    Math.random() *
                    (
                        maxSize -
                        minSize
                    );

                const opacity =
                    minOpacity +
                    Math.random() *
                    (
                        maxOpacity -
                        minOpacity
                    );

                const duration =
                    minDuration +
                    Math.random() *
                    (
                        maxDuration -
                        minDuration
                    );


                snowflake.style.left =
                    `${Math.random() * 100}%`;

                snowflake.style.setProperty(
                    "--size",
                    `${size}px`
                );

                snowflake.style.setProperty(
                    "--opacity",
                    opacity
                );

                snowflake.style.setProperty(
                    "--duration",
                    `${duration}s`
                );

                snowflake.style.setProperty(
                    "--delay",
                    `${-Math.random() * duration}s`
                );

                /*
                 * Random starting height.
                 */

                snowflake.style.top =
                    `${-20 - Math.random() * 100}px`;


                /*
                 * Smooth natural movement.
                 */

                setSnowDrift(
                    snowflake,
                    driftAmount
                );


                /*
                 * Above-glass probability.
                 *
                 * Far  = 8%
                 * Mid  = 40%
                 * Near = 70%
                 *
                 * This makes the effect noticeable
                 * without putting all the snow
                 * over the card.
                 */

                let aboveChance;

                if (
                    depth === "far"
                ) {

                    aboveChance =
                        0.08;

                } else if (
                    depth === "mid"
                ) {

                    aboveChance =
                        0.40;

                } else {

                    aboveChance =
                        0.70;
                }


                const shouldGoAbove =
                    Math.random() <
                    aboveChance;


                if (
                    shouldGoAbove
                ) {

                    document
                        .getElementById(
                            "snowAbove"
                        )
                        .appendChild(

        /*
         * LOAD durations.json
         */

        async function loadDurations() {

            if (
                metadataLoaded
            ) {
                return;
            }

            if (
                metadataLoadingPromise
            ) {
                return metadataLoadingPromise;
            }

            metadataLoadingPromise =
                (async () => {

                    const response =
                        await fetch(
                            DURATION_MANIFEST,
                            {
                                cache:
                                    "no-store"
                            }
                        );

                    if (
                        !response.ok
                    ) {

                        throw new Error(
                            `Could not load durations.json (${response.status})`
                        );
                    }

                    const data =
                        await response.json();

                    if (
                        !data ||
                        !Array.isArray(
                            data.songs
                        )
                    ) {

                        throw new Error(
                            "durations.json must contain a 'songs' array."
                        );
                    }


                    songs =
                        data.songs.map(
                            (
                                entry,
                                index
                            ) => {

                                if (
                                    !entry ||
                                    typeof entry !==
                                        "object"
                                ) {

                                    throw new Error(
                                        `Invalid song entry at index ${index}.`
                                    );
                                }

                                const name =
                                    String(
                                        entry.name ??
                                        ""
                                    ).trim();

                                const file =
                                    String(
                                        entry.file ??
                                        ""
                                    ).trim();

                                const duration =
                                    Number(
                                        entry.duration
                                    );

                                if (
                                    !name
                                ) {

                                    throw new Error(
                                        `Song ${index + 1} is missing its name.`
                                    );
                                }

                                if (
                                    !file
                                ) {

                                    throw new Error(
                                        `"${name}" is missing its file in durations.json.`
                                    );
                                }

                                if (
                                    !Number.isFinite(
                                        duration
                                    ) ||
                                    duration <= 0
                                ) {

                                    throw new Error(
                                        `"${name}" has an invalid duration in durations.json.`
                                    );
                                }

                                return {
                                    name,
                                    file,
                                    duration
                                };
                            }
                        );


                    if (
                        songs.length === 0
                    ) {

                        throw new Error(
                            "durations.json contains no songs."
                        );
                    }


                    /*
                     * SPEECH DURATION
                     */

                    try {

                        const speechMetadata =
                            document.createElement(
                                "audio"
                            );

                        speechMetadata.preload =
                            "metadata";

                        speechMetadata.src =
                            SPEECH_SRC;

                        speechDuration =
                            await new Promise(
                                (
                                    resolve,
                                    reject
                                ) => {

                                    const timeout =
                                        setTimeout(
                                            () => {

                                                reject(
                                                    new Error(
                                                        "Timed out loading speech.mp3"
                                                    )
                                                );

                                            },
                                            15000
                                        );


                                    speechMetadata.addEventListener(
                                        "loadedmetadata",
                                        () => {

                                            clearTimeout(
                                                timeout
                                            );

                                            const duration =
                                                speechMetadata.duration;

                                            if (
                                                Number.isFinite(
                                                    duration
                                                ) &&
                                                duration > 0
                                            ) {

                                                resolve(
                                                    duration
                                                );

                                            } else {

                                                reject(
                                                    new Error(
                                                        "Invalid speech duration"
                                                    )
                                                );
                                            }

                                        },
                                        {
                                            once:
                                                true
                                        }
                                    );


                                    speechMetadata.addEventListener(
                                        "error",
                                        () => {

                                            clearTimeout(
                                                timeout
                                            );

                                            reject(
                                                new Error(
                                                    "Could not load speech.mp3"
                                                )
                                            );

                                        },
                                        {
                                            once:
                                                true
                                        }
                                    );


                                    speechMetadata.load();
                                }
                            );

                    } catch (
                        error
                    ) {

                        console.error(
                            "Could not read speech duration:",
                            error
                        );

                        speechDuration =
                            0;
                    }


                    /*
                     * PLAYLIST DURATION
                     */

                    totalPlaylistDuration =
                        0;

                    for (
                        let i = 0;
                        i < songs.length;
                        i++
                    ) {

                        totalPlaylistDuration +=
                            songs[i].duration;

                        if (
                            (i + 1) %
                                SONGS_PER_SPEECH ===
                                0 &&
                            speechDuration > 0
                        ) {

                            totalPlaylistDuration +=
                                speechDuration;
                        }
                    }


                    if (
                        totalPlaylistDuration <= 0
                    ) {

                        throw new Error(
                            "No valid playlist duration was found."
                        );
                    }


                    metadataLoaded =
                        true;


                    console.log(
                        "Loaded songs:",
                        songs.length
                    );

                    console.log(
                        "Speech duration:",
                        formatTime(
                            speechDuration
                        )
                    );

                    console.log(
                        "Total radio timeline:",
                        formatTime(
                            totalPlaylistDuration
                        )
                    );

                })()
                    .catch(
                        error => {

                            metadataLoadingPromise =
                                null;

                            throw error;
                        }
                    );


            return metadataLoadingPromise;
        }


        /*
         * FIND LIVE SEGMENT
         */

        function findLiveSegment() {

            if (
                !metadataLoaded ||
                totalPlaylistDuration <= 0
            ) {

                return {
                    type:
                        "song",

                    index:
                        0,

                    offset:
                        0
                };
            }


            const elapsed =
                (
                    Date.now() -
                    RADIO_START
                ) / 1000;


            const position =
                (
                    (
                        elapsed %
                        totalPlaylistDuration
                    ) +
                    totalPlaylistDuration
                ) %
                totalPlaylistDuration;


            let accumulated =
                0;


            for (
                let i = 0;
                i < songs.length;
                i++
            ) {

                const duration =
                    songs[i].duration;


                if (
                    position <
                    accumulated +
                    duration
                ) {

                    return {
                        type:
                            "song",

                        index:
                            i,

                        offset:
                            position -
                            accumulated
                    };
                }


                accumulated +=
                    duration;


                if (
                    (i + 1) %
                        SONGS_PER_SPEECH ===
                        0 &&
                    speechDuration > 0
                ) {

                    if (
                        position <
                        accumulated +
                        speechDuration
                    ) {

                        return {
                            type:
                                "speech",

                            index:
                                i,

                            offset:
                                position -
                                accumulated
                        };
                    }


                    accumulated +=
                        speechDuration;
                }
            }


            return {
                type:
                    "song",

                index:
                    0,

                offset:
                    0
            };
        }


        /*
         * DISPLAY SONG INDEX
         */

        function getDisplaySongIndex(
            segment
        ) {

            if (
                segment.type ===
                "speech"
            ) {

                return (
                    (
                        segment.index +
                        1
                    ) %
                    songs.length
                );
            }

            return segment.index;
        }


        function getDisplayNextSongIndex(
            segment
        ) {

            const current =
                getDisplaySongIndex(
                    segment
                );

            return (
                (
                    current + 1
                ) %
                songs.length
            );
        }


        /*
         * UPDATE RADIO UI
         */

        function updateRadioUI(
            segment
        ) {

            if (
                !songs.length
            ) {
                return;
            }


            const current =
                getDisplaySongIndex(
                    segment
                );

            const next =
                getDisplayNextSongIndex(
                    segment
                );


            songNameElement.textContent =
                songs[current].name;

            upNextElement.textContent =
                songs[next].name;
        }


        /*
         * MEDIA SESSION
         */

        function updateLiveMediaSession() {

            if (
                !("mediaSession" in navigator)
            ) {
                return;
            }


            if (
                !metadataLoaded ||
                !songs.length
            ) {
                return;
            }


            const segment =
                findLiveSegment();


            const title =
                segment.type ===
                    "speech"
                    ? "Christmas Radio"
                    : songs[
                        segment.index
                    ].name;


            try {

                navigator.mediaSession.metadata =
                    new MediaMetadata({

                        title:
                            title,

                        artist:
                            "Christmas Countdown Radio",

                        album:
                            "Christmas Countdown",

                        artwork: [
                            {
                                src:
                                    "./favicon.ico",

                                sizes:
                                    "512x512",

                                type:
                                    "image/x-icon"
                            }
                        ]
                    });

            } catch {}


            try {

                const audio =
                    segment.type ===
                        "speech"
                        ? speechAudio
                        : musicAudio;


                const duration =
                    audio.duration;

                const position =
                    audio.currentTime;


                if (
                    Number.isFinite(
                        duration
                    ) &&
                    duration > 0 &&
                    Number.isFinite(
                        position
                    ) &&
                    position >= 0 &&
                    position <= duration
                ) {

                    navigator.mediaSession
                        .setPositionState({

                            duration,

                            playbackRate:
                                audio.playbackRate ||
                                1,

                            position
                        });
                }

            } catch {}
        }


        /*
         * MEDIA SESSION SETUP
         */

        function setupMediaSession() {

            if (
                !("mediaSession" in navigator)
            ) {
                return;
            }


            try {

                navigator.mediaSession
                    .setActionHandler(
                        "play",
                        () =>
                            resumeLive()
                    );

            } catch {}


            try {

                navigator.mediaSession
                    .setActionHandler(
                        "pause",
                        pauseRadio
                    );

            } catch {}


            [
                "previoustrack",
                "nexttrack",
                "seekbackward",
                "seekforward"
            ].forEach(
                action => {

                    try {

                        navigator.mediaSession
                            .setActionHandler(
                                action,
                                () => {}
                            );

                    } catch {}
                }
            );


            try {

                navigator.mediaSession
                    .setActionHandler(
                        "seekto",
                        () => {}
                    );

            } catch {}
        }

        setupMediaSession();


        /*
         * LOAD AUDIO
         */

        async function loadAudio(
            audio,
            src,
            offset
        ) {

            const absoluteURL =
                new URL(
                    src,
                    location.href
                ).href;


            if (
                audio.src !==
                absoluteURL
            ) {

                audio.src =
                    src;

                audio.load();


                await new Promise(
                    (
                        resolve,
                        reject
                    ) => {

                        const onMetadata =
                            () => {

                                cleanup();

                                resolve();
                            };


                        const onError =
                            () => {

                                cleanup();

                                reject(
                                    new Error(
                                        "Could not load audio"
                                    )
                                );
                            };


                        const cleanup =
                            () => {

                                audio.removeEventListener(
                                    "loadedmetadata",
                                    onMetadata
                                );

                                audio.removeEventListener(
                                    "error",
                                    onError
                                );
                            };


                        audio.addEventListener(
                            "loadedmetadata",
                            onMetadata,
                            {
                                once:
                                    true
                            }
                        );


                        audio.addEventListener(
                            "error",
                            onError,
                            {
                                once:
                                    true
                            }
                        );
                    }
                );
            }


            if (
                Number.isFinite(
                    offset
                ) &&
                offset >= 0 &&
                Number.isFinite(
                    audio.duration
                ) &&
                offset <
                    audio.duration
            ) {

                audio.currentTime =
                    offset;
            }
        }


        /*
         * LOAD SONG
         */

        async function loadSong(
            index,
            offset
        ) {

            const song =
                songs[index];


            if (
                !song ||
                !song.file
            ) {

                throw new Error(
                    `Song ${index + 1} has no file in durations.json.`
                );
            }


            const songURL =
                SONG_FOLDER +
                encodeURIComponent(
                    song.file
                );


            await loadAudio(
                musicAudio,
                songURL,
                offset
            );
        }


        /*
         * LOAD SPEECH
         */

        async function loadSpeech(
            offset
        ) {

            await loadAudio(
                speechAudio,
                SPEECH_SRC,
                offset
            );
        }


        /*
         * START LIVE RADIO
         */

        async function playLive() {

            if (
                isChangingTrack
            ) {
                return;
            }


            isChangingTrack =
                true;


            try {

                await loadDurations();


                const segment =
                    findLiveSegment();


                currentSongIndex =
                    getDisplaySongIndex(
                        segment
                    );


                currentSegmentType =
                    segment.type;


                updateRadioUI(
                    segment
                );


                if (
                    segment.type ===
                    "speech"
                ) {

                    musicAudio.pause();


                    await loadSpeech(
                        segment.offset
                    );


                    await speechAudio.play();

                } else {

                    speechAudio.pause();


                    await loadSong(
                        segment.index,
                        segment.offset
                    );


                    await musicAudio.play();
                }


                radioPlaying =
                    true;


                updatePlayButton();

                updateLiveMediaSession();


                try {

                    navigator.mediaSession
                        .playbackState =
                        "playing";

                } catch {}

            } catch (
                error
            ) {

                console.error(
                    "Could not start live radio:",
                    error
                );


                radioPlaying =
                    false;


                updatePlayButton();


                songNameElement.textContent =
                    "Could not start radio";


                upNextElement.textContent =
                    "Please try again";

            } finally {

                isChangingTrack =
                    false;
            }
        }


        /*
         * PAUSE
         */

        function pauseRadio() {

            musicAudio.pause();

            speechAudio.pause();

            radioPlaying =
                false;


            updatePlayButton();


            try {

                navigator.mediaSession
                    .playbackState =
                    "paused";

            } catch {}
        }


        /*
         * RESUME
         */

        async function resumeLive() {

            musicAudio.pause();

            speechAudio.pause();

            await playLive();
        }


        /*
         * BUTTON
         */

        function updatePlayButton() {

            if (
                radioPlaying
            ) {

                playButton.textContent =
                    "⏸ Pause";

                playButton.classList.remove(
                    "paused"
                );

            } else {

                playButton.textContent =
                    "▶️ Play";

                playButton.classList.add(
                    "paused"
                );
            }
        }


        playButton.addEventListener(
            "click",
            async () => {

                if (
                    radioPlaying
                ) {

                    pauseRadio();

                } else {

                    await resumeLive();
                }
            }
        );


        /*
         * TRACK END
         */

        musicAudio.addEventListener(
            "ended",
            async () => {

                if (
                    radioPlaying
                ) {

                    await playLive();
                }
            }
        );


        speechAudio.addEventListener(
            "ended",
            async () => {

                if (
                    radioPlaying
                ) {

                    await playLive();
                }
            }
        );


        /*
         * ERROR RECOVERY
         */

        function retryLive() {

            if (
                !radioPlaying
            ) {
                return;
            }


            setTimeout(
                () => {

                    if (
                        radioPlaying
                    ) {

                        playLive();
                    }

                },
                1000
            );
        }


        musicAudio.addEventListener(
            "error",
            retryLive
        );


        speechAudio.addEventListener(
            "error",
            () => {

                console.error(
                    "Speech audio error."
                );

                retryLive();
            }
        );


        /*
         * PERIODIC LIVE SYNCHRONIZATION
         */

        async function syncRadio() {

            if (
                !radioPlaying
            ) {
                return;
            }


            try {

                const live =
                    findLiveSegment();


                const displayIndex =
                    getDisplaySongIndex(
                        live
                    );


                if (
                    live.type !==
                        currentSegmentType ||
                    displayIndex !==
                        currentSongIndex
                ) {

                    await playLive();

                    return;
                }


                const audio =
                    live.type ===
                        "speech"
                        ? speechAudio
                        : musicAudio;


                const drift =
                    Math.abs(
                        audio.currentTime -
                        live.offset
                    );


                if (
                    drift > 3
                ) {

                    audio.currentTime =
                        live.offset;
                }


                updateRadioUI(
                    live
                );

                updateLiveMediaSession();

            } catch (
                error
            ) {

                console.warn(
                    "Periodic sync failed:",
                    error
                );
            }
        }


        setInterval(
            syncRadio,
            5000
        );


        /*
         * MEDIA SESSION POSITION
         */

        setInterval(
            () => {

                if (
                    radioPlaying
                ) {

                    updateLiveMediaSession();
                }

            },
            3000
        );


        /*
         * VISIBILITY SYNCHRONIZATION
         */

        document.addEventListener(
            "visibilitychange",
            async () => {

                if (
                    document.visibilityState !==
                        "visible" ||
                    !radioPlaying
                ) {

                    return;
                }


                try {

                    const live =
                        findLiveSegment();


                    const displayIndex =
                        getDisplaySongIndex(
                            live
                        );


                    if (
                        live.type !==
                            currentSegmentType ||
                        displayIndex !==
                            currentSongIndex
                    ) {

                        await playLive();

                        return;
                    }


                    const audio =
                        live.type ===
                            "speech"
                            ? speechAudio
                            : musicAudio;


                    const drift =
                        Math.abs(
                            audio.currentTime -
                            live.offset
                        );


                    if (
                        drift > 3
                    ) {

                        await playLive();

                    } else {

                        updateRadioUI(
                            live
                        );

                        updateLiveMediaSession();
                    }

                } catch (
                    error
                ) {

                    console.warn(
                        "Visibility sync failed:",
                        error
                    );
                }
            }
        );


        /*
         * BLOCK TRACK-SKIPPING KEYS
         */

        document.addEventListener(
            "keydown",
            event => {

                const blocked = [
                    "ArrowLeft",
                    "ArrowRight",
                    "Home",
                    "End",
                    "MediaTrackNext",
                    "MediaTrackPrevious",
                    "MediaFastForward",
                    "MediaRewind"
                ];


                if (
                    blocked.includes(
                        event.key
                    )
                ) {

                    event.preventDefault();
                }
            }
        );


        /*
         * BLOCK CONTEXT MENU
         */

        document.addEventListener(
            "contextmenu",
            event =>
                event.preventDefault()
        );


        /*
         * INITIAL UI
         */

        updatePlayButton();


        songNameElement.textContent =
            "Christmas Radio Ready";


        upNextElement.textContent =
            "Loading...";


        /*
         * LOAD MANIFEST ON PAGE LOAD
         */

        loadDurations()
            .then(
                () => {

                    const live =
                        findLiveSegment();


                    currentSongIndex =
                        getDisplaySongIndex(
                            live
                        );


                    currentSegmentType =
                        live.type;


                    updateRadioUI(
                        live
                    );


                    updateLiveMediaSession();

                }
            )
            .catch(
                error => {

                    console.error(
                        "Radio metadata initialization failed:",
                        error
                    );


                    songNameElement.textContent =
                        "Radio unavailable";


                    upNextElement.textContent =
                        error.message;
                }
            );


        /*
         * CLEANUP
         */

        window.addEventListener(
            "beforeunload",
            () => {

                musicAudio.pause();

                speechAudio.pause();
            }
        );

    </script>

</body>

</html>
