        /* =========================================================
           DURATION MANIFEST
        ========================================================= */

        async function loadDurationManifest() {

            try {

                const response =
                    await fetch(
                        DURATION_MANIFEST,
                        {
                            cache:
                                "no-store"
                        }
                    );


                if (
                    !response.ok
                ) {

                    throw new Error(
                        "Duration manifest unavailable"
                    );
                }


                const data =
                    await response.json();


                if (
                    !data ||
                    !Array.isArray(
                        data.songs
                    )
                ) {

                    throw new Error(
                        "Invalid duration manifest"
                    );
                }


                return data.songs;

            } catch (error) {

                console.warn(
                    "Could not load durations.json. Falling back to MP3 metadata.",
                    error
                );


                return null;
            }
        }


        /* =========================================================
           FALLBACK METADATA READER
        ========================================================= */

        function getAudioDuration(
            url
        ) {

            return new Promise(
                (
                    resolve,
                    reject
                ) => {

                    const audio =
                        document.createElement(
                            "audio"
                        );


                    let finished =
                        false;


                    const cleanup =
                        () => {

                            audio.removeAttribute(
                                "src"
                            );

                            audio.load();
                        };


                    const timeout =
                        setTimeout(
                            () => {

                                if (
                                    finished
                                ) {
                                    return;
                                }


                                finished =
                                    true;


                                cleanup();


                                reject(
                                    new Error(
                                        "Timed out reading audio duration"
                                    )
                                );

                            },
                            15000
                        );


                    audio.preload =
                        "metadata";


                    audio.addEventListener(
                        "loadedmetadata",
                        () => {

                            if (
                                finished
                            ) {
                                return;
                            }


                            const duration =
                                audio.duration;


                            if (
                                Number.isFinite(
                                    duration
                                ) &&
                                duration > 0
                            ) {

                                finished =
                                    true;


                                clearTimeout(
                                    timeout
                                );


                                cleanup();


                                resolve(
                                    duration
                                );

                            } else {

                                finished =
                                    true;


                                clearTimeout(
                                    timeout
                                );


                                cleanup();


                                reject(
                                    new Error(
                                        "Invalid audio duration"
                                    )
                                );
                            }

                        },
                        {
                            once:
                                true
                        }
                    );


                    audio.addEventListener(
                        "error",
                        () => {

                            if (
                                finished
                            ) {
                                return;
                            }


                            finished =
                                true;


                            clearTimeout(
                                timeout
                            );


                            cleanup();


                            reject(
                                new Error(
                                    "Could not load audio"
                                )
                            );

                        },
                        {
                            once:
                                true
                        }
                    );


                    audio.src =
                        url;
                }
            );
        }


        /* =========================================================
           LOAD DURATIONS
        ========================================================= */

        async function loadDurations() {

            if (
                metadataLoaded
            ) {

                return;
            }


            if (
                metadataLoadingPromise
            ) {

                return metadataLoadingPromise;
            }


            metadataLoadingPromise =
                (async () => {

                    const manifest =
                        await loadDurationManifest();


                    durations =
                        new Array(
                            SONG_NAMES.length
                        );


                    /*
                        First use durations.json.
                    */

                    if (
                        manifest
                    ) {

                        for (
                            let i = 0;
                            i < SONG_NAMES.length;
                            i++
                        ) {

                            const songName =
                                SONG_NAMES[i];


                            const entry =
                                manifest.find(
                                    item =>
                                        item &&
                                        item.name ===
                                            songName
                                );


                            if (
                                entry &&
                                Number.isFinite(
                                    Number(
                                        entry.duration
                                    )
                                ) &&
                                Number(
                                    entry.duration
                                ) > 0
                            ) {

                                durations[i] =
                                    Number(
                                        entry.duration
                                    );
                            }
                        }
                    }


                    /*
                        Read MP3 metadata only when the
                        manifest does not contain a value.
                    */

                    for (
                        let i = 0;
                        i < SONG_NAMES.length;
                        i++
                    ) {

                        if (
                            Number.isFinite(
                                durations[i]
                            ) &&
                            durations[i] > 0
                        ) {

                            continue;
                        }


                        try {

                            durations[i] =
                                await getAudioDuration(
                                    getSongURL(
                                        SONG_NAMES[i]
                                    )
                                );

                        } catch (
                            error
                        ) {

                            console.error(
                                `Could not get duration for ${SONG_NAMES[i]}`,
                                error
                            );


                            durations[i] =
                                0;
                        }
                    }


                    totalPlaylistDuration =
                        durations.reduce(
                            (
                                total,
                                duration
                            ) =>
                                total +
                                (
                                    Number.isFinite(
                                        duration
                                    )
                                        ? duration
                                        : 0
                                ),
                            0
                        );


                    if (
                        totalPlaylistDuration <=
                        0
                    ) {

                        throw new Error(
                            "No valid song durations were found."
                        );
                    }


                    metadataLoaded =
                        true;


                    console.log(
                        "Radio playlist duration:",
                        formatTime(
                            totalPlaylistDuration
                        )
                    );

                })()
                .catch(
                    error => {

                        metadataLoadingPromise =
                            null;

                        throw error;
                    }
                );


            return metadataLoadingPromise;
        }


        /* =========================================================
           FIND LIVE SONG
        ========================================================= */

        function findCurrentSong() {

            if (
                !metadataLoaded ||
                totalPlaylistDuration <= 0
            ) {

                return {
                    index:
                        0,

                    offset:
                        0
                };
            }


            const now =
                Date.now();


            let elapsed =
                (
                    now -
                    RADIO_START
                ) / 1000;


            /*
                Loop the entire playlist forever.
            */

            elapsed =
                (
                    (
                        elapsed %
                        totalPlaylistDuration
                    ) +
                    totalPlaylistDuration
                ) %
                totalPlaylistDuration;


            let accumulated =
                0;


            for (
                let i = 0;
                i < durations.length;
                i++
            ) {

                const duration =
                    durations[i] ||
                    0;


                if (
                    elapsed <
                    accumulated +
                    duration
                ) {

                    return {
                        index:
                            i,

                        offset:
                            elapsed -
                            accumulated
                    };
                }


                accumulated +=
                    duration;
            }


            return {
                index:
                    0,

                offset:
                    0
            };
        }


        /* =========================================================
           DISPLAY CURRENT SONG
        ========================================================= */

        function updateSongDisplay(
            index
        ) {

            if (
                index >= 0 &&
                index <
                    SONG_NAMES.length
            ) {

                songNameElement.textContent =
                    SONG_NAMES[index];
            }
        }


        /* =========================================================
           PLAY CURRENT LIVE POSITION
        ========================================================= */

        async function playLive() {

            /*
                Increment the token so an older asynchronous
                load cannot take control of the player after
                a newer load has started.
            */

            const token =
                ++radioLoadToken;


            /*
                If another playLive call is already running,
                wait for it to finish before continuing.
            */

            if (
                radioPlayPromise
            ) {

                try {
                    await radioPlayPromise;
                } catch {}
            }


            const operation =
                (async () => {

                    try {

                        await loadDurations();


                        if (
                            token !==
                            radioLoadToken
                        ) {

                            return;
                        }


                        /*
                            Determine the actual live position
                            immediately before loading.
                        */

                        let live =
                            findCurrentSong();


                        currentSongIndex =
                            live.index;


                        currentSongOffset =
                            live.offset;


                        updateSongDisplay(
                            currentSongIndex
                        );


                        updateLiveMediaSession();


                        /*
                            Load through Managed Media Source
                            when possible.
                        */

                        let playbackMode =
                            await loadCurrentSong(
                                SONG_NAMES[
                                    currentSongIndex
                                ],
                                currentSongOffset
                            );


                        if (
                            token !==
                            radioLoadToken
                        ) {

                            return;
                        }


                        /*
                            Loading takes time.

                            Recalculate the live position once
                            more before starting playback.
                        */

                        live =
                            findCurrentSong();


                        if (
                            live.index !==
                            currentSongIndex
                        ) {

                            currentSongIndex =
                                live.index;

                            currentSongOffset =
                                live.offset;


                            updateSongDisplay(
                                currentSongIndex
                            );


                            playbackMode =
                                await loadCurrentSong(
                                    SONG_NAMES[
                                        currentSongIndex
                                    ],
                                    currentSongOffset
                                );

                        } else {

                            currentSongOffset =
                                live.offset;


                            /*
                                The MSE source begins at zero
                                for the current song, so seeking
                                again here is safe.
                            */

                            try {

                                musicAudio.currentTime =
                                    Math.max(
                                        0,
                                        live.offset
                                    );

                            } catch {}
                        }


                        if (
                            token !==
                            radioLoadToken
                        ) {

                            return;
                        }


                        await musicAudio.play();


                        if (
                            token !==
                            radioLoadToken
                        ) {

                            return;
                        }


                        radioPlaying =
                            true;


                        updatePlayButton();


                        lastSyncTime =
                            Date.now();


                        updateLiveMediaSession();


                        if (
                            "mediaSession" in
                            navigator
                        ) {

                            try {

                                navigator.mediaSession.playbackState =
                                    "playing";

                            } catch {}
                        }


                        console.log(
                            "Radio playing:",
                            SONG_NAMES[
                                currentSongIndex
                            ],
                            "| offset:",
                            currentSongOffset,
                            "| mode:",
                            playbackMode
                        );

                    } catch (
                        error
                    ) {

                        /*
                            Ignore an old operation that was
                            deliberately superseded.
                        */

                        if (
                            token !==
                            radioLoadToken
                        ) {

                            return;
                        }


                        console.error(
                            "Could not start live radio:",
                            error
                        );


                        radioPlaying =
                            false;


                        updatePlayButton();


                        songNameElement.textContent =
                            "Tap Start Live Radio to begin";
                    }

                })();


            radioPlayPromise =
                operation;


            try {

                await operation;

            } finally {

                if (
                    radioPlayPromise ===
                    operation
                ) {

                    radioPlayPromise =
                        null;
                }
            }
        }


        /* =========================================================
           PAUSE
        ========================================================= */

        function pauseRadio() {

            /*
                Invalidate any in-progress asynchronous load.
            */

            radioLoadToken++;


            musicAudio.pause();

            speechAudio.pause();


            radioPlaying =
                false;


            speechStarted =
                false;


            updatePlayButton();


            if (
                "mediaSession" in
                navigator
            ) {

                try {

                    navigator.mediaSession.playbackState =
                        "paused";

                } catch {}
            }
        }


        /* =========================================================
           RESUME LIVE
        ========================================================= */

        async function resumeLive() {

            /*
                Resume always jumps to the actual current
                live position instead of continuing from the
                old song position.
            */

            speechAudio.pause();

            speechStarted =
                false;


            await playLive();
        }


        /* =========================================================
           BUTTON
        ========================================================= */

        function updatePlayButton() {

            if (
                radioPlaying
            ) {

                playButton.textContent =
                    "⏸ Pause Radio";


                playButton.classList.remove(
                    "paused"
                );

            } else {

                playButton.textContent =
                    "▶️ Resume Live Radio";


                playButton.classList.add(
                    "paused"
                );
            }
        }


        playButton.addEventListener(
            "click",
            async () => {

                if (
                    radioPlaying
                ) {

                    pauseRadio();

                } else {

                    await resumeLive();
                }
            }
        );


        /* =========================================================
           AUTOMATIC NEXT SONG
        ========================================================= */

        musicAudio.addEventListener(
            "ended",
            async () => {

                if (
                    !radioPlaying
                ) {

                    return;
                }


                /*
                    Never simply advance one track.

                    Recalculate the actual live position so
                    the radio remains synchronized.
                */

                await playLive();
            }
        );


        /* =========================================================
           AUDIO ERROR RECOVERY
        ========================================================= */

        musicAudio.addEventListener(
            "error",
            () => {

                if (
                    !radioPlaying
                ) {

                    return;
                }


                console.warn(
                    "Music playback error. Resynchronizing..."
                );


                setTimeout(
                    async () => {

                        if (
                            radioPlaying
                        ) {

                            await playLive();
                        }

                    },
                    1000
                );
            }
        );


        /* =========================================================
           MEDIA EVENTS
        ========================================================= */

        musicAudio.addEventListener(
            "play",
            () => {

                if (
                    !radioPlaying
                ) {

                    radioPlaying =
                        true;

                    updatePlayButton();
                }


                if (
                    "mediaSession" in
                    navigator
                ) {

                    try {

                        navigator.mediaSession.playbackState =
                            "playing";

                    } catch {}
                }
            }
        );


        musicAudio.addEventListener(
            "pause",
            () => {

                /*
                    Do not force radioPlaying=false here during
                    an internal source replacement.

                    The application controls the actual radio
                    state.
                */

                if (
                    "mediaSession" in
                    navigator &&
                    !radioPlaying
                ) {

                    try {

                        navigator.mediaSession.playbackState =
                            "paused";

                    } catch {}
                }
            }
        );


        /* =========================================================
           VISIBILITY / RETURN TO PAGE
        ========================================================= */

        document.addEventListener(
            "visibilitychange",
            async () => {

                if (
                    document.visibilityState !==
                    "visible"
                ) {

                    return;
                }


                if (
                    !radioPlaying
                ) {

                    return;
                }


                const now =
                    Date.now();


                if (
                    now -
                    lastSyncTime <
                    3000
                ) {

                    return;
                }


                lastSyncTime =
                    now;


                try {

                    const live =
                        findCurrentSong();


                    /*
                        Different song means we must rebuild
                        the current source.
                    */

                    if (
                        live.index !==
                        currentSongIndex
                    ) {

                        await playLive();

                        return;
                    }


                    const expected =
                        live.offset;


                    const actual =
                        musicAudio.currentTime;


                    if (
                        Math.abs(
                            expected -
                            actual
                        ) > 3
                    ) {

                        await playLive();

                        return;
                    }


                    /*
                        Refresh OS-level metadata after returning
                        from background/Lock Screen.
                    */

                    updateLiveMediaSession();

                } catch (
                    error
                ) {

                    console.warn(
                        "Resync failed:",
                        error
                    );
                }
            }
        );


        /* =========================================================
           PERIODIC LIVE SYNC
        ========================================================= */

        setInterval(
            async () => {

                if (
                    !radioPlaying
                ) {

                    return;
                }


                try {

                    const live =
                        findCurrentSong();


                    /*
                        Song changed according to the master
                        clock.
                    */

                    if (
                        live.index !==
                        currentSongIndex
                    ) {

                        await playLive();

                        return;
                    }


                    const actual =
                        musicAudio.currentTime;


                    const drift =
                        Math.abs(
                            actual -
                            live.offset
                        );


                    /*
                        A small drift can simply be corrected
                        with a seek.

                        A large drift rebuilds the live source.
                    */

                    if (
                        drift > 15
                    ) {

                        await playLive();

                        return;
                    }


                    if (
                        drift > 5
                    ) {

                        try {

                            musicAudio.currentTime =
                                live.offset;

                        } catch {}
                    }


                    lastSyncTime =
                        Date.now();


                    updateLiveMediaSession();

                } catch (
                    error
                ) {

                    console.warn(
                        "Periodic sync failed:",
                        error
                    );
                }

            },
            5000
        );


        /* =========================================================
           PREVENT SEEKING THROUGH KEYBOARD
        ========================================================= */

        document.addEventListener(
            "keydown",
            event => {

                const blockedKeys = [
                    "ArrowLeft",
                    "ArrowRight",
                    "Home",
                    "End",
                    "MediaTrackNext",
                    "MediaTrackPrevious"
                ];


                if (
                    blockedKeys.includes(
                        event.key
                    )
                ) {

                    event.preventDefault();
                }
            }
        );


        /* =========================================================
           PREVENT CONTEXT MENU
        ========================================================= */

        document.addEventListener(
            "contextmenu",
            event => {

                event.preventDefault();
            }
        );


        /* =========================================================
           PREVENT MANUAL SEEK
        ========================================================= */

        /*
            If the browser exposes a media timeline, force the
            playback position back to the live position whenever
            the user attempts to seek away from it.
        */

        musicAudio.addEventListener(
            "seeking",
            () => {

                if (
                    !radioPlaying ||
                    !metadataLoaded
                ) {

                    return;
                }


                const live =
                    findCurrentSong();


                /*
                    Do not fight a seek during the initial load.
                */

                if (
                    Math.abs(
                        musicAudio.currentTime -
                        live.offset
                    ) > 8
                ) {

                    try {

                        musicAudio.currentTime =
                            live.offset;

                    } catch {}
                }
            }
        );


        /* =========================================================
           INITIAL STATE
        ========================================================= */

        updatePlayButton();


        songNameElement.textContent =
            "Christmas Radio Ready";


        /*
            Load durations in the background.
        */

        loadDurations()
            .then(
                () => {

                    const live =
                        findCurrentSong();


                    updateSongDisplay(
                        live.index
                    );


                    currentSongIndex =
                        live.index;


                    currentSongOffset =
                        live.offset;


                    updateLiveMediaSession();
                }
            )
            .catch(
                error => {

                    console.error(
                        "Radio metadata initialization failed:",
                        error
                    );
                }
            );


        /* =========================================================
           BEFORE UNLOAD
        ========================================================= */

        window.addEventListener(
            "beforeunload",
            () => {

                radioLoadToken++;


                musicAudio.pause();

                speechAudio.pause();


                try {

                    if (
                        musicAudio.srcObject
                    ) {

                        musicAudio.srcObject =
                            null;
                    }

                } catch {}


                destroyMediaSource();
            }
        );


        /* =========================================================
           DEBUG INFORMATION
        ========================================================= */

        console.log(
            "Christmas Radio initialized."
        );


        console.log(
            "Managed Media Source available:",
            typeof window.ManagedMediaSource ===
                "function"
        );


        console.log(
            "MediaSource available:",
            typeof window.MediaSource ===
                "function"
        );


        console.log(
            "Supported MSE codec:",
            getSupportedMSECodec()
        );

    </script>

</body>

</html>
