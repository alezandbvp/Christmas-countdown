<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

    <title>Christmas Countdown • Live Radio</title>

    <link rel="icon" href="favicon.ico">

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        html {
            overflow-x: hidden;
            background: #050713;
        }

        body {
            min-height: 100dvh;
            min-height: 100svh;
            overflow-x: hidden;
            overflow-y: auto;
            font-family: "Segoe UI", Arial, sans-serif;
            color: white;
            background: #050713;
            display: flex;
            justify-content: center;
            align-items: center;
            padding:
                max(20px, env(safe-area-inset-top))
                max(20px, env(safe-area-inset-right))
                max(20px, env(safe-area-inset-bottom))
                max(20px, env(safe-area-inset-left));
            position: relative;
            isolation: isolate;
        }

        /* =========================
           BACKGROUND
        ========================= */

        #bg {
            position: fixed;
            inset: 0;
            z-index: -5;
            background:
                linear-gradient(
                    rgba(2, 5, 20, .48),
                    rgba(2, 5, 20, .68)
                ),
                url("christmas-background.jpg") center / cover no-repeat;
            transform: scale(1.03);
            transition: filter 1s ease, transform 1s ease;
        }

        #bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(
                    circle at 50% 40%,
                    rgba(255, 255, 255, .08),
                    transparent 45%
                ),
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, .05),
                    rgba(0, 0, 0, .38)
                );
        }

        /* =========================
           SNOW
        ========================= */

        .snow-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .flake {
            position: absolute;
            top: -30px;
            color: white;
            user-select: none;
            pointer-events: none;
            animation-name: snowFall;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            opacity: .8;
            text-shadow: 0 0 8px rgba(255, 255, 255, .7);
        }

        @keyframes snowFall {
            0% {
                transform: translate3d(0, -40px, 0) rotate(0deg);
            }

            100% {
                transform: translate3d(var(--drift), 110vh, 0) rotate(360deg);
            }
        }

        /* =========================
           MAIN CARD
        ========================= */

        #container {
            width: min(100%, 760px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: clamp(8px, 2vw, 20px);
        }

        .card {
            width: 100%;
            padding: clamp(28px, 5vw, 58px) clamp(20px, 6vw, 60px);
            border: 1px solid rgba(255, 255, 255, .18);
            border-radius: clamp(22px, 4vw, 38px);
            background: rgba(8, 13, 35, .54);
            backdrop-filter: blur(18px) saturate(130%);
            -webkit-backdrop-filter: blur(18px) saturate(130%);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, .45),
                inset 0 1px 0 rgba(255, 255, 255, .08);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(255, 255, 255, .12),
                    transparent 45%
                );
        }

        /* =========================
           LIVE LABEL
        ========================= */

        .live {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 13px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .12);
            font-size: clamp(11px, 2vw, 13px);
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            margin-bottom: clamp(16px, 3vw, 25px);
        }

        .live::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff3b3b;
            box-shadow: 0 0 12px #ff3b3b;
            animation: livePulse 1.4s ease-in-out infinite;
        }

        @keyframes livePulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(.65);
                opacity: .55;
            }
        }

        /* =========================
           TITLE
        ========================= */

        #title,
        #subtitle {
            position: relative;
            margin: 0;
            line-height: .92;
            letter-spacing: -.045em;
            text-wrap: balance;
        }

        #title {
            font-size: clamp(48px, 10vw, 100px);
            font-weight: 800;
            text-shadow:
                0 0 30px rgba(255, 255, 255, .16),
                0 8px 30px rgba(0, 0, 0, .3);
        }

        #subtitle {
            margin-top: clamp(3px, 1vw, 8px);
            font-size: clamp(34px, 7vw, 72px);
            font-weight: 700;
            opacity: .88;
        }

        /* =========================
           COUNTDOWN
        ========================= */

        #countdown {
            position: relative;
            margin-top: clamp(22px, 4vw, 38px);
            font-size: clamp(25px, 5vw, 48px);
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: .02em;
            text-shadow: 0 5px 25px rgba(0, 0, 0, .4);
            min-height: 1.2em;
        }

        /* =========================
           SONG
        ========================= */

        .song-wrapper {
            position: relative;
            margin-top: clamp(22px, 4vw, 35px);
            padding: clamp(14px, 3vw, 20px);
            border-radius: 20px;
            background: rgba(255, 255, 255, .055);
            border: 1px solid rgba(255, 255, 255, .1);
        }

        .song-label {
            font-size: clamp(10px, 1.8vw, 12px);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .16em;
            opacity: .6;
            margin-bottom: 7px;
        }

        #songName {
            font-size: clamp(15px, 3vw, 21px);
            line-height: 1.35;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        /* =========================
           PLAY BUTTON
        ========================= */

        #playButton {
            position: relative;
            width: 100%;
            min-height: 54px;
            margin-top: clamp(18px, 3vw, 26px);
            padding: 14px 20px;
            border: 0;
            border-radius: 17px;
            background: rgba(255, 255, 255, .13);
            color: white;
            font: inherit;
            font-size: clamp(14px, 2.5vw, 17px);
            font-weight: 700;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, .16);
            box-shadow:
                0 10px 30px rgba(0, 0, 0, .2),
                inset 0 1px 0 rgba(255, 255, 255, .08);
            transition:
                transform .18s ease,
                background .18s ease,
                box-shadow .18s ease;
            touch-action: manipulation;
        }

        #playButton:hover {
            background: rgba(255, 255, 255, .19);
            transform: translateY(-2px);
            box-shadow:
                0 15px 35px rgba(0, 0, 0, .28),
                inset 0 1px 0 rgba(255, 255, 255, .1);
        }

        #playButton:active {
            transform: scale(.98);
        }

        #playButton.playing {
            background: rgba(255, 255, 255, .16);
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            position: relative;
            margin-top: clamp(20px, 4vw, 32px);
            font-size: clamp(11px, 2vw, 14px);
            opacity: .65;
            letter-spacing: .05em;
        }

        /* =========================
           CORNER STARS
        ========================= */

        .star {
            position: absolute;
            pointer-events: none;
            opacity: .55;
            font-size: clamp(18px, 3vw, 28px);
            animation: starFloat 4s ease-in-out infinite;
        }

        .star.one {
            top: 18px;
            left: 22px;
        }

        .star.two {
            top: 28px;
            right: 25px;
            animation-delay: 1.4s;
        }

        .star.three {
            bottom: 28px;
            left: 28px;
            animation-delay: 2.3s;
        }

        .star.four {
            bottom: 20px;
            right: 30px;
            animation-delay: .7s;
        }

        @keyframes starFloat {
            0%,
            100% {
                transform: translateY(0) rotate(0deg);
                opacity: .45;
            }

            50% {
                transform: translateY(-7px) rotate(8deg);
                opacity: .75;
            }
        }

        /* =========================
           TABLETS
        ========================= */

        @media (min-width: 600px) and (max-width: 1100px) {
            #container {
                width: min(92vw, 760px);
            }

            .card {
                padding-left: clamp(35px, 7vw, 60px);
                padding-right: clamp(35px, 7vw, 60px);
            }
        }

        /* =========================
           SMALL PHONES
        ========================= */

        @media (max-width: 430px) {
            body {
                padding:
                    max(12px, env(safe-area-inset-top))
                    max(12px, env(safe-area-inset-right))
                    max(12px, env(safe-area-inset-bottom))
                    max(12px, env(safe-area-inset-left));
            }

            #container {
                padding: 5px;
            }

            .card {
                padding: 25px 17px;
                border-radius: 24px;
            }

            .live {
                margin-bottom: 16px;
            }

            .song-wrapper {
                border-radius: 17px;
            }

            #playButton {
                min-height: 56px;
            }

            .star.one {
                top: 12px;
                left: 14px;
            }

            .star.two {
                top: 15px;
                right: 16px;
            }

            .star.three {
                bottom: 18px;
                left: 16px;
            }

            .star.four {
                bottom: 14px;
                right: 17px;
            }
        }

        /* =========================
           VERY SHORT SCREENS
        ========================= */

        @media (max-height: 650px) and (orientation: portrait) {
            body {
                align-items: flex-start;
                padding-top: max(12px, env(safe-area-inset-top));
                padding-bottom: max(12px, env(safe-area-inset-bottom));
            }

            #container {
                margin: auto 0;
            }

            .card {
                padding-top: 22px;
                padding-bottom: 22px;
            }

            .live {
                margin-bottom: 12px;
            }

            #countdown {
                margin-top: 16px;
            }

            .song-wrapper {
                margin-top: 16px;
            }

            footer {
                margin-top: 17px;
            }
        }

        /* =========================
           LANDSCAPE PHONES
        ========================= */

        @media (orientation: landscape) and (max-height: 600px) {
            body {
                align-items: center;
                padding:
                    max(10px, env(safe-area-inset-top))
                    max(18px, env(safe-area-inset-right))
                    max(10px, env(safe-area-inset-bottom))
                    max(18px, env(safe-area-inset-left));
            }

            #container {
                width: min(900px, 96vw);
                padding: 4px;
            }

            .card {
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(230px, .7fr);
                grid-template-areas:
                    "header countdown"
                    "song song"
                    "button button"
                    "footer footer";
                column-gap: clamp(20px, 5vw, 50px);
                align-items: center;
                padding: 22px clamp(25px, 5vw, 50px);
            }

            .live {
                grid-area: header;
                justify-self: center;
                margin-bottom: 8px;
            }

            #title {
                grid-area: header;
                margin-top: 40px;
                font-size: clamp(38px, 8vw, 70px);
            }

            #subtitle {
                grid-area: header;
                margin-top: 4px;
                font-size: clamp(27px, 6vw, 52px);
            }

            #countdown {
                grid-area: countdown;
                margin-top: 0;
                font-size: clamp(22px, 4vw, 36px);
            }

            .song-wrapper {
                grid-area: song;
                margin-top: 15px;
            }

            #playButton {
                grid-area: button;
                margin-top: 14px;
            }

            footer {
                grid-area: footer;
                margin-top: 12px;
            }

            .star.one,
            .star.two {
                top: 10px;
            }

            .star.three,
            .star.four {
                bottom: 10px;
            }
        }

        /* =========================
           ULTRA-WIDE SCREENS
        ========================= */

        @media (min-width: 1400px) {
            #container {
                width: 820px;
            }
        }

        /* =========================
           REDUCED MOTION
        ========================= */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .001ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: .001ms !important;
            }
        }
    </style>
</head>

<body>

    <div id="bg"></div>

    <div id="snowFar" class="snow-layer"></div>
    <div id="snowMid" class="snow-layer"></div>

    <main id="container">
        <section class="card">

            <div class="star one">✦</div>
            <div class="star two">✧</div>
            <div class="star three">✦</div>
            <div class="star four">✧</div>

            <div class="live">Christmas Radio</div>

            <h1 id="title">Christmas</h1>
            <h1 id="subtitle">Countdown</h1>

            <div id="countdown"></div>

            <div class="song-wrapper">
                <div class="song-label">Now Playing</div>
                <div id="songName">Press Start Live Radio</div>
            </div>

            <button id="playButton">
                🎄 Start Live Radio
            </button>

            <footer>
                ❄️ Merry Christmas ❄️
            </footer>

        </section>
    </main>

    <div id="snowNear" class="snow-layer"></div>

    <audio id="radioAudio" preload="auto" playsinline></audio>

    <script>
        (() => {
            "use strict";

            /* ==========================================
               CONFIG
            ========================================== */

            const RADIO_START =
                new Date("Dec 1, 2025 00:00:00").getTime();

            const SONGS = [
                "All I Want For Christmas Is You",
                "Baby It's Cold Outside",
                "Blue Christmas",
                "Carol Of The Bells",
                "Christmas (Baby Please Come Home)",
                "Christmas Canon",
                "Deck The Halls",
                "Do You Want To Build A Snowman",
                "Feliz Navidad",
                "Frosty The Snowman",
                "God Rest Ye Merry Gentlemen",
                "Here Comes Santa Claus",
                "Holly Jolly Christmas",
                "I Want A Hippopotamus For Christmas",
                "It's Beginning To Look A Lot Like Christmas",
                "It's The Most Wonderful Time Of The Year",
                "Jingle Bell Rock",
                "Jingle Bells",
                "Last Christmas",
                "Let It Snow! Let It Snow!",
                "Little Drummer Boy",
                "Mistletoe",
                "O Christmas Tree",
                "Rockin Around The Christmas Tree",
                "Rudolph The Red-Nosed Reindeer",
                "Santa Baby",
                "Santa Claus Is Comin' To Town",
                "Silent Night",
                "Sleigh Ride",
                "The Christmas Song",
                "Up On The Housetop",
                "We Wish You A Merry Christmas",
                "White Christmas",
                "Winter Wonderland",
                "Wonderful Christmastime",
                "You're A Mean One, Mr. Grinch"
            ];

            const SONG_PATH =
                name =>
                    `songs/Music Now, Trap Music Now, Dance Music Now - ${name} (SPOTISAVER).mp3`;

            const SPEECH_SRC = "songs/speech.mp3";

            /* ==========================================
               DOM
            ========================================== */

            const playButton =
                document.getElementById("playButton");

            const songName =
                document.getElementById("songName");

            const countdown =
                document.getElementById("countdown");

            const title =
                document.getElementById("title");

            const subtitle =
                document.getElementById("subtitle");

            const bg =
                document.getElementById("bg");

            const radioAudio =
                document.getElementById("radioAudio");

            /* ==========================================
               STATE
            ========================================== */

            let audioContext = null;
            let analyser = null;
            let sourceNode = null;
            let gainNode = null;

            let currentIndex = 0;
            let currentStartTime = 0;

            let playing = false;
            let starting = false;

            let animationFrame = 0;

            const durationCache = new Map();
            const durationPromises = new Map();

            /* ==========================================
               URL HELPERS
            ========================================== */

            const getSongUrl = index =>
                SONG_PATH(SONGS[index]);

            /* ==========================================
               DURATION CACHE
            ========================================== */

            function getDuration(index) {
                if (durationCache.has(index)) {
                    return Promise.resolve(
                        durationCache.get(index)
                    );
                }

                if (durationPromises.has(index)) {
                    return durationPromises.get(index);
                }

                const promise = new Promise(resolve => {
                    const audio = new Audio();

                    audio.preload = "metadata";

                    const cleanup = () => {
                        audio.removeAttribute("src");
                        audio.load();
                    };

                    const finish = duration => {
                        const value =
                            Number.isFinite(duration) &&
                            duration > 0
                                ? duration
                                : 240;

                        durationCache.set(index, value);

                        cleanup();
                        resolve(value);
                    };

                    audio.addEventListener(
                        "loadedmetadata",
                        () => finish(audio.duration),
                        { once: true }
                    );

                    audio.addEventListener(
                        "error",
                        () => finish(240),
                        { once: true }
                    );

                    audio.src = getSongUrl(index);
                });

                durationPromises.set(index, promise);

                return promise;
            }

            /* ==========================================
               FIND CURRENT SONG
               
               We progressively get durations and cache
               them. This avoids blocking on every track
               before the radio can begin.
            ========================================== */

            async function findCurrentSong() {
                let elapsed =
                    Math.max(
                        0,
                        Date.now() - RADIO_START
                    ) / 1000;

                const durations = [];

                for (let i = 0; i < SONGS.length; i++) {
                    const duration =
                        await getDuration(i);

                    durations.push(duration);
                }

                const total =
                    durations.reduce(
                        (sum, value) =>
                            sum + value,
                        0
                    );

                if (!total) {
                    return {
                        index: 0,
                        offset: 0
                    };
                }

                elapsed =
                    ((elapsed % total) + total) %
                    total;

                for (let i = 0; i < durations.length; i++) {
                    if (elapsed < durations[i]) {
                        return {
                            index: i,
                            offset: elapsed
                        };
                    }

                    elapsed -= durations[i];
                }

                return {
                    index: 0,
                    offset: 0
                };
            }

            /* ==========================================
               PRELOAD NEXT SONG
            ========================================== */

            function preloadSong(index) {
                if (
                    index < 0 ||
                    index >= SONGS.length
                ) {
                    return;
                }

                const audio = new Audio();

                audio.preload = "auto";
                audio.src = getSongUrl(index);

                audio.load();

                setTimeout(() => {
                    audio.removeAttribute("src");
                    audio.load();
                }, 30000);
            }

            /* ==========================================
               AUDIO CONTEXT
            ========================================== */

            function setupAudioContext() {
                if (audioContext) {
                    return;
                }

                audioContext =
                    new (
                        window.AudioContext ||
                        window.webkitAudioContext
                    )();

                sourceNode =
                    audioContext.createMediaElementSource(
                        radioAudio
                    );

                gainNode =
                    audioContext.createGain();

                analyser =
                    audioContext.createAnalyser();

                analyser.fftSize = 128;
                analyser.smoothingTimeConstant = .82;

                sourceNode
                    .connect(gainNode)
                    .connect(analyser)
                    .connect(
                        audioContext.destination
                    );

                gainNode.gain.value = 1;
            }

            /* ==========================================
               START SONG
            ========================================== */

            async function playSong(
                index,
                offset = 0
            ) {
                if (!audioContext) {
                    setupAudioContext();
                }

                if (
                    audioContext.state ===
                    "suspended"
                ) {
                    await audioContext.resume();
                }

                currentIndex = index;

                const src =
                    getSongUrl(index);

                radioAudio.pause();

                radioAudio.src = src;

                radioAudio.load();

                const seekAndPlay = () => {
                    try {
                        if (
                            Number.isFinite(offset) &&
                            offset > 0
                        ) {
                            radioAudio.currentTime =
                                offset;
                        }
                    } catch {}

                    return radioAudio.play();
                };

                try {
                    await seekAndPlay();
                } catch {
                    await new Promise(resolve => {
                        const handler = () => {
                            radioAudio.removeEventListener(
                                "canplay",
                                handler
                            );

                            resolve();
                        };

                        radioAudio.addEventListener(
                            "canplay",
                            handler,
                            { once: true }
                        );
                    });

                    await seekAndPlay();
                }

                playing = true;

                currentStartTime =
                    performance.now() -
                    offset * 1000;

                songName.textContent =
                    SONGS[index];

                playButton.textContent =
                    "⏸ Live Radio Playing";

                playButton.classList.add(
                    "playing"
                );

                /* Start loading the next song
                   without blocking playback. */
                const nextIndex =
                    (index + 1) % SONGS.length;

                preloadSong(nextIndex);

                startVisualizer();
            }

            /* ==========================================
               NEXT SONG
            ========================================== */

            radioAudio.addEventListener(
                "ended",
                async () => {
                    if (!playing) {
                        return;
                    }

                    const nextIndex =
                        (currentIndex + 1) %
                        SONGS.length;

                    try {
                        await playSong(
                            nextIndex,
                            0
                        );
                    } catch {
                        setTimeout(() => {
                            if (playing) {
                                playSong(
                                    nextIndex,
                                    0
                                );
                            }
                        }, 1000);
                    }
                }
            );

            /* ==========================================
               PLAY / PAUSE
            ========================================== */

            playButton.addEventListener(
                "click",
                async () => {
                    if (starting) {
                        return;
                    }

                    if (playing) {
                        radioAudio.pause();

                        playing = false;

                        playButton.textContent =
                            "▶️ Resume Live Radio";

                        playButton.classList.remove(
                            "playing"
                        );

                        return;
                    }

                    starting = true;

                    playButton.disabled = true;
                    playButton.textContent =
                        "🎄 Starting Radio...";

                    try {
                        setupAudioContext();

                        if (
                            audioContext.state ===
                            "suspended"
                        ) {
                            await audioContext.resume();
                        }

                        /*
                         * Find the exact song/offset.
                         *
                         * Durations are cached as they are
                         * discovered, so subsequent starts
                         * are much faster.
                         */
                        const position =
                            await findCurrentSong();

                        await playSong(
                            position.index,
                            position.offset
                        );

                    } catch (error) {
                        console.error(
                            "Radio failed to start:",
                            error
                        );

                        playButton.textContent =
                            "🎄 Try Starting Again";

                    } finally {
                        starting = false;
                        playButton.disabled = false;
                    }
                }
            );

            /* ==========================================
               VISUALIZER
            ========================================== */

            function startVisualizer() {
                if (
                    animationFrame ||
                    !analyser
                ) {
                    return;
                }

                const data =
                    new Uint8Array(
                        analyser.frequencyBinCount
                    );

                const animate = () => {
                    animationFrame =
                        requestAnimationFrame(
                            animate
                        );

                    if (!playing) {
                        return;
                    }

                    analyser.getByteFrequencyData(
                        data
                    );

                    let total = 0;

                    for (
                        let i = 0;
                        i < data.length;
                        i++
                    ) {
                        total += data[i];
                    }

                    const average =
                        total / data.length;

                    const intensity =
                        Math.min(
                            1,
                            average / 180
                        );

                    bg.style.filter =
                        `brightness(${1 + intensity * .12})`;

                    title.style.transform =
                        `scale(${1 + intensity * .012})`;

                    countdown.style.transform =
                        `scale(${1 + intensity * .006})`;
                };
                
                animate();
            }

            /* ==========================================
               COUNTDOWN
            ========================================== */

            function updateCountdown() {
                const now = new Date();

                const christmas =
                    new Date(
                        now.getFullYear(),
                        11,
                        25,
                        0,
                        0,
                        0
                    );

                const newYear =
                    new Date(
                        now.getFullYear() + 1,
                        0,
                        1,
                        0,
                        0,
                        0
                    );

                if (
                    now >= christmas &&
                    now < newYear
                ) {
                    title.textContent =
                        "Merry";

                    subtitle.textContent =
                        "Christmas";

                    countdown.textContent =
                        "";

                    return;
                }

                const difference =
                    christmas - now;

                if (difference <= 0) {
                    return;
                }

                const seconds =
                    Math.floor(
                        difference / 1000
                    );

                const days =
                    Math.floor(
                        seconds / 86400
                    );

                const hours =
                    Math.floor(
                        (seconds % 86400) / 3600
                    );

                const minutes =
                    Math.floor(
                        (seconds % 3600) / 60
                    );

                const secs =
                    seconds % 60;

                countdown.textContent =
                    `${days}d ${hours}h ${minutes}m ${secs}s`;
            }

            updateCountdown();

            setInterval(
                updateCountdown,
                1000
            );

            /* ==========================================
               SNOW
            ========================================== */

            function createSnow(
                container,
                amount,
                minSize,
                maxSize,
                minDuration,
                maxDuration
            ) {
                const fragment =
                    document.createDocumentFragment();

                for (
                    let i = 0;
                    i < amount;
                    i++
                ) {
                    const flake =
                        document.createElement("span");

                    flake.className =
                        "flake";

                    flake.textContent =
                        Math.random() > .5
                            ? "•"
                            : "❄";

                    const size =
                        minSize +
                        Math.random() *
                        (maxSize - minSize);

                    const duration =
                        minDuration +
                        Math.random() *
                        (maxDuration - minDuration);

                    const delay =
                        Math.random() *
                        duration;

                    const drift =
                        `${-80 + Math.random() * 160}px`;

                    flake.style.left =
                        `${Math.random() * 100}%`;

                    flake.style.fontSize =
                        `${size}px`;

                    flake.style.animationDuration =
                        `${duration}s`;

                    flake.style.animationDelay =
                        `-${delay}s`;

                    flake.style.setProperty(
                        "--drift",
                        drift
                    );

                    fragment.appendChild(
                        flake
                    );
                }

                container.appendChild(
                    fragment
                );
            }

            function setupSnow() {
                const width =
                    window.innerWidth;

                const height =
                    window.innerHeight;

                const area =
                    width * height;

                const isSmall =
                    width <= 430;

                const isLandscape =
                    width > height;

                let far;
                let mid;
                let near;

                if (isSmall) {
                    far = 18;
                    mid = 12;
                    near = 7;
                } else if (
                    isLandscape &&
                    height < 600
                ) {
                    far = 20;
                    mid = 13;
                    near = 8;
                } else if (area < 500000) {
                    far = 28;
                    mid = 18;
                    near = 10;
                } else {
                    far = 50;
                    mid = 38;
                    near = 22;
                }

                createSnow(
                    document.getElementById(
                        "snowFar"
                    ),
                    far,
                    2,
                    5,
                    12,
                    25
                );

                createSnow(
                    document.getElementById(
                        "snowMid"
                    ),
                    mid,
                    3,
                    7,
                    9,
                    18
                );

                createSnow(
                    document.getElementById(
                        "snowNear"
                    ),
                    near,
                    4,
                    10,
                    6,
                    14
                );
            }

            setupSnow();

            /* Rebuild snow only when the
               viewport changes significantly. */
            let resizeTimer;

            window.addEventListener(
                "resize",
                () => {
                    clearTimeout(resizeTimer);

                    resizeTimer =
                        setTimeout(() => {
                            document
                                .querySelectorAll(
                                    ".snow-layer"
                                )
                                .forEach(
                                    layer =>
                                        layer.replaceChildren()
                                );

                            setupSnow();
                        }, 250);
                },
                { passive: true }
            );

            /* ==========================================
               MOBILE / SAFARI ZOOM PREVENTION
            ========================================== */

            document.addEventListener(
                "gesturestart",
                e => e.preventDefault(),
                { passive: false }
            );

            document.addEventListener(
                "gesturechange",
                e => e.preventDefault(),
                { passive: false }
            );

            document.addEventListener(
                "gestureend",
                e => e.preventDefault(),
                { passive: false }
            );

            document.addEventListener(
                "wheel",
                e => {
                    if (
                        e.ctrlKey ||
                        e.metaKey
                    ) {
                        e.preventDefault();
                    }
                },
                { passive: false }
            );

            document.addEventListener(
                "keydown",
                e => {
                    if (
                        (e.ctrlKey ||
                            e.metaKey) &&
                        [
                            "+",
                            "-",
                            "=",
                            "0"
                        ].includes(e.key)
                    ) {
                        e.preventDefault();
                    }
                }
            );

            /* Prevent accidental double-tap zoom
               without interfering with normal scrolling. */
            let lastTouchEnd = 0;

            document.addEventListener(
                "touchend",
                e => {
                    const now =
                        Date.now();

                    if (
                        now - lastTouchEnd <=
                        300
                    ) {
                        e.preventDefault();
                    }

                    lastTouchEnd = now;
                },
                { passive: false }
            );

        })();
    </script>

</body>
