<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>Christmas Countdown • Live Radio</title>

<link rel="icon" href="favicon.ico" type="image/x-icon">

<style>

/* =========================================================
   ROOT
========================================================= */

:root {
  --red: #e63946;
  --red-bright: #ff5260;
  --green: #19a974;
  --green-dark: #075e3e;
  --gold: #ffd76a;
  --white: #ffffff;

  --glass: rgba(0, 0, 0, 0.30);
  --glass-border: rgba(255, 255, 255, 0.20);

  --font: Arial, Helvetica, sans-serif;
}


/* =========================================================
   RESET / NO ZOOM / NO SCROLL
========================================================= */

* {
  box-sizing: border-box;

  -webkit-tap-highlight-color: transparent;

  user-select: none;
  -webkit-user-select: none;
}

html,
body {
  width: 100%;
  height: 100%;

  margin: 0;
  padding: 0;

  overflow: hidden;

  background: #071b14;

  font-family: var(--font);

  touch-action: none;

  overscroll-behavior: none;

  -webkit-overflow-scrolling: none;
}

body {
  position: fixed;

  inset: 0;
}


/* =========================================================
   BACKGROUND
========================================================= */

#bg {
  position: fixed;

  inset: -4%;

  width: 108%;
  height: 108%;

  background-image:
    linear-gradient(
      rgba(0, 0, 0, 0.22),
      rgba(0, 0, 0, 0.42)
    ),
    url("christmas-background.jpg");

  background-position: center center;
  background-repeat: no-repeat;
  background-size: cover;

  z-index: -10;

  transform-origin: center center;

  will-change: transform, filter;

  transition: filter 0.12s linear;
}


/* Dark cinematic overlay */

#bg::after {
  content: "";

  position: absolute;

  inset: 0;

  background:
    radial-gradient(
      circle at center,
      rgba(0, 0, 0, 0.03),
      rgba(0, 0, 0, 0.58)
    );

  pointer-events: none;
}


/* =========================================================
   AMBIENT LIGHT
========================================================= */

body::before {
  content: "";

  position: fixed;

  inset: 0;

  pointer-events: none;

  z-index: -9;

  background:
    radial-gradient(
      circle at 15% 20%,
      rgba(255, 35, 50, 0.18),
      transparent 28%
    ),
    radial-gradient(
      circle at 85% 80%,
      rgba(20, 190, 100, 0.18),
      transparent 28%
    );
}


/* =========================================================
   MAIN CONTAINER
========================================================= */

#container {
  position: relative;

  width: 100%;
  height: 100dvh;

  min-height: 100vh;

  padding:
    max(18px, env(safe-area-inset-top))
    18px
    max(18px, env(safe-area-inset-bottom))
    18px;

  display: flex;

  justify-content: center;
  align-items: center;

  text-align: center;

  overflow: hidden;

  z-index: 2;
}


/* =========================================================
   GLASS CARD
========================================================= */

.card {
  position: relative;

  width: min(92vw, 900px);

  padding:
    clamp(25px, 5vw, 55px)
    clamp(18px, 5vw, 55px);

  border-radius: 30px;

  background: var(--glass);

  border: 1px solid var(--glass-border);

  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  box-shadow:
    0 20px 60px rgba(0, 0, 0, 0.42),
    inset 0 1px 0 rgba(255, 255, 255, 0.12);

  display: flex;

  flex-direction: column;

  align-items: center;

  overflow: visible;
}


/* Card highlight */

.card::before {
  content: "";

  position: absolute;

  width: 300px;
  height: 300px;

  top: -180px;
  left: -100px;

  border-radius: 50%;

  background:
    rgba(255, 255, 255, 0.08);

  filter: blur(35px);

  pointer-events: none;
}


/* =========================================================
   LIVE LABEL
========================================================= */

.live-label {
  display: flex;

  align-items: center;

  gap: 8px;

  margin-bottom: 13px;

  color:
    rgba(255, 255, 255, 0.90);

  font-size:
    clamp(0.68rem, 2vw, 0.9rem);

  font-weight: 700;

  letter-spacing: 0.18em;

  text-transform: uppercase;
}


.live-dot {
  width: 9px;
  height: 9px;

  border-radius: 50%;

  background: #ff3344;

  box-shadow:
    0 0 6px #ff3344,
    0 0 16px #ff3344;

  animation:
    livePulse 1.2s ease-in-out infinite;
}


@keyframes livePulse {

  0%,
  100% {
    opacity: 1;
    transform: scale(1);
  }

  50% {
    opacity: 0.4;
    transform: scale(0.65);
  }

}


/* =========================================================
   TITLE
========================================================= */

#title,
#subtitle {
  margin: 0;

  line-height: 0.92;

  font-weight: 900;

  letter-spacing: -0.045em;

  color: #ffffff;

  transform-origin: center;

  will-change: transform;

  position: relative;

  z-index: 3;
}


#title {
  font-size:
    clamp(3rem, 12vw, 7.5rem);

  text-shadow:
    0 3px 10px rgba(0, 0, 0, 0.55),
    0 0 10px rgba(255, 30, 40, 0.95),
    0 0 28px rgba(255, 30, 40, 0.60),
    0 0 45px rgba(20, 170, 90, 0.45);
}


#subtitle {
  margin-top: 4px;

  font-size:
    clamp(2.5rem, 10vw, 6rem);

  background:
    linear-gradient(
      90deg,
      #ffffff,
      #ffe1e1,
      #ffffff
    );

  -webkit-background-clip: text;
  background-clip: text;

  -webkit-text-fill-color: transparent;

  text-shadow:
    0 0 12px rgba(30, 200, 110, 0.55);
}


/* =========================================================
   COUNTDOWN
========================================================= */

#countdown {
  position: relative;

  z-index: 3;

  margin-top:
    clamp(20px, 4vw, 35px);

  padding:
    11px 22px;

  border-radius: 18px;

  background:
    rgba(0, 0, 0, 0.27);

  border:
    1px solid rgba(255, 255, 255, 0.14);

  color: #ffffff;

  font-size:
    clamp(1.45rem, 6vw, 4rem);

  font-weight: 800;

  letter-spacing: 0.03em;

  white-space: nowrap;

  text-shadow:
    0 0 8px rgba(255, 40, 50, 0.9),
    0 0 18px rgba(20, 180, 100, 0.7);

  transform-origin: center;

  will-change: transform;
}


/* =========================================================
   SONG
========================================================= */

.song-wrapper {
  position: relative;

  z-index: 3;

  max-width: 90%;

  margin-top: 17px;

  display: flex;

  flex-direction: column;

  align-items: center;
}


.song-label {
  color:
    rgba(255, 255, 255, 0.60);

  font-size: 0.68rem;

  font-weight: 700;

  letter-spacing: 0.18em;

  text-transform: uppercase;

  margin-bottom: 5px;
}


#songName {
  color: #ffffff;

  font-size:
    clamp(0.9rem, 3vw, 1.5rem);

  font-weight: 600;

  line-height: 1.3;

  text-shadow:
    0 2px 8px rgba(0, 0, 0, 0.85);

  transform-origin: center;

  will-change: transform;
}


/* =========================================================
   PLAY BUTTON
========================================================= */

#playButton {
  position: relative;

  z-index: 3;

  margin-top:
    clamp(25px, 5vw, 40px);

  min-width: 220px;

  padding:
    16px 30px;

  border: none;

  border-radius: 999px;

  background:
    linear-gradient(
      135deg,
      #e63946,
      #b91425
    );

  color: white;

  font-size:
    clamp(1rem, 3vw, 1.3rem);

  font-weight: 800;

  letter-spacing: 0.02em;

  cursor: pointer;

  box-shadow:
    0 8px 25px rgba(190, 20, 40, 0.45),
    0 0 20px rgba(255, 40, 50, 0.30);

  transition:
    transform 0.18s ease,
    box-shadow 0.18s ease,
    filter 0.18s ease;

  touch-action: manipulation;
}


#playButton:hover {

  transform:
    translateY(-3px)
    scale(1.03);

  box-shadow:
    0 12px 30px rgba(190, 20, 40, 0.55),
    0 0 30px rgba(255, 40, 50, 0.50);

  filter: brightness(1.1);
}


#playButton:active {

  transform:
    scale(0.96);
}


/* =========================================================
   SNOW SYSTEM
========================================================= */

/*
   The snow is split into three distance layers.

   FAR:
   z-index -5
   Behind the background/content.

   MID:
   z-index 1
   Between background and main content.

   NEAR:
   z-index 10
   In front of the content.
*/


.snow-layer {

  position: fixed;

  inset: 0;

  width: 100%;
  height: 100%;

  pointer-events: none;

  overflow: hidden;
}


/* FAR SNOW */

#snowFar {

  z-index: -5;

}


/* MID SNOW */

#snowMid {

  z-index: 1;

}


/* NEAR SNOW */

#snowNear {

  z-index: 10;

}


/* =========================================================
   SNOWFLAKE
========================================================= */

.snowflake {

  position: absolute;

  top: -50px;

  color: #ffffff;

  pointer-events: none;

  user-select: none;

  -webkit-user-select: none;

  will-change:
    transform,
    opacity;

  text-shadow:
    0 0 4px rgba(255,255,255,0.8);

  animation-name:
    snowfall;

  animation-timing-function:
    linear;

  animation-iteration-count:
    infinite;
}


/* =========================================================
   SNOW MOVEMENT
========================================================= */

@keyframes snowfall {

  0% {

    transform:
      translate3d(0, -50px, 0)
      rotate(0deg);

  }

  25% {

    transform:
      translate3d(25px, 25vh, 0)
      rotate(90deg);

  }

  50% {

    transform:
      translate3d(-20px, 50vh, 0)
      rotate(180deg);

  }

  75% {

    transform:
      translate3d(30px, 75vh, 0)
      rotate(270deg);

  }

  100% {

    transform:
      translate3d(-15px, 110vh, 0)
      rotate(360deg);

  }

}


/* =========================================================
   CORNER DECORATION
========================================================= */

.corner-star {

  position: fixed;

  z-index: 4;

  color:
    rgba(255, 215, 106, 0.8);

  font-size:
    clamp(1.5rem, 5vw, 3rem);

  pointer-events: none;

  text-shadow:
    0 0 8px var(--gold),
    0 0 20px var(--gold);

  animation:
    twinkle 2.2s ease-in-out infinite;
}


.corner-star.one {

  top: 7%;

  left: 7%;

}


.corner-star.two {

  right: 7%;

  bottom: 7%;

  animation-delay: 1.1s;

}


@keyframes twinkle {

  0%,
  100% {

    opacity: 0.3;

    transform:
      scale(0.8);

  }

  50% {

    opacity: 1;

    transform:
      scale(1.15);

  }

}


/* =========================================================
   FOOTER
========================================================= */

.footer-decoration {

  position: relative;

  z-index: 3;

  margin-top: 18px;

  color:
    rgba(255, 255, 255, 0.52);

  font-size: 0.72rem;

  letter-spacing: 0.13em;

  text-transform: uppercase;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 768px) {

  #container {

    padding-left: 10px;

    padding-right: 10px;

  }


  .card {

    width: 94vw;

    padding:
      30px 14px;

    border-radius: 24px;

  }


  #countdown {

    max-width: 95vw;

    overflow: hidden;

    font-size:
      clamp(1.2rem, 6vw, 2.5rem);

    padding:
      10px 14px;

  }


  #songName {

    max-width: 85vw;

  }


  #playButton {

    min-width: 200px;

    padding:
      15px 24px;

  }

}


/* =========================================================
   SMALL PHONE
========================================================= */

@media (max-height: 650px) {

  .card {

    padding-top: 18px;

    padding-bottom: 18px;

  }


  .live-label {

    margin-bottom: 6px;

  }


  #countdown {

    margin-top: 12px;

  }


  .song-wrapper {

    margin-top: 9px;

  }


  #playButton {

    margin-top: 15px;

  }


  .footer-decoration {

    display: none;

  }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {

    animation-duration:
      0.01ms !important;

    animation-iteration-count:
      1 !important;

    transition-duration:
      0.01ms !important;

  }

}

</style>
</head>


<body>


<!-- =======================================================
     BACKGROUND
======================================================== -->

<div id="bg"></div>


<!-- =======================================================
     FAR SNOW
======================================================== -->

<div id="snowFar" class="snow-layer"></div>


<!-- =======================================================
     MAIN
======================================================== -->

<main id="container">

  <section class="card">

    <div class="live-label">

      <span class="live-dot"></span>

      Christmas Radio

    </div>


    <h1 id="title">
      Christmas
    </h1>


    <h1 id="subtitle">
      Countdown
    </h1>


    <div id="countdown">
      00d 00h 00m 00s
    </div>


    <div class="song-wrapper">

      <div class="song-label">
        Now Playing
      </div>

      <div id="songName">
        Ready to start the Christmas radio
      </div>

    </div>


    <button id="playButton">
      🎄 Start Live Radio
    </button>


    <div class="footer-decoration">
      ❄️ Merry Christmas ❄️
    </div>

  </section>

</main>


<!-- =======================================================
     MIDDLE SNOW
======================================================== -->

<div id="snowMid" class="snow-layer"></div>


<!-- =======================================================
     NEAR SNOW
======================================================== -->

<div id="snowNear" class="snow-layer"></div>


<!-- =======================================================
     DECORATIVE STARS
======================================================== -->

<div class="corner-star one">
  ✦
</div>

<div class="corner-star two">
  ✦
</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const RADIO_START =
  new Date(
    "Dec 1, 2025 00:00:00"
  ).getTime();


const SONG_NAMES = [

  "All I Want For Christmas Is You",

  "Baby It's Cold Outside",

  "Blue Christmas",

  "Carol Of The Bells",

  "Christmas (Baby Please Come Home)",

  "Christmas Canon",

  "Deck The Halls",

  "Do You Want To Build A Snowman",

  "Feliz Navidad",

  "Frosty The Snowman",

  "God Rest Ye Merry Gentlemen",

  "Here Comes Santa Claus",

  "Holly Jolly Christmas",

  "I Want A Hippopotamus For Christmas",

  "It's Beginning To Look A Lot Like Christmas",

  "It's The Most Wonderful Time Of The Year",

  "Jingle Bell Rock",

  "Jingle Bells",

  "Last Christmas",

  "Let It Snow! Let It Snow!",

  "Little Drummer Boy",

  "Mistletoe",

  "O Christmas Tree",

  "Rockin Around The Christmas Tree",

  "Rudolph The Red-Nosed Reindeer",

  "Santa Baby",

  "Santa Claus Is Comin' To Town",

  "Silent Night",

  "Sleigh Ride",

  "The Christmas Song",

  "Up On The Housetop",

  "We Wish You A Merry Christmas",

  "White Christmas",

  "Winter Wonderland",

  "Wonderful Christmastime",

  "You're A Mean One, Mr. Grinch"

];


const PLAYLIST =
  SONG_NAMES.map(
    name =>
      `songs/Music Now, Trap Music Now, Dance Music Now - ${name} (SPOTISAVER).mp3`
  );


const SPEECH_SRC =
  "songs/speech.mp3";


/* =========================================================
   ELEMENTS
========================================================= */

const countdownEl =
  document.getElementById(
    "countdown"
  );


const titleEl =
  document.getElementById(
    "title"
  );


const subtitleEl =
  document.getElementById(
    "subtitle"
  );


const songNameEl =
  document.getElementById(
    "songName"
  );


const bgEl =
  document.getElementById(
    "bg"
  );


const playButton =
  document.getElementById(
    "playButton"
  );


/* =========================================================
   AUDIO
========================================================= */

let audioCtx = null;

let durations = [];

let speechBuffer = null;

let globalSongIndex = 0;

let analyser = null;

let dataArray = null;

let radioStarted = false;


/* =========================================================
   COUNTDOWN
========================================================= */

function updateCountdown() {

  const now =
    new Date();


  const year =
    now.getFullYear();


  const christmas =
    new Date(
      `Dec 25, ${year} 00:00:00`
    );


  const newYear =
    new Date(
      `Jan 1, ${year + 1} 00:00:00`
    );


  /*
    Christmas Day
  */

  if (
    now >= christmas &&
    now < newYear
  ) {

    countdownEl.textContent =
      "";

    titleEl.textContent =
      "Merry";

    subtitleEl.textContent =
      "Christmas";

    return;

  }


  /*
    Find next Christmas
  */

  const targetYear =
    now >= newYear
      ? year + 1
      : year;


  const target =
    new Date(
      `Dec 25, ${targetYear} 00:00:00`
    ).getTime();


  const difference =
    target -
    now.getTime();


  const days =
    Math.floor(
      difference /
      86400000
    );


  const hours =
    Math.floor(
      (difference %
        86400000) /
      3600000
    );


  const minutes =
    Math.floor(
      (difference %
        3600000) /
      60000
    );


  const seconds =
    Math.floor(
      (difference %
        60000) /
      1000
    );


  countdownEl.textContent =
    `${days}d ` +
    `${String(hours).padStart(2, "0")}h ` +
    `${String(minutes).padStart(2, "0")}m ` +
    `${String(seconds).padStart(2, "0")}s`;

}


updateCountdown();


setInterval(
  updateCountdown,
  1000
);


/* =========================================================
   DISTANCE SNOW SYSTEM
========================================================= */

const snowFar =
  document.getElementById(
    "snowFar"
  );


const snowMid =
  document.getElementById(
    "snowMid"
  );


const snowNear =
  document.getElementById(
    "snowNear"
  );


/*
   distance:

   0.0 = very far

   0.5 = medium

   1.0 = very close
*/

function createSnowflake(
  layer,
  distance
) {

  const snow =
    document.createElement(
      "div"
    );


  snow.className =
    "snowflake";


  /*
     Different snowflake shapes.
  */

  const characters = [
    "❄",
    "❅",
    "❆",
    "•",
    "✦"
  ];


  snow.textContent =
    characters[
      Math.floor(
        Math.random() *
        characters.length
      )
    ];


  /*
     SIZE

     Far = small

     Near = large
  */

  const size =
    5 +
    distance * 25 +
    Math.random() * 8;


  snow.style.fontSize =
    `${size}px`;


  /*
     OPACITY

     Far = faint

     Near = bright
  */

  const opacity =
    0.16 +
    distance * 0.72;


  snow.style.opacity =
    opacity;


  /*
     RANDOM HORIZONTAL POSITION
  */

  snow.style.left =
    `${Math.random() * 100}%`;


  /*
     DEPTH AFFECTS SPEED

     Far = slower

     Near = faster
  */

  const duration =
    16 -
    distance * 9 +
    Math.random() * 5;


  snow.style.animationDuration =
    `${duration}s`;


  /*
     Random animation position.

     This makes snow already
     falling when page opens.
  */

  snow.style.animationDelay =
    `${Math.random() * -20}s`;


  /*
     DEPTH BLUR

     Far snow is blurry.

     Near snow is sharp.
  */

  const blur =
    (1 - distance) * 2.8;


  snow.style.filter =
    `blur(${blur}px)`;


  /*
     Near snow gets a stronger glow.
  */

  if (distance > 0.7) {

    snow.style.textShadow =
      "0 0 4px white, 0 0 10px rgba(255,255,255,.7)";

  }


  layer.appendChild(
    snow
  );

}


/* =========================================================
   BUILD SNOW
========================================================= */

function createDistanceSnow() {

  snowFar.innerHTML =
    "";

  snowMid.innerHTML =
    "";

  snowNear.innerHTML =
    "";


  const mobile =
    window.innerWidth < 768;


  /*
     FAR

     Lots of tiny flakes.
  */

  const farCount =
    mobile ? 25 : 50;


  /*
     MID

     Medium number.
  */

  const midCount =
    mobile ? 18 : 38;


  /*
     NEAR

     Fewer large flakes.
  */

  const nearCount =
    mobile ? 10 : 22;


  /*
     FAR
  */

  for (
    let i = 0;
    i < farCount;
    i++
  ) {

    createSnowflake(
      snowFar,
      0.12 +
      Math.random() * 0.18
    );

  }


  /*
     MID
  */

  for (
    let i = 0;
    i < midCount;
    i++
  ) {

    createSnowflake(
      snowMid,
      0.40 +
      Math.random() * 0.20
    );

  }


  /*
     NEAR
  */

  for (
    let i = 0;
    i < nearCount;
    i++
  ) {

    createSnowflake(
      snowNear,
      0.80 +
      Math.random() * 0.20
    );

  }

}


/*
   Create initial snow.
*/

createDistanceSnow();


/*
   Rebuild on major resize.

   This prevents hundreds of extra
   snowflakes from accumulating.
*/

let resizeTimer = null;


window.addEventListener(
  "resize",
  () => {

    clearTimeout(
      resizeTimer
    );


    resizeTimer =
      setTimeout(
        createDistanceSnow,
        300
      );

  }
);


/* =========================================================
   AUDIO HELPERS
========================================================= */

function getDuration(
  src
) {

  return new Promise(
    resolve => {

      const audio =
        new Audio();


      audio.preload =
        "metadata";


      audio.src =
        src;


      audio.onloadedmetadata =
        () => {

          resolve(
            Number.isFinite(
              audio.duration
            )
              ? audio.duration
              : 240
          );

        };


      audio.onerror =
        () => {

          resolve(240);

        };

    }
  );

}


async function loadDurations() {

  if (
    durations.length
  ) {

    return;

  }


  durations =
    await Promise.all(
      PLAYLIST.map(
        src =>
          getDuration(src)
      )
    );

}


async function loadBuffer(
  src
) {

  const response =
    await fetch(src);


  if (!response.ok) {

    throw new Error(
      `Unable to load ${src}`
    );

  }


  const arrayBuffer =
    await response.arrayBuffer();


  return await
    audioCtx.decodeAudioData(
      arrayBuffer
    );

}


/* =========================================================
   LIVE RADIO
========================================================= */

async function playLive(
  index,
  offset
) {

  if (!radioStarted) {

    return;

  }


  try {

    songNameEl.textContent =
      SONG_NAMES[index];


    const buffer =
      await loadBuffer(
        PLAYLIST[index]
      );


    /*
       Skip if offset is past
       the end of the song.
    */

    if (
      offset >=
      buffer.duration
    ) {

      globalSongIndex =
        (index + 1) %
        PLAYLIST.length;


      return playLive(
        globalSongIndex,
        offset -
        buffer.duration
      );

    }


    /*
       ANALYSER
    */

    if (!analyser) {

      analyser =
        audioCtx.createAnalyser();


      analyser.fftSize =
        64;


      analyser.smoothingTimeConstant =
        0.75;


      dataArray =
        new Uint8Array(
          analyser.frequencyBinCount
        );

    }


    /*
       AUDIO GRAPH

       source
         ↓
       gain
         ↓
       analyser
         ↓
       speakers
    */

    const source =
      audioCtx.createBufferSource();


    const gain =
      audioCtx.createGain();


    source.buffer =
      buffer;


    source
      .connect(gain)
      .connect(analyser)
      .connect(
        audioCtx.destination
      );


    gain.gain.value =
      1;


    source.start(
      0,
      offset
    );


    /*
       Speech every 3 songs.
    */

    if (
      (globalSongIndex + 1) %
      3 === 0
    ) {

      if (!speechBuffer) {

        speechBuffer =
          await loadBuffer(
            SPEECH_SRC
          );

      }


      const delay =
        Math.max(
          0,
          buffer.duration -
          offset -
          5
        );


      setTimeout(
        () => {

          if (
            !radioStarted
          ) {

            return;

          }


          try {

            gain.gain.value =
              0.55;


            const speech =
              audioCtx.createBufferSource();


            speech.buffer =
              speechBuffer;


            speech.connect(
              audioCtx.destination
            );


            speech.start();


            speech.onended =
              () => {

                gain.gain.value =
                  1;

              };


          } catch (
            error
          ) {

            console.error(
              "Speech error:",
              error
            );


            gain.gain.value =
              1;

          }

        },
        delay * 1000
      );

    }


    /*
       Next song.
    */

    const remaining =
      buffer.duration -
      offset;


    setTimeout(
      () => {

        if (
          !radioStarted
        ) {

          return;

        }


        globalSongIndex =
          (
            globalSongIndex +
            1
          ) %
          PLAYLIST.length;


        playLive(
          globalSongIndex,
          0
        );

      },
      remaining * 1000
    );


  } catch (
    error
  ) {

    console.error(
      "Radio playback error:",
      error
    );


    /*
       Skip broken songs.
    */

    globalSongIndex =
      (
        globalSongIndex +
        1
      ) %
      PLAYLIST.length;


    setTimeout(
      () => {

        playLive(
          globalSongIndex,
          0
        );

      },
      1000
    );

  }

}


/* =========================================================
   START RADIO
========================================================= */

playButton.onclick =
  async () => {

    if (radioStarted) {

      return;

    }


    radioStarted =
      true;


    playButton.disabled =
      true;


    playButton.textContent =
      "🎄 Starting Radio...";


    try {

      audioCtx =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();


      await audioCtx.resume();


      /*
         Get all song durations.
      */

      await loadDurations();


      /*
         Calculate current position
         in the continuous radio stream.
      */

      let elapsed =
        (
          Date.now() -
          RADIO_START
        ) / 1000;


      const total =
        durations.reduce(
          (sum, duration) =>
            sum + duration,
          0
        );


      if (
        !total ||
        !Number.isFinite(total)
      ) {

        throw new Error(
          "Unable to calculate playlist duration."
        );

      }


      /*
         Loop elapsed time around
         the playlist.
      */

      elapsed =
        (
          (
            elapsed %
            total
          ) +
          total
        ) %
        total;


      let sum =
        0;


      /*
         Find current song.
      */

      for (
        let i = 0;
        i < durations.length;
        i++
      ) {

        if (
          sum +
          durations[i] >
          elapsed
        ) {

          globalSongIndex =
            i;


          playButton.style.display =
            "none";


          playLive(
            i,
            elapsed - sum
          );


          break;

        }


        sum +=
          durations[i];

      }


    } catch (
      error
    ) {

      console.error(
        "Radio startup error:",
        error
      );


      radioStarted =
        false;


      playButton.disabled =
        false;


      playButton.textContent =
        "🎄 Start Live Radio";


      songNameEl.textContent =
        "Unable to start radio";

    }

  };


/* =========================================================
   MUSIC VISUALIZER
========================================================= */

function animateEffects() {

  requestAnimationFrame(
    animateEffects
  );


  if (
    !analyser ||
    !dataArray
  ) {

    return;

  }


  analyser.getByteFrequencyData(
    dataArray
  );


  let total =
    0;


  for (
    let i = 0;
    i < dataArray.length;
    i++
  ) {

    total +=
      dataArray[i];

  }


  const avg =
    total /
    dataArray.length;


  /*
     Background movement.
  */

  const bgScale =
    1 +
    avg / 12000;


  bgEl.style.transform =
    `scale(${bgScale})`;


  /*
     Background brightness.
  */

  const brightness =
    1 -
    Math.min(
      avg / 450,
      0.35
    );


  bgEl.style.filter =
    `brightness(${brightness})`;


  /*
     Main title pulse.
  */

  const titleScale =
    1 +
    avg / 5000;


  titleEl.style.transform =
    `scale(${titleScale})`;


  subtitleEl.style.transform =
    `scale(${titleScale})`;


  /*
     Countdown pulse.
  */

  countdownEl.style.transform =
    `scale(${1 + avg / 7000})`;


  /*
     Song name pulse.
  */

  songNameEl.style.transform =
    `scale(${1 + avg / 9000})`;

}


animateEffects();


/* =========================================================
   PREVENT ZOOM
========================================================= */


/*
   iOS gesture prevention.
*/

document.addEventListener(
  "gesturestart",
  event =>
    event.preventDefault()
);


document.addEventListener(
  "gesturechange",
  event =>
    event.preventDefault()
);


document.addEventListener(
  "gestureend",
  event =>
    event.preventDefault()
);


/*
   Ctrl/Cmd + mouse wheel zoom.
*/

document.addEventListener(
  "wheel",
  event => {

    if (
      event.ctrlKey
    ) {

      event.preventDefault();

    }

  },
  {
    passive: false
  }
);


/*
   Keyboard zoom shortcuts.
*/

document.addEventListener(
  "keydown",
  event => {

    if (
      (
        event.ctrlKey ||
        event.metaKey
      ) &&
      (
        event.key === "+" ||
        event.key === "-" ||
        event.key === "=" ||
        event.key === "0"
      )
    ) {

      event.preventDefault();

    }

  }
);


/*
   Prevent double-tap zoom.
*/

let lastTouchEnd =
  0;


document.addEventListener(
  "touchend",
  event => {

    const now =
      Date.now();


    if (
      now -
      lastTouchEnd <=
      300
    ) {

      event.preventDefault();

    }


    lastTouchEnd =
      now;

  },
  {
    passive: false
  }
);

</script>
