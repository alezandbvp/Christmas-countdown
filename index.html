<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="theme-color" content="#12030a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="icon" href="favicon.ico">

    <title>Christmas Countdown • Live Radio</title>

    <style>
        :root {
            --red: #d71920;
            --red-dark: #8d0710;
            --green: #0b6b3a;
            --green-dark: #063d25;
            --gold: #ffd76a;
            --white: #ffffff;

            --glass: rgba(15, 5, 10, 0.48);
            --glass-border: rgba(255, 255, 255, 0.18);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            overscroll-behavior: none;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: var(--white);
            background:
                radial-gradient(circle at 15% 20%, rgba(215, 25, 32, 0.28), transparent 35%),
                radial-gradient(circle at 85% 75%, rgba(11, 107, 58, 0.3), transparent 35%),
                #12030a;
        }

        #bg {
            position: fixed;
            inset: -4%;
            width: 108%;
            height: 108%;

            background-image:
                linear-gradient(
                    rgba(15, 0, 5, 0.35),
                    rgba(15, 0, 5, 0.55)
                ),
                url("christmas-background.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            filter: saturate(1.15);
            z-index: -5;
        }

        .snow-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 2;
        }

        .snowflake {
            position: absolute;
            top: -30px;
            color: rgba(255, 255, 255, 0.9);
            font-size: var(--size);
            opacity: var(--opacity);
            animation:
                snowFall var(--duration) linear infinite,
                snowDrift var(--drift) ease-in-out infinite alternate;
            animation-delay: var(--delay);
        }

        @keyframes snowFall {
            from {
                transform: translate3d(0, -40px, 0);
            }

            to {
                transform: translate3d(0, 110vh, 0);
            }
        }

        @keyframes snowDrift {
            from {
                margin-left: -25px;
            }

            to {
                margin-left: 25px;
            }
        }

        #container {
            width: 100%;
            height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                max(20px, env(safe-area-inset-top))
                max(20px, env(safe-area-inset-right))
                max(20px, env(safe-area-inset-bottom))
                max(20px, env(safe-area-inset-left));

            position: relative;
            z-index: 5;
        }

        .card {
            width: min(92vw, 900px);

            padding: clamp(30px, 5vw, 60px);

            text-align: center;

            background: var(--glass);

            border: 1px solid var(--glass-border);
            border-radius: 30px;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);

            position: relative;
        }

        .live-label {
            display: inline-flex;
            align-items: center;
            gap: 9px;

            padding: 9px 17px;

            border-radius: 999px;

            background: rgba(215, 25, 32, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.15);

            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;

            margin-bottom: 20px;
        }

        .live-dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #ff3038;

            box-shadow: 0 0 12px #ff3038;

            animation: livePulse 1.4s infinite;
        }

        @keyframes livePulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.45;
                transform: scale(0.75);
            }
        }

        #title {
            font-size: clamp(3rem, 9vw, 7rem);
            line-height: 0.95;

            font-weight: 900;
            letter-spacing: -0.06em;

            background: linear-gradient(
                135deg,
                #ffffff 5%,
                #ffe59b 40%,
                #ffffff 70%,
                #ffccd0 100%
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            text-shadow:
                0 10px 40px rgba(0, 0, 0, 0.35);

            margin-bottom: 4px;
        }

        #subtitle {
            font-size: clamp(2rem, 5vw, 4rem);
            line-height: 1;

            font-weight: 800;

            color: #ffffff;

            text-shadow:
                0 5px 25px rgba(0, 0, 0, 0.4);

            margin-bottom: 28px;
        }

        #countdown {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: min(90%, 500px);

            padding: 15px 25px;

            border-radius: 999px;

            background:
                linear-gradient(
                    135deg,
                    rgba(215, 25, 32, 0.3),
                    rgba(11, 107, 58, 0.28)
                );

            border: 1px solid rgba(255, 255, 255, 0.18);

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 10px 30px rgba(0, 0, 0, 0.18);

            font-size: clamp(1.1rem, 3vw, 1.7rem);
            font-weight: 800;

            letter-spacing: 0.03em;

            margin-bottom: 30px;
        }

        .song-wrapper {
            margin-bottom: 28px;
        }

        .now-playing {
            font-size: 0.72rem;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: 0.18em;

            opacity: 0.72;

            margin-bottom: 9px;
        }

        #songName {
            min-height: 1.5em;

            font-size: clamp(1rem, 3vw, 1.45rem);
            font-weight: 700;

            color: #ffffff;

            text-shadow:
                0 2px 12px rgba(0, 0, 0, 0.45);
        }

        #playButton {
            border: 0;
            outline: none;

            padding: 15px 28px;

            border-radius: 999px;

            background:
                linear-gradient(
                    135deg,
                    #e31b23,
                    #a80d15
                );

            color: white;

            font-size: 1rem;
            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 12px 30px rgba(150, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                opacity 0.18s ease;
        }

        #playButton:active {
            transform: scale(0.96);
        }

        #playButton:hover {
            transform: translateY(-2px);

            box-shadow:
                0 15px 35px rgba(150, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }

        #playButton.paused {
            background:
                linear-gradient(
                    135deg,
                    #0d7a43,
                    #07552f
                );
        }

        footer {
            margin-top: 28px;

            font-size: 0.78rem;
            font-weight: 700;

            opacity: 0.65;

            letter-spacing: 0.08em;
        }

        .star {
            position: absolute;

            font-size: 1.3rem;

            opacity: 0.65;

            animation: starFloat 3s ease-in-out infinite alternate;
        }

        .star.one {
            top: 22px;
            left: 25px;
        }

        .star.two {
            top: 45px;
            right: 30px;
            animation-delay: 0.8s;
        }

        .star.three {
            bottom: 35px;
            left: 35px;
            animation-delay: 1.5s;
        }

        .star.four {
            bottom: 25px;
            right: 35px;
            animation-delay: 2.1s;
        }

        @keyframes starFloat {
            from {
                transform: translateY(0) rotate(0deg);
                opacity: 0.45;
            }

            to {
                transform: translateY(-8px) rotate(8deg);
                opacity: 0.9;
            }
        }

        audio {
            display: none !important;
        }

        @media (max-width: 768px) {
            #container {
                padding:
                    max(15px, env(safe-area-inset-top))
                    max(15px, env(safe-area-inset-right))
                    max(15px, env(safe-area-inset-bottom))
                    max(15px, env(safe-area-inset-left));
            }

            .card {
                width: 94vw;
                padding: 30px 20px;
                border-radius: 25px;
            }

            #countdown {
                min-width: 0;
                width: 100%;
                padding: 13px 15px;
                margin-bottom: 24px;
            }

            #songName {
                padding: 0 8px;
            }

            #playButton {
                width: min(100%, 330px);
            }

            footer {
                margin-top: 22px;
            }
        }

        @media (max-width: 900px) and (orientation: landscape) {
            #container {
                align-items: center;
            }

            .card {
                padding: 20px 35px;
                max-height: 92dvh;
            }

            .live-label {
                margin-bottom: 8px;
            }

            #title {
                font-size: clamp(2.5rem, 8vw, 5rem);
            }

            #subtitle {
                font-size: clamp(1.6rem, 4vw, 2.7rem);
                margin-bottom: 15px;
            }

            #countdown {
                margin-bottom: 15px;
                padding: 9px 20px;
            }

            .song-wrapper {
                margin-bottom: 15px;
            }

            footer {
                margin-top: 12px;
            }
        }

        @media (max-height: 650px) {
            .card {
                padding-top: 20px;
                padding-bottom: 20px;
            }

            .live-label {
                margin-bottom: 8px;
            }

            #subtitle {
                margin-bottom: 15px;
            }

            #countdown {
                margin-bottom: 15px;
            }

            .song-wrapper {
                margin-bottom: 15px;
            }

            footer {
                display: none;
            }
        }

        @media (max-width: 380px) {
            .card {
                padding: 25px 15px;
            }

            #countdown {
                font-size: 0.95rem;
            }

            #songName {
                font-size: 0.95rem;
            }

            #playButton {
                font-size: 0.9rem;
                padding: 13px 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>

<body>

    <div id="bg"></div>

    <div id="snowFar" class="snow-layer"></div>
    <div id="snowMid" class="snow-layer"></div>
    <div id="snowNear" class="snow-layer"></div>

    <main id="container">

        <section class="card">

            <div class="star one">✦</div>
            <div class="star two">✧</div>
            <div class="star three">✦</div>
            <div class="star four">✧</div>

            <div class="live-label">
                <span class="live-dot"></span>
                Christmas Radio
            </div>

            <h1 id="title">Christmas</h1>
            <h1 id="subtitle">Countdown</h1>

            <div id="countdown">
                Loading...
            </div>

            <div class="song-wrapper">

                <div class="now-playing">
                    Now Playing
                </div>

                <div id="songName">
                    Loading radio...
                </div>

            </div>

            <button id="playButton">
                🎄 Start Live Radio
            </button>

            <footer>
                ❄️ Merry Christmas ❄️
            </footer>

        </section>

    </main>

    <audio
        id="musicAudio"
        preload="auto"
        playsinline
        controlslist="nodownload noplaybackrate noremoteplayback">
    </audio>

    <audio
        id="speechAudio"
        preload="auto"
        playsinline
        controlslist="nodownload noplaybackrate noremoteplayback">
    </audio>

    <script>

        /* =========================================================
           AUDIO ELEMENTS
        ========================================================= */

        const musicAudio =
            document.getElementById("musicAudio");

        const speechAudio =
            document.getElementById("speechAudio");


        /* =========================================================
           SEEK PROTECTION
        ========================================================= */

        let realPlaybackPosition = 0;

        let correctingSeek = false;


        /*
            Remember the last REAL position.

            This is deliberately separate from the position
            requested by the Lock Screen.
        */

        function rememberRealPosition() {

            if (
                correctingSeek ||
                !radioPlaying
            ) {
                return;
            }


            if (
                Number.isFinite(
                    musicAudio.currentTime
                )
            ) {

                realPlaybackPosition =
                    musicAudio.currentTime;
            }
        }


        musicAudio.addEventListener(
            "timeupdate",
            rememberRealPosition
        );


        /*
            If iOS actually changes currentTime because the
            user dragged the Lock Screen slider, immediately
            restore the real position.
        */

        musicAudio.addEventListener(
            "seeking",
            () => {

                if (
                    !radioPlaying ||
                    correctingSeek
                ) {
                    return;
                }


                correctingSeek = true;


                try {

                    musicAudio.currentTime =
                        realPlaybackPosition;

                } catch {}


                requestAnimationFrame(
                    () => {

                        correctingSeek =
                            false;

                    }
                );
            }
        );


        /* =========================================================
           CONFIG
        ========================================================= */

        const RADIO_START =
            new Date(
                "Dec 1, 2025 00:00:00"
            ).getTime();


        const SONG_FOLDER =
            "./songs/";


        const SPEECH_SRC =
            "./songs/speech.mp3";


        const DURATION_MANIFEST =
            "./songs/durations.json";


        const PLAYLIST_PREFIX =
            "Music Now, Trap Music Now, Dance Music Now - ";


        const PLAYLIST_SUFFIX =
            " (SPOTISAVER).mp3";


        /* =========================================================
           SONG LIST
        ========================================================= */

        const SONG_NAMES = [

            "All I Want For Christmas Is You",

            "Baby It's Cold Outside",

            "Blue Christmas",

            "Carol Of The Bells",

            "Christmas (Baby Please Come Home)",

            "Christmas Canon",

            "Deck The Halls",

            "Do You Want To Build A Snowman",

            "Feliz Navidad",

            "Frosty The Snowman",

            "God Rest Ye Merry Gentlemen",

            "Here Comes Santa Claus",

            "Holly Jolly Christmas",

            "I Want A Hippopotamus For Christmas",

            "It's Beginning To Look A Lot Like Christmas",

            "It's The Most Wonderful Time Of The Year",

            "Jingle Bell Rock",

            "Jingle Bells",

            "Last Christmas",

            "Let It Snow! Let It Snow!",

            "Little Drummer Boy",

            "Mistletoe",

            "O Christmas Tree",

            "Rockin Around The Christmas Tree",

            "Rudolph The Red-Nosed Reindeer",

            "Santa Baby",

            "Santa Claus Is Comin' To Town",

            "Silent Night",

            "Sleigh Ride",

            "The Christmas Song",

            "Up On The Housetop",

            "We Wish You A Merry Christmas",

            "White Christmas",

            "Winter Wonderland",

            "Wonderful Christmastime",

            "You're A Mean One, Mr. Grinch"

        ];


        /* =========================================================
           UI
        ========================================================= */

        const playButton =
            document.getElementById(
                "playButton"
            );


        const songNameElement =
            document.getElementById(
                "songName"
            );


        const countdownElement =
            document.getElementById(
                "countdown"
            );


        /* =========================================================
           STATE
        ========================================================= */

        let durations = [];

        let totalPlaylistDuration = 0;

        let radioPlaying = false;

        let currentSongIndex = 0;

        let currentSongOffset = 0;

        let metadataLoaded = false;

        let metadataLoadingPromise = null;

        let lastSyncTime = 0;

        let speechStarted = false;


        /* =========================================================
           MEDIA SESSION
        ========================================================= */

        function updateLiveMediaSession() {

            if (
                !("mediaSession" in navigator)
            ) {
                return;
            }


            const currentSong =
                SONG_NAMES[
                    currentSongIndex
                ] ||
                "Christmas Countdown Radio";


            try {

                navigator.mediaSession.metadata =
                    new MediaMetadata({

                        title:
                            currentSong,

                        artist:
                            "Christmas Countdown Radio",

                        album:
                            "Christmas Countdown",

                        artwork: [

                            {
                                src:
                                    "./favicon.ico",

                                sizes:
                                    "512x512",

                                type:
                                    "image/x-icon"
                            }

                        ]

                    });

            } catch (error) {

                console.warn(
                    "Could not set Media Session metadata:",
                    error
                );
            }


            /*
                Give the Lock Screen the ACTUAL finite
                duration and ACTUAL current position.

                This lets the progress indicator move normally
                while allowing us to reject manual seeking.
            */

            try {

                const duration =
                    musicAudio.duration;


                const position =
                    musicAudio.currentTime;


                if (
                    Number.isFinite(
                        duration
                    ) &&
                    duration > 0 &&
                    Number.isFinite(
                        position
                    ) &&
                    position >= 0 &&
                    position <= duration
                ) {

                    navigator.mediaSession
                        .setPositionState({

                            duration:
                                duration,

                            playbackRate:
                                musicAudio.playbackRate || 1,

                            position:
                                position

                        });

                }

            } catch (error) {

                console.warn(
                    "Could not update Media Session position:",
                    error
                );
            }
        }


        function setupMediaSession() {

            if (
                !("mediaSession" in navigator)
            ) {
                return;
            }


            updateLiveMediaSession();


            /*
                PLAY
            */

            try {

                navigator.mediaSession
                    .setActionHandler(
                        "play",
                        async () => {

                            await resumeLive();

                        }
                    );

            } catch {}


            /*
                PAUSE
            */

            try {

                navigator.mediaSession
                    .setActionHandler(
                        "pause",
                        () => {

                            pauseRadio();

                        }
                    );

            } catch {}


            /*
                PREVIOUS / NEXT

                These remain disabled.
            */

            try {

                navigator.mediaSession
                    .setActionHandler(
                        "nexttrack",
                        () => {}
                    );

            } catch {}


            try {

                navigator.mediaSession
                    .setActionHandler(
                        "previoustrack",
                        () => {}
                    );

            } catch {}


            /*
                15 SECOND BACK / FORWARD

                These remain disabled.
            */

            try {

                navigator.mediaSession
                    .setActionHandler(
                        "seekbackward",
                        () => {}
                    );

            } catch {}


            try {

                navigator.mediaSession
                    .setActionHandler(
                        "seekforward",
                        () => {}
                    );

            } catch {}


            /*
                LOCK SCREEN SLIDER

                Do NOT allow the requested seek.

                Instead immediately restore the actual
                playback position to the Media Session.
            */

            try {

                navigator.mediaSession
                    .setActionHandler(
                        "seekto",
                        () => {

                            correctingSeek = true;


                            try {

                                musicAudio.currentTime =
                                    realPlaybackPosition;

                            } catch {}


                            /*
                                Force the Lock Screen position
                                back to the real position.
                            */

                            updateLiveMediaSession();


                            requestAnimationFrame(
                                () => {

                                    correctingSeek =
                                        false;

                                }
                            );

                        }
                    );

            } catch {}


            /*
                Disable the Media Session seek position
                from being treated as a user-controlled action.
            */

            try {

                navigator.mediaSession.playbackState =
                    "none";

            } catch {}
        }


        setupMediaSession();


        /* =========================================================
           HELPERS
        ========================================================= */

        function getSongFilename(songName) {

            return (
                PLAYLIST_PREFIX +
                songName +
                PLAYLIST_SUFFIX
            );
        }


        function getSongURL(songName) {

            return (
                SONG_FOLDER +
                encodeURIComponent(
                    getSongFilename(
                        songName
                    )
                )
            );
        }


        function formatTime(seconds) {

            if (
                !Number.isFinite(
                    seconds
                )
            ) {

                return "0:00";
            }


            seconds =
                Math.max(
                    0,
                    Math.floor(
                        seconds
                    )
                );


            const minutes =
                Math.floor(
                    seconds / 60
                );


            const secs =
                String(
                    seconds % 60
                ).padStart(
                    2,
                    "0"
                );


            return `${minutes}:${secs}`;
        }


        /* =========================================================
           COUNTDOWN
        ========================================================= */

        function updateCountdown() {

            const now =
                new Date();


            let christmas =
                new Date(
                    now.getFullYear(),
                    11,
                    25,
                    0,
                    0,
                    0,
                    0
                );


            if (
                now.getTime() >=
                christmas.getTime()
            ) {

                christmas =
                    new Date(
                        now.getFullYear() + 1,
                        11,
                        25,
                        0,
                        0,
                        0,
                        0
                    );
            }


            const difference =
                christmas.getTime() -
                now.getTime();


            const totalSeconds =
                Math.floor(
                    difference / 1000
                );


            const days =
                Math.floor(
                    totalSeconds / 86400
                );


            const hours =
                Math.floor(
                    (totalSeconds % 86400) /
                    3600
                );


            const minutes =
                Math.floor(
                    (totalSeconds % 3600) /
                    60
                );


            const seconds =
                totalSeconds % 60;


            countdownElement.textContent =
                `${days}d ${hours}h ${minutes}m ${seconds}s`;
        }


        updateCountdown();


        setInterval(
            updateCountdown,
            1000
        );


        /* =========================================================
           SNOW
        ========================================================= */

        function createSnowflakes(
            container,
            amount
        ) {

            for (
                let i = 0;
                i < amount;
                i++
            ) {

                const snowflake =
                    document.createElement(
                        "div"
                    );


                snowflake.className =
                    "snowflake";


                snowflake.textContent =
                    Math.random() > 0.5
                        ? "❄"
                        : "•";


                snowflake.style.left =
                    `${Math.random() * 100}%`;


                snowflake.style.setProperty(
                    "--size",
                    `${8 + Math.random() * 14}px`
                );


                snowflake.style.setProperty(
                    "--opacity",
                    `${0.25 + Math.random() * 0.65}`
                );


                snowflake.style.setProperty(
                    "--duration",
                    `${7 + Math.random() * 12}s`
                );


                snowflake.style.setProperty(
                    "--drift",
                    `${2 + Math.random() * 4}s`
                );


                snowflake.style.setProperty(
                    "--delay",
                    `${-Math.random() * 15}s`
                );


                container.appendChild(
                    snowflake
                );
            }
        }


        createSnowflakes(
            document.getElementById(
                "snowFar"
            ),
            20
        );


        createSnowflakes(
            document.getElementById(
                "snowMid"
            ),
            15
        );


        createSnowflakes(
            document.getElementById(
                "snowNear"
            ),
            10
        );


        /* =========================================================
           DURATION MANIFEST
        ========================================================= */

        async function loadDurationManifest() {

            try {

                const response =
                    await fetch(
                        DURATION_MANIFEST,
                        {
                            cache:
                                "no-store"
                        }
                    );


                if (
                    !response.ok
                ) {

                    throw new Error(
                        "Duration manifest unavailable"
                    );
                }


                const data =
                    await response.json();


                if (
                    !data ||
                    !Array.isArray(
                        data.songs
                    )
                ) {

                    throw new Error(
                        "Invalid duration manifest"
                    );
                }


                return data.songs;

            } catch (error) {

                console.warn(
                    "Could not load durations.json. Falling back to MP3 metadata.",
                    error
                );


                return null;
            }
        }


        /* =========================================================
           FALLBACK METADATA READER
        ========================================================= */

        function getAudioDuration(url) {

            return new Promise(
                (resolve, reject) => {

                    const audio =
                        document.createElement(
                            "audio"
                        );


                    let finished = false;


                    const cleanup =
                        () => {

                            audio.removeAttribute(
                                "src"
                            );

                            audio.load();

                        };


                    const timeout =
                        setTimeout(
                            () => {

                                if (
                                    finished
                                ) {
                                    return;
                                }


                                finished = true;


                                cleanup();


                                reject(
                                    new Error(
                                        "Timed out reading audio duration"
                                    )
                                );

                            },
                            15000
                        );


                    audio.preload =
                        "metadata";


                    audio.addEventListener(
                        "loadedmetadata",
                        () => {

                            if (
                                finished
                            ) {
                                return;
                            }


                            const duration =
                                audio.duration;


                            if (
                                Number.isFinite(
                                    duration
                                ) &&
                                duration > 0
                            ) {

                                finished =
                                    true;


                                clearTimeout(
                                    timeout
                                );


                                cleanup();


                                resolve(
                                    duration
                                );

                            } else {

                                finished =
                                    true;


                                clearTimeout(
                                    timeout
                                );


                                cleanup();


                                reject(
                                    new Error(
                                        "Invalid audio duration"
                                    )
                                );
                            }

                        },
                        {
                            once:
                                true
                        }
                    );


                    audio.addEventListener(
                        "error",
                        () => {

                            if (
                                finished
                            ) {
                                return;
                            }


                            finished =
                                true;


                            clearTimeout(
                                timeout
                            );


                            cleanup();


                            reject(
                                new Error(
                                    "Could not load audio"
                                )
                            );

                        },
                        {
                            once:
                                true
                        }
                    );


                    audio.src =
                        url;
                }
            );
        }


        /* =========================================================
           LOAD DURATIONS
        ========================================================= */

        async function loadDurations() {

            if (
                metadataLoaded
            ) {

                return;
            }


            if (
                metadataLoadingPromise
            ) {

                return metadataLoadingPromise;
            }


            metadataLoadingPromise =
                (async () => {

                    const manifest =
                        await loadDurationManifest();


                    durations =
                        new Array(
                            SONG_NAMES.length
                        );


                    if (
                        manifest
                    ) {

                        for (
                            let i = 0;
                            i < SONG_NAMES.length;
                            i++
                        ) {

                            const songName =
                                SONG_NAMES[i];


                            const entry =
                                manifest.find(
                                    item =>
                                        item &&
                                        item.name ===
                                        songName
                                );


                            if (
                                entry &&
                                Number.isFinite(
                                    Number(
                                        entry.duration
                                    )
                                ) &&
                                Number(
                                    entry.duration
                                ) > 0
                            ) {

                                durations[i] =
                                    Number(
                                        entry.duration
                                    );
                            }
                        }
                    }


                    for (
                        let i = 0;
                        i < SONG_NAMES.length;
                        i++
                    ) {

                        if (
                            Number.isFinite(
                                durations[i]
                            ) &&
                            durations[i] > 0
                        ) {

                            continue;
                        }


                        try {

                            durations[i] =
                                await getAudioDuration(
                                    getSongURL(
                                        SONG_NAMES[i]
                                    )
                                );

                        } catch (error) {

                            console.error(
                                `Could not get duration for ${SONG_NAMES[i]}`,
                                error
                            );


                            durations[i] =
                                0;
                        }
                    }


                    totalPlaylistDuration =
                        durations.reduce(
                            (
                                total,
                                duration
                            ) =>
                                total +
                                (
                                    Number.isFinite(
                                        duration
                                    )
                                        ? duration
                                        : 0
                                ),
                            0
                        );


                    if (
                        totalPlaylistDuration <=
                        0
                    ) {

                        throw new Error(
                            "No valid song durations were found."
                        );
                    }


                    metadataLoaded =
                        true;


                    console.log(
                        "Radio playlist duration:",
                        formatTime(
                            totalPlaylistDuration
                        )
                    );

                })()
                .catch(
                    error => {

                        metadataLoadingPromise =
                            null;

                        throw error;
                    }
                );


            return metadataLoadingPromise;
        }


        /* =========================================================
           FIND LIVE SONG
        ========================================================= */

        function findCurrentSong() {

            if (
                !metadataLoaded ||
                totalPlaylistDuration <= 0
            ) {

                return {
                    index: 0,
                    offset: 0
                };
            }


            const now =
                Date.now();


            let elapsed =
                (
                    now -
                    RADIO_START
                ) / 1000;


            elapsed =
                (
                    elapsed %
                    totalPlaylistDuration +
                    totalPlaylistDuration
                ) %
                totalPlaylistDuration;


            let accumulated =
                0;


            for (
                let i = 0;
                i < durations.length;
                i++
            ) {

                const duration =
                    durations[i] || 0;


                if (
                    elapsed <
                    accumulated +
                    duration
                ) {

                    return {

                        index:
                            i,

                        offset:
                            elapsed -
                            accumulated

                    };
                }


                accumulated +=
                    duration;
            }


            return {
                index: 0,
                offset: 0
            };
        }


        /* =========================================================
           DISPLAY CURRENT SONG
        ========================================================= */

        function updateSongDisplay(
            index
        ) {

            if (
                index >= 0 &&
                index <
                    SONG_NAMES.length
            ) {

                songNameElement
                    .textContent =
                    SONG_NAMES[index];
            }
        }


        /* =========================================================
           PLAY CURRENT LIVE POSITION
        ========================================================= */

        async function playLive() {

            try {

                await loadDurations();


                const position =
                    findCurrentSong();


                currentSongIndex =
                    position.index;


                currentSongOffset =
                    position.offset;


                updateSongDisplay(
                    currentSongIndex
                );


                updateLiveMediaSession();


                const url =
                    getSongURL(
                        SONG_NAMES[
                            currentSongIndex
                        ]
                    );


                const absoluteURL =
                    new URL(
                        url,
                        location.href
                    ).href;


                if (
                    musicAudio.src !==
                    absoluteURL
                ) {

                    musicAudio.src =
                        url;

                    musicAudio.load();
                }


                if (
                    musicAudio.readyState <
                    1
                ) {

                    await new Promise(
                        resolve => {

                            const onMetadata =
                                () => {

                                    musicAudio
                                        .removeEventListener(
                                            "loadedmetadata",
                                            onMetadata
                                        );

                                    resolve();
                                };


                            musicAudio
                                .addEventListener(
                                    "loadedmetadata",
                                    onMetadata
                                );
                        }
                    );
                }


                const targetOffset =
                    findCurrentSong();


                if (
                    targetOffset.index !==
                    currentSongIndex
                ) {

                    currentSongIndex =
                        targetOffset.index;


                    currentSongOffset =
                        targetOffset.offset;


                    updateSongDisplay(
                        currentSongIndex
                    );


                    musicAudio.src =
                        getSongURL(
                            SONG_NAMES[
                                currentSongIndex
                            ]
                        );


                    musicAudio.load();


                    await new Promise(
                        resolve => {

                            const onMetadata =
                                () => {

                                    musicAudio
                                        .removeEventListener(
                                            "loadedmetadata",
                                            onMetadata
                                        );

                                    resolve();
                                };


                            musicAudio
                                .addEventListener(
                                    "loadedmetadata",
                                    onMetadata
                                );
                        }
                    );


                    updateLiveMediaSession();

                } else {

                    currentSongOffset =
                        targetOffset.offset;
                }


                try {

                    musicAudio.currentTime =
                        currentSongOffset;

                } catch (error) {

                    console.warn(
                        "Could not seek immediately:",
                        error
                    );
                }


                /*
                    Establish the initial real position
                    before playback begins.
                */

                realPlaybackPosition =
                    musicAudio.currentTime;


                await musicAudio.play();


                radioPlaying =
                    true;


                updatePlayButton();


                lastSyncTime =
                    Date.now();


                realPlaybackPosition =
                    musicAudio.currentTime;


                updateLiveMediaSession();


                if (
                    "mediaSession" in navigator
                ) {

                    try {

                        navigator.mediaSession
                            .playbackState =
                            "playing";

                    } catch {}
                }

            } catch (error) {

                console.error(
                    "Could not start live radio:",
                    error
                );


                radioPlaying =
                    false;


                updatePlayButton();


                songNameElement
                    .textContent =
                    "Tap Start Live Radio to begin";
            }
        }


        /* =========================================================
           PAUSE
        ========================================================= */

        function pauseRadio() {

            musicAudio.pause();

            speechAudio.pause();


            radioPlaying =
                false;


            updatePlayButton();


            if (
                "mediaSession" in navigator
            ) {

                try {

                    navigator.mediaSession
                        .playbackState =
                        "paused";

                } catch {}
            }
        }


        /* =========================================================
           RESUME LIVE
        ========================================================= */

        async function resumeLive() {

            speechAudio.pause();

            speechStarted =
                false;


            await playLive();
        }


        /* =========================================================
           BUTTON
        ========================================================= */

        function updatePlayButton() {

            if (
                radioPlaying
            ) {

                playButton.textContent =
                    "⏸ Pause";


                playButton.classList
                    .remove(
                        "paused"
                    );

            } else {

                playButton.textContent =
                    "▶️ Play";


                playButton.classList
                    .add(
                        "paused"
                    );
            }
        }


        playButton.addEventListener(
            "click",
            async () => {

                if (
                    radioPlaying
                ) {

                    pauseRadio();

                } else {

                    await resumeLive();
                }
            }
        );


        /* =========================================================
           AUTOMATIC NEXT SONG
        ========================================================= */

        musicAudio.addEventListener(
            "ended",
            async () => {

                if (
                    !radioPlaying
                ) {
                    return;
                }


                await playLive();
            }
        );


        /* =========================================================
           AUDIO ERROR RECOVERY
        ========================================================= */

        musicAudio.addEventListener(
            "error",
            async () => {

                if (
                    !radioPlaying
                ) {
                    return;
                }


                console.warn(
                    "Music playback error. Resynchronizing..."
                );


                setTimeout(
                    async () => {

                        if (
                            radioPlaying
                        ) {

                            await playLive();
                        }

                    },
                    1000
                );
            }
        );


        /* =========================================================
           VISIBILITY / RETURN TO PAGE
        ========================================================= */

        document.addEventListener(
            "visibilitychange",
            async () => {

                if (
                    document.visibilityState !==
                    "visible"
                ) {
                    return;
                }


                if (
                    !radioPlaying
                ) {
                    return;
                }


                const now =
                    Date.now();


                if (
                    now -
                    lastSyncTime <
                    3000
                ) {

                    return;
                }


                lastSyncTime =
                    now;


                try {

                    const live =
                        findCurrentSong();


                    if (
                        live.index !==
                        currentSongIndex
                    ) {

                        await playLive();

                        return;
                    }


                    const expected =
                        live.offset;


                    const actual =
                        musicAudio.currentTime;


                    if (
                        Math.abs(
                            expected -
                            actual
                        ) > 3
                    ) {

                        await playLive();

                    } else {

                        realPlaybackPosition =
                            actual;

                        updateLiveMediaSession();
                    }

                } catch (error) {

                    console.warn(
                        "Resync failed:",
                        error
                    );
                }
            }
        );


        /* =========================================================
           PERIODIC LIVE SYNC
        ========================================================= */

        setInterval(
            async () => {

                if (
                    !radioPlaying
                ) {
                    return;
                }


                try {

                    const live =
                        findCurrentSong();


                    if (
                        live.index !==
                        currentSongIndex
                    ) {

                        await playLive();

                        return;
                    }


                    const drift =
                        Math.abs(
                            musicAudio.currentTime -
                            live.offset
                        );


                    if (
                        drift > 5
                    ) {

                        correctingSeek =
                            true;


                        musicAudio.currentTime =
                            live.offset;


                        realPlaybackPosition =
                            live.offset;


                        requestAnimationFrame(
                            () => {

                                correctingSeek =
                                    false;

                            }
                        );

                    } else {

                        realPlaybackPosition =
                            musicAudio.currentTime;
                    }


                    lastSyncTime =
                        Date.now();


                    updateLiveMediaSession();

                } catch (error) {

                    console.warn(
                        "Periodic sync failed:",
                        error
                    );
                }

            },
            5000
        );


        /* =========================================================
           PREVENT SEEKING THROUGH KEYBOARD
        ========================================================= */

        document.addEventListener(
            "keydown",
            event => {

                const blockedKeys = [

                    "ArrowLeft",

                    "ArrowRight",

                    "Home",

                    "End",

                    "MediaTrackNext",

                    "MediaTrackPrevious",

                    "MediaFastForward",

                    "MediaRewind"

                ];


                if (
                    blockedKeys.includes(
                        event.key
                    )
                ) {

                    event.preventDefault();
                }
            }
        );


        /* =========================================================
           PREVENT CONTEXT MENU
        ========================================================= */

        document.addEventListener(
            "contextmenu",
            event => {

                event.preventDefault();
            }
        );


        /* =========================================================
           INITIAL STATE
        ========================================================= */

        updatePlayButton();


        songNameElement.textContent =
            "Christmas Radio Ready";


        loadDurations()
            .then(
                () => {

                    const live =
                        findCurrentSong();


                    currentSongIndex =
                        live.index;


                    currentSongOffset =
                        live.offset;


                    updateSongDisplay(
                        live.index
                    );


                    updateLiveMediaSession();

                }
            )
            .catch(
                error => {

                    console.error(
                        "Radio metadata initialization failed:",
                        error
                    );
                }
            );


        /* =========================================================
           BEFORE UNLOAD
        ========================================================= */

        window.addEventListener(
            "beforeunload",
            () => {

                musicAudio.pause();

                speechAudio.pause();

            }
        );

    </script>

</body>
